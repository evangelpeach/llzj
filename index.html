<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>铃兰之剑搜索 v9</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1c2333; --sub:#6b7387;
  --brand:#3b5bdb; --brand2:#5c7cfa; --gold:#b7791f;
  --line:#e3e7f0; --mark:#fff3bf; --chip:#eef2ff;
  --r-shadow:0 2px 10px rgba(28,35,51,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 60px}
/* 顶栏 */
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#3b5bdb,#5c7cfa);
  margin:-16px -14px 14px;padding:18px 14px 14px;box-shadow:var(--r-shadow)}
header h1{color:#fff;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
header h1 .sword{font-size:22px}
.ravatar{width:30px;height:30px;border-radius:6px;object-fit:cover;flex:none}
.ravatar-lg{width:48px;height:48px;border-radius:10px;object-fit:cover;vertical-align:middle;margin-right:8px}
.sicon{width:22px;height:22px;border-radius:5px;object-fit:cover;flex:none}
.grant-title{margin-top:8px;margin-bottom:6px;font-weight:bold}
.bkinfo{margin:10px 0;padding:10px 12px;border:1px solid #54b4db;border-left:3px solid #54b4db;background:rgba(84,180,219,.08);border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-line}
.bkinfo .fnote{margin-left:4px}
.ps-item{margin:4px 0;border:1px solid rgba(127,127,127,.25);border-radius:8px;overflow:hidden}
.ps-item .skill-head{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 8px;background:rgba(127,127,127,.08)}
.chev{color:#888;transition:transform .15s}
.ps-item.open .chev{transform:rotate(90deg)}
header h1 .ver{font-size:11px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:1px 8px;font-weight:600;letter-spacing:0}
.stats{color:rgba(255,255,255,.85);font-size:12px;margin-top:2px}
.searchbar{display:flex;gap:8px;margin-top:12px}
.searchbar input{flex:1;border:none;border-radius:12px;padding:12px 16px;font-size:16px;
  background:#fff;outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.searchbar input:focus{box-shadow:inset 0 0 0 2px var(--brand)}
.searchbar button{border:none;border-radius:12px;padding:0 18px;background:#1c2333;color:#fff;
  font-size:15px;cursor:pointer}
.searchbar button:active{opacity:.85}
/* 筛选chips */
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:none;border-radius:20px;padding:6px 16px;font-size:13px;background:var(--chip);
  color:var(--brand);cursor:pointer;font-weight:500}
.chip.on{background:var(--brand);color:#fff}
/* 结果 */
.sect-title{font-size:14px;color:var(--sub);margin:14px 2px 8px;display:flex;align-items:center;gap:6px}
.sect-title .badge{background:var(--chip);color:var(--brand);border-radius:10px;padding:0 8px;font-size:12px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--r-shadow);cursor:pointer;transition:transform .08s}
.card:active{transform:scale(.985)}
.card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .name{font-size:17px;font-weight:700}
.tag{font-size:11px;border-radius:6px;padding:1px 7px;background:var(--chip);color:var(--brand);white-space:nowrap}
.tag.gold{background:#fff6e6;color:var(--gold)}
.tag.gray{background:#f0f1f5;color:var(--sub)}
.hits{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.hit{font-size:13px;color:var(--sub);background:#f8f9fc;border-radius:8px;padding:6px 10px}
.hit b{color:var(--ink);font-weight:600}
.hit .more{color:var(--brand);font-size:12px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
/* 详情 */
.detail{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--r-shadow)}
.detail .back{border:none;background:var(--chip);color:var(--brand);border-radius:10px;
  padding:6px 14px;font-size:13px;cursor:pointer;margin-bottom:12px}
.detail h2{font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail .meta{color:var(--sub);font-size:13px;margin:4px 0 10px}
.wiki-link{display:inline-block;font-size:13px;color:var(--brand);text-decoration:none;
  border:1px solid var(--brand2);border-radius:8px;padding:3px 12px;margin-top:6px}
.block{margin-top:14px}
.block h3{font-size:15px;color:var(--brand);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.block h3::before{content:"";width:4px;height:14px;background:var(--brand);border-radius:2px}
.desc{font-size:14px;white-space:pre-wrap;background:#f8f9fc;border-radius:10px;padding:10px 12px}
.skill-item{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.skill-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.skill-head .sname{font-weight:600;font-size:15px}
.skill-head .arrow{margin-left:auto;color:var(--sub);transition:transform .15s;font-size:12px}
.skill-item.open .arrow{transform:rotate(90deg)}
.skill-body{display:none;padding:0 12px 12px;font-size:13.5px}
.skill-item.open .skill-body{display:block}
.skill-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.facs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.fac{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#6b4f2a;
  background:linear-gradient(135deg,#fdf6e3,#fbedc9);border:1px solid #e8d5a8;
  border-radius:14px;padding:2px 10px 2px 4px;font-weight:500}
.fac img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.ctag{font-size:11px;border-radius:6px;padding:0 7px;font-weight:600;white-space:nowrap}
.gtg{font-size:11px;border-radius:6px;padding:0 7px;font-weight:600;white-space:nowrap;
  background:#f3e8ff;color:#7c3aed;margin-right:2px}
/* filter 栏：分行 */
.fbar{background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;margin:10px 0 2px;display:flex;flex-direction:column;gap:5px}
.frow{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;align-items:center;-webkit-overflow-scrolling:touch}
.frow.wrap{flex-wrap:wrap}
.frow::-webkit-scrollbar{display:none}
.flabel{font-size:12px;color:var(--sub);white-space:nowrap;font-weight:600;flex:none}
.fsep{display:none}
.fchip{flex:none;font-size:12px;border:1px solid var(--line);background:var(--paper);
  border-radius:14px;padding:3px 10px;color:var(--ink);cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:3px}
.fchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.fcico{width:16px;height:16px;border-radius:50%}
.fnote{font-size:11px;color:var(--sub);font-weight:400}
.via{font-size:11px;color:var(--sub);margin-left:4px}
.tag.choice{background:#fff7ed;color:#c2410c;border-color:#fdba74}
.branches{margin-top:8px;border-left:3px solid #fdba74;padding-left:8px}
.br-title{font-size:12px;color:#c2410c;font-weight:600;margin-bottom:4px}
.br-item{margin-bottom:8px;padding:6px 8px;background:var(--chip);border-radius:8px}
.br-item .desc{font-size:12px;color:var(--sub);margin-top:3px}
/* 中括号链接 & 关联行 */
.bk{color:var(--brand);cursor:pointer;text-decoration:underline dotted;text-decoration-color:rgba(139,92,42,.4);text-underline-offset:3px}
.bk:active{opacity:.6}
.plink{color:var(--brand);cursor:pointer;text-decoration:underline dotted}
.relrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:5px}
.relrow .flabel{flex:none}
.ctag.ally{background:#e6f7ee;color:#0a7d43}
.ctag.enemy{background:#fdeaea;color:#c0392b}
.ctag.self{background:#e8f0fe;color:#2b5bb8}
.star-row{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.star-label{flex:none;width:44px;text-align:center;font-size:12px;color:var(--sub);
  background:#f0f1f5;border-radius:8px;padding:3px 0;margin-top:2px}
.star-label.max{background:#fff6e6;color:var(--gold);font-weight:700}
.star-row .desc{flex:1}
.desc.flavor{font-style:italic;color:var(--sub)}
/* 空状态 */
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px}
.hot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.hot button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 14px;
  font-size:13px;color:var(--ink);cursor:pointer}
.hot button:active{background:var(--chip)}
.footer-note{text-align:center;color:#a0a6b8;font-size:11px;margin-top:24px}
#backTop{position:fixed;right:16px;bottom:20px;border:none;background:var(--brand);color:#fff;
  width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;display:none;
  box-shadow:0 4px 12px rgba(59,91,219,.4);z-index:30}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="sword">⚔️</span>铃兰之剑搜索 <span class="ver">v9</span></h1>

  <div class="chips" id="chips">

  <div id="main"></div>
  <div class="footer-note">数据来源：铃兰之剑BWIKI（wiki.biligame.com/llzj）· 仅供学习参考</div>
</div>

"c": "", "cd": "", "r": "", "a": ""}, "世界的协奏": {"d": "（被动）[虚空投影]拥有[协同响应]，效果：对自身十字范围4格内所有敌人，由[菲娜塔]造成30%魔攻值的[穿透伤害]，每回合每个[虚空投影]最多触发1次。✦自身的专属攻击技能获得[协同号令]标签。✦[虚空投影]受到[归于虚空]时，触发其[协同响应]。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "干扰战术": {"d": "（反应）被单体攻击时，若没有[闪避]，则进行[先制]，对攻击者施加[致盲]（持续1回合）；若被范围攻击，则进行[先制]，对攻击者施加[目眩]（持续1回合），每回合先制效果最多触发2次。✦若进入[潜袭形态]，则获得额外效果：被主动攻击后，瞬移至对方身后，进行[反击]，造成物攻值40%的[穿透伤害]，并获得1次[闪避]（持续2回合），每回合最多触发1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "外勤准则": {"d": "（被动）速度增加50点；首个战斗回合时，速度额外增加50点。[健康]状态时，受到伤害降低20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "旧影余息": {"d": "（被动）场上任意角色被击败时，获得[野兽狂热]，持续3回合。主动攻击敌人后，回复1点能量；若击败目标，则额外回复1点能量，每回合本技能最多回复4点能量。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rr": ["科尔•破晓之影"]}, "巡行庇护": {"d": "（反应）被[巡光使]环绕的目标，在其行动开始时获得对应效果：✦若是己方，则获得[免伤2]、[穿透免伤2]，持续2回合。✦若是敌方，则被施加[致盲]、[目眩]，持续2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "谋定后动": {"d": "（被动）行动开始时或任意行动后，若具有技能[圣光审判]且其不处于冷却回合，则获得8层[明察]，战斗中最多触发1次。✦每逢4倍数的战斗回合开始时，重置本效果触发次数。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["圣光审判"]}, "洞察先机": {"d": "（被动）[巡行庇护]额外拥有：被[巡光使]环绕的目标，在发生交战前，额外对双方触发技能[巡行庇护]的对应效果。✦此技能效果作用于敌方时，额外施加[▼攻击5]，持续1回合，每个目标生效后冷却4回合。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["巡行庇护"]}, "虔信": {"d": "（被动）自身[虔诚值]大于等于10点时，攻击提高15%，防御提高30%。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "孤芒照痕": {"d": "（被动）若攻击时，目标已有同向[剑痕]，则施加另一方向[剑痕]，以此方法触发的[十字锋芒]的最终伤害降低50%。✦若以[先制]触发本效果，则[十字锋芒]的最终伤害由降低50%改至降低20%，且该次交战中最终防御提高50%。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "凛耀•流云剑幕": {"d": "（反应）防御提高40%，拥有[格挡]和[震慑先制]。✦同时可以格挡魔法攻击、[范围]攻击。被任意方向攻击时，100%概率触发[格挡]，且格挡时防御额外提高40%。✦触发[震慑先制]时（每回合可触发2次），以[普攻]造成其一半伤害；若以[先制]击败目标或触发[十字锋芒]，则该回合先制次数增加1，每回合最多增加2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "断罪十字": {"d": "（被动）当前行动内，若对同一敌人施加2种[剑痕]，则对其触发[十字锋芒]时，攻击提高60%。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "凛耀剑华": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%；✦伤害、穿透伤害额外提高15%，对拥有[剑痕]或曾触发过[十字锋芒]的敌人，伤害、穿透伤害再额外提高15%。✦[狄奥娜]额外拥有效果：交战前，获得[▲攻击3]、[▲物防3]及[▲魔防3]，持续2回合。", "t": "领袖光环", "c": "", "cd": "", "r": "", "a": ""}, "予人明光": {"d": "（被动）主动治疗后，使己方获得[▲暴击2]、[▲暴伤2]及1层[防御加护]，所有效果持续2回合。✦拥有光环，效果：自身范围4格内的阵营己方，暴击率额外提高20%，暴击伤害额外提高10%，并拥有[穿透附加•暴击]。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "微光不熄": {"d": "（反应）受到伤害后，若生命值低于50%，则治疗自身，治疗量为魔攻值100%，并获得10层[防御加护]（持续2回合），触发后冷却3回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "庇护众生之翼": {"d": "（反应）受到伤害降低25%；根据拥有的[虔诚值]和[万千祈愿之光]总数，每点额外降低0.5%，最多降低25%。✦被击败时，若可消耗25点[万千祈愿之光]，则触发[强力不屈]，每回合最多触发1次。触发此效果后，无法再获得[万千祈愿之光]，持续至下次行动结束。", "t": "反应", "c": "", "cd": "", "r": "", "a": "", "rr": ["萨曼莎•审判"]}, "圣光示罪": {"d": "（被动）技能[审判之剑]攻击前，对目标施加[审判]、[易伤1]，持续2回合。✦技能[审判之剑]对拥有[审判]的敌人，伤害提高10%。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["审判之剑"]}, "圣光示罪+": {"d": "（被动）技能[审判之剑]攻击前，对目标施加[审判]、[易伤2]，持续2回合。✦技能[审判之剑]对拥有[审判]的敌人，伤害提高20%。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["审判之剑"]}, "犯者必诛": {"d": "（被动）被攻击时，若攻击者所在方向的3*4区域存在敌人，则进行[震慑反击]，对范围内敌人造成物攻值60%的穿透范围伤害；且反击前对目标施加[穿透易伤2]，持续2回合，每回合最多触发1次（可消耗[反击战意]以额外触发）。携带技能[枪锋屹立]时，本技能攻击提高35%。✦主动攻击后，自身获得[免伤2]（持续2回合），并对目标施加[被讽]，持续1回合，若命中多个目标则最多施加2次。✦自身每拥有1个[特定防御类增益]，防御额外提高2%，最多提高30%。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["枪锋屹立"]}, "枪锋屹立": {"d": "（被动）最大生命值提高40%。被攻击前，对攻击者施加[被讽]、[▼攻击2]及[▼伤害2]，持续2回合，每回合最多触发2次。✦被拥有[控制]的目标攻击时，受到伤害降低30%。✦自身拥有[不屈]，触发时回复70%生命值，冷却4回合。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["犯者必诛"]}, "威风凛冽": {"d": "（反应）最大生命值提高20%。被自身范围2格内敌人攻击时，受到伤害降低30%。✦被敌人攻击时，若攻击者的攻击总值小于自身防御总值的250%，则对攻击者造成自身物攻值40%的[穿透伤害]，每回合最多触发2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "蜕逃": {"d": "（反应）被任意攻击时，进行[全域闪避]，每回合触发1次。✦受到伤害后，若处于[濒死]状态，则获得[蛇影迷踪]（持续1回合）和[再生3]（持续3回合），触发后此效果冷却7回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "贪噬之牙": {"d": "（被动）攻击时，根据目标[剧毒]层数和所缺能量，每层或每点提高8%攻击，最多40%。攻击后，施加[能量流失1]，持续2回合。✦技能[狂蛇之影]使用时，将目标全部[剧毒]附加在技能倍率上，攻击后驱散全部[剧毒]。✦场上任意拥有[剧毒]或[感染]的敌人被击败时，自身回复15%生命值、1点能量。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["狂蛇之影"]}, "悖信": {"d": "（被动）自身[虔诚值]小于等于-10点时，攻击提高15%，防御提高30%。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "高地优势": {"d": "（反应）被主动攻击时，受到伤害降低8%，被[低地]攻击时，受到伤害额外降低30%伤害。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "激活力量": {"d": "（反应）受到治疗效果提高10%，受到治疗后获得[▲伤害2]，持续1回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "顽强": {"d": "（反应）被[克制职业]主动攻击时，受到伤害降低25%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "生存大师": {"d": "（反应）被主动攻击时，受到伤害降低8%，受到[环境伤害]降低70%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "忍耐": {"d": "（反应）受到[持续伤害]降低50%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "孤胆": {"d": "（被动）若自身范围2格内没友军时，攻防属性提高8%，暴击率提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "冰之庇护": {"d": "（反应）被携带[▼移动]的敌人主动攻击时，受到伤害降低30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "活性化": {"d": "（反应）受到治疗效果提高30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "冰面作战": {"d": "（被动）处于[冰冻]地形格时，受到伤害降低30%，移动力增加1格。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "卸力": {"d": "（反应）被主动攻击前，对方每移动1格，自身受到伤害降低5%，最多25%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "沙海战士": {"d": "（被动）免疫[致盲]。主动攻击后，若目标处于[土地]、[沙地]、[荒地]、[流沙]地形格，则附加10%攻击的[沙属性][穿透伤害]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "铁卫森严": {"d": "（反应）被敌人攻击时：若自身范围2格内没有己方[帝国不朽军]，受到伤害降低50%；若有，则受到范围伤害降低80%。触发任意效果后冷却1回合。", "t": "反应", "c": "", "cd": "1", "r": "", "a": ""}, "帝国死士": {"d": "（被动）使[帝国不朽军]可主动行动，移动力增加3格，拥有技能[决死冲锋]。✦[决死冲锋]导致[帝国不朽军]被击败或离场（每累计达3名），[基安希尔]行动开始时受到1层[兵员紧缺]，持续1回合，并获得4层[解放]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "总揽大局": {"d": "（被动）行动结束时，获得4层[解放]，能量小于1点则额外回复1点。✦召唤时，使[召唤角色]获得[无限不屈]但受到敌人攻击后立刻触发[不朽战骸]并随后[离场]。每回合最多使2名[召唤角色]获得本效果。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "军令如山": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%；场上所有已方召唤角色，伤害提高20%，若拥有[解放]，则暴击率额外提高20%、暴击伤害额外提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "冰原游击": {"d": "（被动）攻击提高10%，攻击后，可再移动2格。✦途经{{中括号介绍|[冰冻]", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "北境战魂": {"d": "（被动）与敌人交战后，自身回复1点能量值，每回合最多触发1次。✦若与敌人交战时，自身或目标处于{{中括号介绍|[冰冻]", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "料敌机先": {"d": "（反应）被自身范围4格内[正、侧方]敌人主动单体攻击前，进行[先制]，造成50%物理伤害，击退1格，并打断行动，每回合最多触发1次。\n处于[以弃亡者之名！]的警戒期间时:✦受到来自[正、侧方]伤害降低60%。[先制]距离增加1格，且额外攻击目标1次。✦根据[多重爆裂]层数获得对应额外[先制]次数(持续1回合)，触发额外[先制]次数时，需消耗1层[多重爆裂]。", "t": "反应", "c": "", "cd": "", "r": "", "a": "", "rs": ["以弃亡者之名！"]}, "冰雪中的反抗": {"d": "（领袖光环）场上所有的己方，攻击提高10%，防御提高20%。对拥有[自然守护]的目标，伤害、穿透伤害提高10%；若目标处于[守护失效]，则伤害效果额外提高10%。✦额外拥有光环，效果：场上所有己方，{{中括号介绍|[警戒]", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "狂暴战意": {"d": "（被动）战斗开始时，获得[狂暴战意]，效果：✦非当前行动时：物攻提高10%，每层[渴血战斧]使物攻额外提高10%。✦每回合反击次数加2。反击或主动攻击后，获得1层[渴血战斧]，持续2回合。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "孤锋": {"d": "（被动）战斗开始时，获得[孤峰]，效果：✦攻击时若目标敌人数少于4，每少1名，攻击提高10%。✦[蛮熊形态]时，额外获得技能[掀山轰]。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["掀山轰"]}, "血性": {"d": "（被动）战斗开始时，获得[血性]，效果：✦主动攻击时，物攻提高20%；普攻时，物攻额外提高20%。✦[蛮熊形态]时，获得额外技能[暴怒吼]。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["暴怒吼"]}, "余震波": {"d": "（被动）最大生命值提高15%。战斗开始时，获得1层[血脉沸腾]和[余震波]，[余震波]效果：✦处于[蛮熊形态]时，行动结束时回复1点能量，技能[裂地震]使得范围内的可攻击[物品]传导[余震]，且[裂地震]可攻击友方[物品]，并对传导[余震]的[物品]的伤害降低99%。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "不屈抵抗": {"d": "（被动）战斗开始时，获得[不屈抵抗]，效果：✦[个性]触发的[无限不屈]在持续时间结束时，若自身[血脉沸腾]不少于2层，则消耗2层并使持续时间延长1回合。✦战斗回合数为7的倍数时，行动开始时获得2层[血脉沸腾]，并回复[个性]中触发[无限不屈]的次数。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "便携冻伤瓶": {"d": "（被动）战斗开始时，获得额外技能[冻伤瓶]。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["冻伤瓶"]}, "凛锋游击": {"d": "（被动）战斗开始时，获得[凛锋游击]，效果：✦攻击提高10%。攻击后，可再移动2格。✦途经[冰冻]地形格时不消耗移动力，每回合最多对2块地形格生效。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "小羊快跑": {"d": "（反应）速度提高200点。自身范围1圈内存在[物品]或[触发物]时，非近战技能最大射程增加1格。\n✦被攻击后，若处于[受伤]状态，则自身获得1个[苔原蜜果]，触发后冷却2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "捡到宝啦！": {"d": "（被动）场上己方拾取[碎冰]或[苔原蜜果]时：攻击后可再移动3格（持续1回合）；若拾取[碎冰]，[碎冰飞刃]使用次数额外加1，每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "能量补给": {"d": "（被动）场上已方拾取[苔原蜜果]时：获得[▲暴击2]、[▲暴伤2]，持续2回合； 阵营额外获得[暴击转化]、1层[糖分超标]，持续2回合。自身拾取时，再额外回复1点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "独行者的本能": {"d": "（反应）自身和[冰碴]受到伤害降低30%，范围2格内没有友军时，受到伤害额外降低20%。✦[冰碴]拥有[不屈]，触发时回复100%生命值，并获得[隐身]（持续1回合）、[免伤3]（持续2回合）。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "加点猛料": {"d": "（被动）自身和[冰碴]放置的[冰寒地刺]变成[爆裂地刺]。✦更改后区别：不再打断敌人行动、施加[极寒]、[▼攻击3]，但影响范围扩大至自身范围3格，造成伤害的倍率提高30%；对处于[指定地形•芬恩]的敌人，造成的[穿透伤害]提高20%，被攻击后受到[失温]（持续1回合）。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "猩红血契": {"d": "（被动）每主动攻击相同目标累计2次后，额外施加1层[流血]，持续2回合。\n✦拥有光环，效果：场上所有敌人，受到持续伤害提高20%。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "血棘蔓生": {"d": "（被动）[血棘之种]造成的[穿透伤害]提高25%；以本技能或以被击败的方式触发[血棘之种]时，所有受击目标向中心反向击退1格。\n[血棘之种]额外增加触发方式：\n✦拥有者行动结束时，若受到[定身]或未曾移动，则移除所有[血棘之种]。\n✦拥有者受到伤害，且该次伤害的技能倍率超过200%时，该次伤害、穿透伤害提高30%，随后移除所有[血棘之种]。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "血棘之花": {"d": "（被动）以非[待机]的方式结束行动时，可使用技能[落花之舞]，每回合最多触发1次。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "沸血重塑": {"d": "（反应）敌人每触发1层[血棘之种]效果时，[塞娜]回复35%魔攻值的生命值。✦[反击]次数额外增加3次，若是反击目标拥有[流血]，则[塞娜]回复50%魔攻值的生命值。✦拥有[不屈]，触发时，回复50%生命值（冷却2回合）。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "先刃": {"d": "（反应）被单体主动攻击前，若攻击者处于自身范围4格内，且自身没有[敛锋]，则进行[先制]：瞬移至目标身后，造成50%物理伤害，并打断目标行动，之后获得[敛锋]（持续至下次行动开始），冷却2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "寒锋不止": {"d": "（被动）击败目标时：自身获得[立刻行动]、3层[锋芒]，回复2点能量，主动[职业技能]冷却回合减1，技能[追刃]使用次数重置。触发后效果冷却3回合。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "猎宴": {"d": "（被动）行动开始时，若自身范围6格内存在敌人，自身获得[猎物的味道]、[▲暴击2]，所有效果持续2回合，且获得1层[锋芒]。效果冷却2回合。✦主动攻击时，伤害提高30%。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rr": ["阿加塔•凛冬极星"]}, "凝霜洞破": {"d": "（被动）行动开始时，获得[心眼]。释放技能[敛锋之姿]后：对正前方半圆4格内所有敌人施加[洞破]，持续1回合，自身获得2层[诱敌]，持续2回合。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["敛锋之姿"]}, "怒焰不息": {"d": "（被动）当[威慑]达3层时，释放技能[臣服,或毁灭]或[冰原震吼]后，若实际能量消耗大于等于7点，则自动触发[绝对意志]效果。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["臣服", "或毁灭", "冰原震吼"]}, "百战之躯": {"d": "（反应）拥有[格挡]。被任意方向攻击时，100%概率触发[格挡]，且格挡时受到伤害额外降低10%。✦可格挡[魔法攻击]及[范围攻击]，格挡此类攻击时，受到伤害再额外降低30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "雷霆战吼": {"d": "（被动）技能[绝对意志]额外回复2点能量。触发或释放[绝对意志]后：使自身范围3格内所有己方获得[再生3]、[▲攻击2]和所有[2级伤害增益]；对范围内敌人施加[▼攻击2]和所有[2级伤害减益]。所有效果持续3回合。✦自身所有攻击，都不会导致[粉碎]被移除。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "王者之势": {"d": "（被动）释放技能[臣服,或毁灭]或[冰原震吼]时，每拥有1层[威摄]，计数✦时额外加1点，且[穿透伤害]提高10%。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["臣服", "或毁灭", "冰原震吼"]}, "愈合祷言": {"d": "（被动）对友军主动释放技能后，额外治疗友军，治疗量为魔攻值的30%。✦行动结束时，治疗自身范围3格内生命百分比最低的友军，治疗量为魔攻值的20%。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "女神之佑": {"d": "（反应）受到穿透伤害降低15%；被主动攻击时，受到伤害降低15%。✦处于[受伤]状态时，可进行[震慑先制]，使自身获得[霜佑之印]（效果持续至下次行动开始时），效果冷却3回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "静聆神谕": {"d": "（被动）行动开始时，获得1点能量，且强制从技能[罚斥]、[神泽]及[默祷]选择1个使用，或执行[待机]；之后触发[再行动]。✦每个技能只能被选择1次，所有技能被使用后，重置[静聆神谕]技能，可再次被使用。", "t": "被动", "c": "", "cd": "", "r": "", "a": "", "rs": ["罚斥", "神泽", "默祷"]}, "皆归寒原": {"d": "（被动）主动攻击后，使技能范围内地形格变为[冰冻]。行动结束后，自身范围2格内所有地形格变为[冰冻]，持续2回合。✦拥有光环，效果：使场上所有己方拥有[皆归寒原]效果。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "晶能亲和": {"d": "（被动）行动结束时，额外回复1点能量，能量小于1时，回复2点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "庄严": {"d": "（光环）对自身范围2格内所有敌人，造成攻击降低10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "回能": {"d": "（反应）被主动攻击时，受到伤害降低8%。被主动攻击后，额外回复1点能量。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "洞察": {"d": "（被动）物攻提高8%，攻击前，驱散目标1个[防御属性增益]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "攻击指挥": {"d": "（光环）使自身范围2格内其他友军，攻击提高12%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "招架": {"d": "（被动）被[近战物理攻击]前，转向目标，把自身物攻值的20%加成在物防值上。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "求生意志": {"d": "（被动）行动开始时，自身处于[濒死]状态时，回复50%生命值、2点能量，冷却2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "火线行动": {"d": "（被动）速度增加50点。[健康]状态时，受到伤害降低20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "万事齐备": {"d": "（被动）[无伤]状态时，暴击率提高20%、暴击伤害提高10%", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "愈合之链": {"d": "（被动）行动结束时，治疗自身范围3格内生命百分比最低的友军，治疗量为魔攻值的50%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "机动游击": {"d": "（被动）主动攻击后可[再移动]，继承剩余移动力。✦行动开始时，若场上[枪影]小于4个，在自身范围2格随机[空地]生成1个[枪影]。行动结束时，可使用[游击]。✦拥有[协同响应]，效果：自身获得[▲速度3]、[▲移动1]及[▲攻击2]，持续1回合，每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": "", "rs": ["游击2"]}, "锋光乍现": {"d": "（反应）受到伤害降低10%。被[正、侧方]敌人攻击时，则触发[先制]，可打断其行动，造成50%物理伤害，传送至最近的[枪影]处并拾取，若没有[枪影]则传送到自身范围6格内最近友军周围。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "灵动英姿": {"d": "（反应）受到[范围伤害]降低50%。拥有1次[闪避]，触发后冷却2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "荣誉感": {"d": "（被动）[健康]状态时，暴击率、暴击伤害提高30%。暴击时，回复1点能量，每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "风之歌": {"d": "（被动）物攻提高20%。攻击时，每拥有1层[解放]，额外使自身[解放枷锁]技能的伤害提高2%，最多20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "解放•坚韧": {"d": "（反应）处于[受伤]状态时，自身每拥有1层[解放]，防御提高3%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "镇恶": {"d": "（反应）拥有[失焦]。战斗开始及行动结束时，获得1次[闪避]和[偏斜]，冷却3回合，已具有[闪避]和[偏斜]时不发动此效果。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "轻纱藏影": {"d": "（反应）行动结束时，获得[免伤2]，持续1回合。受到伤害后，处于[濒死]状态时，获得[闪避]，在持续期间不限次数触发，持续1回合，该效果触发后冷却7回合。", "t": "反应", "c": "", "cd": "7", "r": "", "a": ""}, "幻戏缭乱": {"d": "（被动）行动结束时若自身范围2格内没有友军，则获得1次[闪避]，持续1回合。触发[闪避]时，可对自身范围3格内攻击者进行[反击]，造成30%物理伤害，并施加物攻值30%的[生命流失]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "利刃•改": {"d": "（被动）主动攻击时，伤害提高10%，回合外攻击提高10%。主动攻击后额外对目标施加[▼攻击2]、[×受治疗]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "绝对踏实感重甲": {"d": "（反应）拥有[格挡]，同时可以格挡[物理范围]攻击。被任意方向攻击时，100%概率触发[格挡]。被攻击前，进行[先制]，获得3层[满满安全感护盾]，持续1回合，每回合最多触发2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "勇气连心": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高15%，防御提高30%。若拥有[护盾]，则伤害提高10%，受到伤害降低10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "辉光剑壁": {"d": "（反应）被主动攻击后，获得生命值25%的[物理护盾]，每回合最多触发2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "瞬光夺目": {"d": "（被动）传送[光棱晶石]时，使[光棱晶石]获得[▲攻击3]、[▲伤害2]及[▲暴击2]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "匠心": {"d": "（被动）[光棱晶石]在技能[重构•镜反]释放时，获得[叶伽内]额外获得的所有效果；当拥有10层[解放]并释放该技能时，[光棱晶石]额外获得1次[偏斜]。✦[光棱晶石]拥有[免伤]系列时，可使其效果翻倍；行动结束或被攻击时触发的[晶棱折射]伤害倍率下降15%，可产生20%[生命汲取]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "能工巧匠": {"d": "（反应）自身和[光棱晶石]受到伤害降低10%。行动开始时，治疗[光棱晶石]，治疗量为魔攻值的60%，再驱散2个[减益]。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "光棱启明": {"d": "（被动）攻击提高10%，防御降低8%。✦[叶迦内]、[光棱晶石]暴击或击败敌人时，[叶迦内]获得5层[解放]，每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "群山回音": {"d": "（反应）受到伤害降低20%。✦被敌人攻击时：治疗自身，治疗量为魔攻值的50%，若处于&#91;维持&#93;状态，则立即触发1次&#91;维持&#93;效果，冷却2回合。", "t": "反应", "c": "", "cd": "2", "r": "", "a": ""}, "归乡号角": {"d": "（光环）使自身范围4格内所有己方，暴击率提高20%，暴击伤害提高5%；若目标拥有[解放]，暴击率额外提高10%，暴击伤害额外提高5%。✦自身拥有额外效果：被受到[受治疗逆转]类效果的敌人攻击时，受到伤害降低25%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "闪转腾挪": {"d": "（反应）受到伤害降低20%，受到远程伤害额外降低20%。被单体攻击时，进行[闪避]，每回合最多触发1次。✦自身范围3格内的友军受到[物理攻击]时，对其进行[援护防御]。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "辛特拉的幼狮": {"d": "（反应）使用技能[闪现]后，获得3层最大生命值50%的[伤害锁定]。被攻击后、或使用包含[传送]、或[冲锋]效果的技能后，回复40%已损失生命值，每回合最多触发2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "魔法屏障": {"d": "（反应）被单体物理或单体魔法攻击前，进行[先制]，可获得自身60%魔攻值的对应伤害类型[护盾]，持续2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "凯尔莫罕的羁绊": {"d": "（领袖光环）场上所有的己方，攻击提高10%，防御提高20%。伤害、穿透伤害提高10%，攻击[定身]目标时额外提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "时空之旅": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "杰洛特的冷静": {"d": "（被动）受到伤害降低20%，攻击受到[定身]的目标时，伤害提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "希里的率真": {"d": "（被动）暴击率提高40%。对受到[定身]的敌人必定暴击，且造成伤害提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "便携治愈魔药": {"d": "（被动）行动结束时，治疗自身范围3格内生命百分比最低的友军，治疗量为魔攻值的50%，若目标为〈时空旅者〉，治疗后使其获得[▲攻击2]、[▲物防2]及[▲魔防2]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "元素谐律": {"d": "（被动）交替释放拥有[冰属性]或[火属性]的技能时，回复1点能量，所有[职业技能]冷却回合减1。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "特莉丝的怒火": {"d": "（被动）暴击率提高30%；对受到[定身]目标的暴击率额外提高20%、魔攻提高30%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "冰霜操控": {"d": "（被动）释放拥有[冰属性]技能时，若目标处于[冰冻]地形格，则攻击后对其施加[▼移动1]、[▼束缚视界1]，持续1回合，并使技能[雹暴术]冷却回合减1。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "蛰伏": {"d": "（被动）行动开始时，[虔诚值]增加5点；行动结束时，若本回合未释放过攻击技能，则回复1点能量，并获得[▲物防3]、[▲魔防3]，持续2回合。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "认知错乱": {"d": "（被动）触发[质疑之种]的警戒攻击时，对造成触发的目标施加[晕眩]（持续1回合），并打断其行动。✦每回合最多触发3次，若目标免疫打断，则不触发本效果。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "异端领袖": {"d": "（反应）被拥有[蛊惑]的敌人攻击时，受到伤害降低15%。✦被攻击时，若自身范围2格内存在拥有[质疑之种]的友军，则使其对自己进行[援护防御]，每回合最多触发2次。✦被击败时，对自身范围2格及场上拥有[蛊惑]的敌人造成30%魔攻值的穿透伤害。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "疑念灼心": {"d": "（被动）行动结束时，对所有处于[质疑之种]警戒范围内所有敌人，施加随机2个[2级属性减益]，持续2回合。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "异念蔓延": {"d": "（被动）穿透伤害提高15%，触发[警戒]时，穿透伤害提高15%。✦拥有[蛊惑]的敌人被击败时，将会对所有处于[质疑之种]警戒范围内随机1名未有[蛊惑]的敌人施加[蛊惑]。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "避开要害": {"d": "（反应）被主动攻击时，受到伤害降低8%，受到暴击率降低30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "回击": {"d": "（反应）被[正、侧方]敌人主动攻击时，若对方在攻击范围内，用[普攻]进行[反击]，可造成普攻的70%伤害，每回合生效1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "法皇国战旗": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "完备": {"d": "（被动）[无伤]状态时，攻防属性提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "威压": {"d": "（被动）行动结束时，对自身范围2格内所有敌人，施加[▼伤害1]、[易伤1]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "苦修者": {"d": "（被动）受到伤害后，自身获得1层[苦修]，每层受到伤害降低8%，不可驱散。拥有[苦修]时，回合结束额外回复1点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "侵蚀": {"d": "（被动）行动结束时，对自身范围3格内随机1名敌人，施加随机2个[1级属性减益]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "暗之庇护": {"d": "（反应）被主动攻击时，受到伤害降低8%，被主动攻击前，对方每存在一个[减益]，额外降低10%伤害，最多30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "破甲箭矢": {"d": "（被动）攻击后，对目标施加[▼物防2]，持续3回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "怒火": {"d": "（反应）被主动攻击时，受到伤害降低8%，被攻击后，自身获得[▲伤害2]，持续3回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "护盾": {"d": "（被动）战斗开始时，获得15%最大生命值的[物理护盾]，不可驱散。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "刺盾": {"d": "（反应）被主动攻击时，受到伤害降低10%。被主动近战攻击时，进行[反击]，可造成对方[穿透伤害]，伤害为自身物防值的50%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "破盾高手": {"d": "（被动）攻击拥有[护盾]的敌人时，攻击提高30%，无视40%防御。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "温柔的支柱": {"d": "（光环）使自身范围3格内所有己方，拥有[护盾]时，攻击提高16%；反之，攻击提高8%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "舍身援救": {"d": "（反应）自身范围3格内非[召唤物]的友军，被单体攻击后，若受到致命伤害，则触发[不屈]，随后牺牲施法者当前60%生命值，和目标换位，并回复其90%生命值，每场战斗最多触发2次。", "t": "反应", "c": "", "cd": "5", "r": "", "a": ""}, "力场·改": {"d": "（光环）使自身范围3格内所有己方，拥有[护盾]时，受到[范围伤害]降低40%；反之，受到[范围伤害]降低25%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "静谧祷言": {"d": "（被动）执行[待机]时，治疗自身范围3格内所有己方，治疗量为魔攻值的30%;可使[祷求圣启]持续时间增加1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "圣迹再临": {"d": "（被动）技能[圣迹]可使用次数增加1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "扶危济难": {"d": "（被动）行动开始时，治疗自身范围4格所有己方，治疗量为魔攻值的20%。[]\n✦ 拥有[圣启]时，技能变更，效果强化为：额外使目标获得[▲攻击2]、[▲伤害2]，持续1回合。\n✦（技能变更后为[圣启·扶危济难]）", "t": "职业技能", "c": "", "cd": "", "r": "", "a": "", "rs": ["圣启·扶危济难"]}, "耀护之璧": {"d": "（反应）自身范围4格内友军被单体攻击时，使其受到伤害降低15%，随后自身牺牲10%当前生命值，每回合最多触发2次。自身处于[受伤]状态时，受到伤害降低30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "光辉的试炼": {"d": "（被动）拥有[强韧]。行动开始时，若自身处于[受伤]状态，则获得[圣启]，持续1回合。行动结束时，若自身没有[祷求圣启]或[圣启]，则牺牲20%当前生命值，获得[祷求圣启]，效果持续到下次行动开始。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "燃尽秽浊之愿": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。[技能]伤害提高10%，[范围伤害]提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "不灭信仰": {"d": "（反应）拥有3点能量时，被击败时触发[不屈]，触发时消耗3点能量，可回复100%生命值，每场战斗最多触发2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": "", "rr": ["萨曼莎·不灭微光"]}, "亲卫翼护": {"d": "（被动）任意已方触发[血羽之刃]后，[伊瑟琳德]使其获得[冰铠·改]，持续2回合，并使其获得[偏斜]、[再移动]。✦释放[敛羽为阵]或触发[散羽为锋]时，拥有[偏斜]的己方，被[视同于血羽之刃]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "散羽为锋": {"d": "（被动）每放置或触发达4个[血羽之刃]后，对处于[血羽之刃]范围2格内或拥有[黑羽]的所有敌人，造成物攻值50%的[穿透伤害]。✦本效果[视同于血羽之刃触发]，但不参与本技能触发计数。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "息翼": {"d": "（反应）自身拥有的[偏斜]触发后，驱散自身1个[减益]，并获得[冰铠·改]，持续2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "坚翎卫阵": {"d": "（光环）使自身范围3格内所有己方，拥有[偏斜]时，受到伤害、[穿透伤害]降低15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "全装甲麦莎，出击！": {"d": "（被动）速度提高200点。战斗回合开始时，填充全部[缓冲值]。此效果冷却3回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "高效运转": {"d": "（被动）行动结束时，额外回复1点能量；能量为0时，再额外回复1点能量。拥有[协同响应]，效果:触发1次本技能被动效果。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "强固关节": {"d": "（反应）拥有[再生]时，可使[伤害缓冲模块]额外转移伤害，每10%再生效果转移为5%缓冲比例。行动开始时，自身获得[再生1]，持续2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "求生意志·改": {"d": "（被动）最大生命值提高15%。自身被攻击后若处于[濒死]状态，则回复50%生命值、2点能量，效果冷却2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "激活力量·改": {"d": "（反应）受到治疗效果提高30%，受到治疗后获得[▲伤害3]，持续1回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "睥睨众生": {"d": "（被动）最大生命值提高15%，行动开始时，回复15%生命值。被当前生命值低于自身的敌人攻击时，免疫[定身]、[击退]；被单体攻击前，驱散对方所有[破盾]效果。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "狮心之傲": {"d": "（光环）场上所有已方攻击提高10%，防御提高20%；处于[健康]状态时，伤害提高10%，若拥有30%及以上生命值的物理[护盾值]，则攻击额外提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "王者战意": {"d": "（反应）受到物理伤害降低15%。受到攻击后可[立刻行动]，并回复30%生命值，驱效果触发后散自身所有[减益]，冷却5回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "稳固瞄准": {"d": "（被动）物理攻击后，对目标施加[▼攻击2]、[▼伤害2]及[×被动技]，持续2回合。回合外造成伤害时，自身回复1点能量，每回合最多触发2次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "烙痕掌控者": {"d": "（被动）触发[晶能引力]时，获得10点[人造原初烙痕]点数。行动结束时，若[沙娜姿]未触发过[晶能引力]，且场上存在受到[晶能引力]目标，则触发其效果。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "灵巧闪身": {"d": "（反应）受到伤害降低10%，受到魔法伤害降低30%。✦受到[正、侧面]敌人主动单体攻击前，进行[先制]，可打断目标，并造成50%魔法伤害，施加随机2个[2级减益]，再传送至2~6格最近友军身边；效果触发后，冷却2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "蒂莎娅的教诲": {"d": "（被动）释放非[魔法强化]技能后，所有[职业技能]冷却回合减1，并回复1点能量,每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "叶奈法的嘲弄": {"d": "（被动）伤害提高30%，对受到[定身]的目标伤害额外提高30%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "冰原卫队": {"d": "（反应）受到伤害降低25%，受到碰撞伤害降低95%。✦被自身范围4格内敌人攻击时，进行[先制]，可对攻击者造成50%魔法伤害，并后撤2格，随后使得自身与前方2格地形移动为[冰冻]，持续2回合，回复魔攻值40%的生命值，每回合最多触发2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "凌霜傲世": {"d": "（被动）以[武技]技能攻击后，对主目标施加1层[猎物印记]；若后续更改主目标，则清除原目标印记。\n✦处于[金狮形态]时：被拥有[猎物印记]的敌人攻击时，受到伤害降低25%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "围猎光环": {"d": "（光环）使自身范围4格内所有友军，主动单体攻击前，获得效果：\n伤害提高10%；若技能拥有[无视守护]系列效果，则伤害额外提高5%，持续到攻击结束。\n✦自身则效果更换为伤害提高30%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "露西亚之子": {"d": "获得[围猎光环]中对自身生效部分的效果。\n技能[唤醒血脉·白金狮子]变为手动释放，伤害倍率翻倍，拥有10点[狮血]时可施放。\n✦[狮血]最大值变为30点。\n✦处于[人形态]时，受到伤害降低20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "狂澜余怒": {"d": "（被动）以[武技]技能攻击后，[溢出伤害值]转化为穿透伤害，由主目标范围2格内其他敌人分摊，分摊时额外造成50%魔法伤害（不含[物品]）。\n✦若范围内没有敌人则储存[溢出伤害值]，并在下一次含[武技]技能攻击前，使用储存值对主目标附加1次穿透伤害（溢出或储存最大值不超过魔攻值的800%）。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "森寒疆域": {"d": "（被动）拥有以下效果：\n✦每回合[冰原之心•神裁]触发[侵蚀]时：\n每名敌人受到该效果的次数上限加1。\n每名敌人首次受到该伤害的技能倍率提高25%;\n✦行动结束时，对所有处于[永冻冰堑]的敌人施加[缠缚]，持续1回合。\n✦战斗开始时，额外获得2点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "归途之光": {"d": "（反应）受到伤害降低30%，行动结束时回复70%已损失生命值。\n✦被攻击时，攻击者每有1层[霜烬]，自身受到伤害降低15%。\n✦若攻击者处于[冰冻]或[永冻冰堑]地形格，自身受到伤害额外降低30%。\n✦以上受到伤害降低效果，最多叠加至60%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "北境战魂•改": {"d": "（被动）与敌人交战后，自身回复1点能量值，每回合最多触发1次。✦若与敌人交战时，自身或目标处于[冰冻]或[永冻冰堑]地形格，则额外回复1点能量值，每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "攻击弱点": {"d": "（被动）主动攻击时，暴击率提高15%，若能[背击]则暴击率提高40%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "禁疗": {"d": "（被动）[单体攻击]前，50%的概率对目标施加[×受治疗]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "防御箭矢": {"d": "（反应）被[远程攻击]时，受到伤害降低25%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "助跑": {"d": "（被动）攻击前，每移动1格，攻击提高3%，最多15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "咒骂": {"d": "（反应）被主动攻击时，受到伤害降低8%，被主动攻击后，施加对方[易伤2]，持续2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "伊利亚战旗": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "战地治疗": {"d": "（反应）被主动攻击时，受到伤害降低8%。被主动攻击后，治疗自身范围2格内生命百分比最低的己方，治疗量为魔防值的100%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "破防": {"d": "（被动）单体攻击前，50%的概率对目标施加[▼物防2]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "七手八脚的分工合作": {"d": "（被动）拥有[后备隐藏脂肪]时，攻防属性提高10%、远程技能的最大射程和移动力增加1格。在[后备隐藏脂肪]达到5层时，所有效果翻倍。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "吃好睡好的脂肪储备": {"d": "（反应）[无伤]状态时拥有[抵抗定身]。行动结束时，若自身处于[无伤]，则获得1层[后备隐藏脂肪]，持续2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "值得自夸的非凡吨位": {"d": "（被动）对[免疫击退]的目标使用非[瞬发]主动攻击后，额外附加70%物理伤害。主动击退目标时，击退距离增加1格，若造成碰撞，则额外对碰撞双方中的敌人附加70%物理伤害。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "满盘皆活": {"d": "（光环）使自身范围3格内所有己方，暴击率提高20%，暴击伤害提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "风起浪涌": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。主动攻击、释放[支援]或[减益]技能时，若敌人拥有3个及以上[减益]，则自身攻击提高18%；并获得[运筹帷幄]，持续1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "梦念回响": {"d": "（被动）主动释放[职业技能]后，治疗自身范围3格内所有友军，治疗量为魔攻值的20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "在铃兰的旗帜下": {"d": "（领袖光环）场上所有阵营为或的己方，攻击提高10%，防御提高20%；场上每存在1名或的己方，造成伤害提高3%，受到伤害降低3%，最多15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "守护铃兰之剑": {"d": "（被动）若自身范围2格内有2名及以上友军，自身受到伤害降低20%，攻击提高20%；造成物理伤害后，把目标2个[增益]转换为随机[2级属性减益]，持续2回合。击退目标时，击退距离增加1格。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "让我们携手共进": {"d": "（被动）行动开始时，若自身范围2格内有2名及以上友军，则范围内所有己方获得[协攻]、[协防]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "天生剑意": {"d": "（反应）被主动单体攻击前，进行[先制]，可造成100%物攻值的魔法伤害，每回合最多可触发1次。被击败时，若自身拥有6层及以上[自由意志]，则消耗6层，触发[强力不屈]并获得[免伤9]，持续1回合，每场战斗最多触发1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "璀璨光华": {"d": "（光环）对自身范围3格内所有敌人，攻防属性降低10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "援助之手": {"d": "（被动）主动攻击后，对场上1名生命最低的友军进行治疗，治疗量为物攻值加魔攻值的40%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "告死鸟之翼": {"d": "（反应）受到[范围伤害]降低40%。处于任意[维持]效果中时，移动力增加1格。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "告死鸟之眼": {"d": "（被动）[黑羽千片]触发时，额外施加1次[冻伤]和[▼移动1]，持续1回合，对每个目标每回合最多生效1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "凛冬庇护": {"d": "（反应）攻击拥有[▼移动]或[▼速度]的敌人时，获得[冰铠]，持续2回合，每回合最多触发1次。被拥有[▼移动]或[▼速度]的敌人主动攻击时，受到伤害降低30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "历战的斗士": {"d": "（反应）自身范围5格内，每有角色释放非[瞬发]技能时，自身获得1层[战场历练]：当层数达到上限时，额外获得[攻击指挥]，且释放非[瞬发]技能后，自身获得1层[自由意志]。", "t": "反应", "c": "", "cd": "", "r": "", "a": "", "rr": ["伊南娜·铃兰之剑"]}, "天生不言弃": {"d": "（反应）受到近战伤害降低15%。拥有[强力不屈]，触发时回复所有能量，移除[消停]，并获得8层[炸毛]；再获得[▲速度4]，持续1回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "先袭": {"d": "（反应）被[正、侧方]主动攻击前，进行[先制]造成70%伤害，每回合可生效1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "噼啪爆火花": {"d": "（被动）释放[职业技能]攻击后获得2层[炸毛]。造成碰撞伤害时，对碰撞双方范围1圈内所有敌人，造成施法者25%物攻值的范围物理伤害。对免疫击退的目标攻击提高15%，攻击前施加[▼物防2]、[▼魔防2]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "世界任我闯": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。主动攻击和反击时，每命中1名目标，造成伤害提高5%，最多15%。若目标处于[受伤]状态，暴击率、暴击伤害提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "咒刃·血戮": {"d": "（被动）伤害提高15%，拥有[咒铠·裁罚]时提高至30%。行动开始时，若自身拥有[咒铠·缚罪]且受到[定身]，则触发技能[以血浇灌]（该技能不在冷却中），触发后获得2层[咒痕]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "玷污之镰": {"d": "（被动）主动造成伤害后，移除目标1点能量，每回合最多触发1次。行动结束时，自身额外回复1点能量，本次行动曾击败目标则再额外回复1点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "蚀魂形骸": {"d": "（被动）受到伤害降低20%；被主动攻击前，偷取目标身上随机2个[增益]，并施加随机2个[2级减益]，持续2回合;每回合反击次数加2。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "染血荆棘": {"d": "（反应）被自身范围2格内，[正、侧方]敌人主动攻击后，进行[反击]，对范围内所有敌人造成60%物理伤害，每回合最多触发1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "敛曜待时": {"d": "（被动）行动结束时，若本回合未触发过[解放枷锁]技能的10层[解放]效果，则获得[蓄势待发]、5层[解放]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "骄阳贯势": {"d": "（被动）行动开始时，若拥有10层及以上[解放]，则获得[蓄势待发]。使用[烙痕•全力解放]时，可获得[蓄势待发]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "帝王秘血": {"d": "（被动）技能[烙痕加护]的全部效果将无视条件生效。✦[烙痕透支]不阻止生命值回复，若[个性]已有此效果则改为：受到治疗效果提高30%。✦释放或触发[烙痕•全力解放]后，获得[秘仪防护]、[再生3]和[护盾再生3]，持续4回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "烙痕加护": {"d": "（反应）受到伤害、穿透伤害降低15%。✦拥有[护盾]时，额外使受到伤害、穿透伤害降低15%。✦被主动攻击时，再额外使受到伤害、穿透伤害降低15%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "原初•超凡之躯": {"d": "（反应）处于[原初之力]期间被击败时，消耗10点[人造原初烙痕]点数并触发[强力不屈]；若点数不足或战斗中再次触发，则退出[原初之力]并受到[遗忘症]，持续1回合。✦退出[原初之力]时重置此技能中[强力不屈]触发计数。✦被非克制自身的敌人攻击时，伤害降低30%。", "t": "反应", "c": "", "cd": "0", "r": "", "a": ""}, "原初•万象谐振": {"d": "（被动）攻击时，不受职能克制关系的影响。对友军造成伤害降低至1点。技能命中友方前，使其获得[▲伤害3]、[▲攻击2]、[▲最大射程1]和[稳固]，持续2回合。✦自身行动开始时，自身获得上述增益，效果持续至战斗结束。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "影刃追击": {"d": "（反应）对自身范围3格内，拥有[倒吊人标记]的敌人，进行[援护攻击]，可造成50%伤害，每回合最多生效1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "浴火": {"d": "（反应）免疫[灼烧]及[燃烧地形]，处于[燃烧]地形格上时，受到伤害降低10%。行动结束时，回复20%生命值。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "战斗治疗": {"d": "（被动）主动攻击后，治疗场上生命值最低己方，治疗量为技能持有者物攻值的20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "防御魔法": {"d": "（反应）被主动魔法攻击时，受到伤害降低15%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "炙热": {"d": "（被动）行动结束时，对自身范围3格内随机1名[受伤]状态敌人，施加[灼烧]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "强韧": {"d": "（被动）不会受到[受伤]、[濒死]状态的效果影响。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "震荡": {"d": "（被动）攻击后，对目标施加[▼速度3]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "同袍的遗志": {"d": "（被动）场上友军被击败时，回复自身30%生命值，获得[▲攻击2]、[▲物防2]和[▲魔防2]，持续3回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "求生": {"d": "（被动）被攻击后，自身处于[濒死]状态时，回复25%生命值。每回合最多生效1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "奉献": {"d": "（被动）主动攻击后，回复自身范围2格内所有友军15%生命值。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "破盾": {"d": "（被动）攻击拥有[护盾]的敌人时，攻击提高15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "乱战": {"d": "（被动）[受伤]状态时，攻防属性提高8%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "居高临下": {"d": "（被动）从[高地]攻击敌人时，攻击提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "优势": {"d": "（被动）攻击时，若自身生命值百分比大于目标，攻击提高12%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "灵魂收割": {"d": "（被动）若本次行动曾击败过敌人，行动结束时，回复20%生命值、1点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "绯红记忆": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "街头风范": {"d": "（反应）受到近战伤害降低20%，被[先制]、[反击]时进行[格挡]，并受到伤害额外降低50%。被[反击]后，追加攻击，造成70%物理伤害，每回合最多触发1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "家人": {"d": "（被动）[健康]时，对自身范围2格内其他友军进行[援护防御]；[濒死]时，使得自身范围2格内其他友军为自己[援护防御]。任意效果触发后，自身范围3格内所有友军获得[▲攻击2]、[免伤2]，持续2回合，每回合最多生效1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "燃血": {"d": "（被动）[健康]状态时，将自身15%魔攻值附加到物攻值上；[受伤]状态时，将自身25%魔攻值附加到物攻值上，拥有[暴走状态]时，效果翻倍。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "完备之虑": {"d": "（被动）行动结束时，对场上2名生命最低的友军进行治疗，治疗量为物攻值加魔攻值的40%。执行[待机]时，则额外触发一次，治疗量为物攻值加魔攻值的20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "刻骨之蚀": {"d": "（被动）行动结束时，对自身范围3格内随机1名敌人，施加随机2个[1级属性减益]和40%魔攻值的[生命流失]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "先胜而后战": {"d": "（被动）场上每有1名有[名单]的敌人被击败时，回复20%生命值、1点能量，并获得随机2个[2级增益]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "庇护徽记": {"d": "（反应）被主动范围攻击后，使自身范围2格内所有己方，获得施法者30%生命值的对应伤害类型[护盾]，持续2回合，每场战斗每个类型护盾最多触发1次。自身拥有[护盾]时，受到伤害降低10%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "终焉": {"d": "（被动）技能[此刻正是赏雨之时]不再触发并移除[持续伤害]效果，但伤害提高100%。非[瞬发]技能主动造成伤害时，对目标额外施加60%魔攻值的[生命流失]，持续1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "炽焰逐跃": {"d": "（被动）攻击拥有[灼烧]的敌人时，暴击率提高20%；攻击拥有[点燃]的人时，暴击伤害堤高20%。击败拥有[灼烧]的敌人时，对其范围2格內所有敌人造成60%[火属性][范围伤害]，井对其加[点燃]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "烈意灼心": {"d": "（被动）处于[燃烧]地形时，攻击提高20%。行动结束时，使自身所在地形格强制变为[燃烧]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "烬火之壁": {"d": "（反应）被单体物理或单体魔法攻击前，若自身处于[燃烧]地形，则进行[先制]，吸收[燃烧]地形并获得自身100%魔攻值的对应伤害类型[护盾]，持续2回合。", "t": "反应", "c": "", "cd": "3", "r": "", "a": ""}, "掣影迷踪": {"d": "（反应）被自身3格内[背、侧面]的敌人主动单体攻击前，进行[先制]，瞬移至目标身后，进行普攻，可造成50%伤害，并打断目标行动。", "t": "反应", "c": "", "cd": "2", "r": "", "a": ""}, "厄运替身": {"d": "（被动）非[瞬发]的单体攻击前，偷取目标3个[增益]，并在该次攻击后使自身3个[减益]转移给目标。若目标无[增益]且自身无[减益]，则自身获得随机4个[2级增益]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "圆月之型": {"d": "（反应）受到攻击时，回复物防值加魔防值的50%生命值，每回合最多触发3次。拥有[格挡]，同时可以格挡[魔法攻击]和[范围攻击]。被任意方向攻击时，100%机率触发[格挡]，且格挡时受到伤害额外减少10%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "曙月": {"d": "（被动）处于[健康]状态，主动攻击时，造成伤害提高30%，且主动攻击后，所有[职业技能]冷却减1回合，减少冷却效果每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "明月拂山": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%;目标处于[健康]状态时，受到伤害降低10%，攻防属性额外提高8%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "月影": {"d": "（被动）反击最大射程增加2格；反击时，提高50%物理伤害；反击次数额外加2。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "料理的香味": {"d": "（被动）使[料理]拥有光环，效果：使[料理]范围2格己方攻防属性提高10%，敌人攻防属性降低10%。自身触发[料理]效果时，获得1层[森西的满足]，并额外回复1点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "安心吃饭": {"d": "（反应）拥有[格挡]。自身处于[料理]范围2格内时，格挡概率提高至100%，且格挡时受到伤害额外减少20%；并对自身范围2格内所有友军进行[援护防御]。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "矮人血脉": {"d": "（反应）免疫[灼烧]和[燃烧]地形。受到[火属性]伤害或魔法伤害时，受到伤害降低40%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "责任心": {"d": "（被动）技能[开饭啦！]不再需要准备，释放后也不[跳过回合]。行动结束时，若本次行动未造成过伤害，则获得2层[森西的满足]，并获得[▲暴击2]、[▲伤害2]，持续2回合", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "协攻‧改": {"d": "（被动）自身范围2格每存在1个友军，攻击提高5%，最多15%；范围内存在[物品]时，攻击额外提高15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "魔法反制": {"d": "（反应）受到魔法伤害降低15%。受到主动魔法攻击前，触发[先制]，可打断敌人行动，每回合最多触发1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "完备·改": {"d": "（被动）[健康]状态时，攻击提高8%，伤害提高10%。没有[减益]时，攻击额外提高8%，伤害提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "魔力恢复": {"d": "（被动）执行[待机]时，获得1层[魔力充沛]；若已有2层[魔力充沛]，则恢复自身范围3格所有己方1点能量、20%生命值，并获得[▲攻击2]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "愈合": {"d": "（被动）行动结束时，治疗自身范围3格内生命百分比最低的友军，治疗量为魔攻值的20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "紧急避险": {"d": "（反应）被主动攻击时，受到伤害降低8%。被主动攻击后，若自身处于[濒死]状态，获得[闪避]，每回合最多生效1次，持续1回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "舍身": {"d": "（被动）物攻提高20%，但物防、魔法降低15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "战斗狂热": {"d": "（被动）行动造成伤害后，产生20%[生命汲取]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "防御背刺": {"d": "（反应）被主动攻击时，受到伤害降低8%，被[背击]时，受到伤害额外降低30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "偷袭": {"d": "（被动）主动攻击，目标为[无伤]状态时，造成20%物理伤害。对[无伤]的目标[背击]时，额外施加[×被动技]，持续1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "锁定": {"d": "（被动）自身行动开始时，对自身范围6格内物攻最高的敌人，施加[▼物防2]，持续1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "游击": {"d": "（被动）攻击提高5%，攻击后，可再移动2格，冷却2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "防御者": {"d": "（反应）被攻击时，受到伤害降低10%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "高昂": {"d": "（被动）[健康]状态时，攻击提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "顺势劈": {"d": "（被动）主动攻击后，对自身范围1圈内所有敌人，造成20%物理伤害。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "严守": {"d": "（被动）[健康]状态时，防御提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "先制": {"d": "（反应）被[正、侧方]主动攻击前，进行[反击]造成70%伤害，每回合可生效1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "攻势": {"d": "（被动）攻击时，攻击提高8%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "不净箭头": {"d": "（被动）[普攻]后，对目标施加2层[感染]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "求生欲望": {"d": "（被动）[濒死]状态时，移动力增加2格。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "应急闪避": {"d": "（被动）行动结束时，自身处于[受伤]状态时，获得[闪避]，持续2回合，冷却3回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "追击": {"d": "（被动）[健康]状态时，普攻后[追击]，造成20%物理伤害，击退目标1格。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "受庇护者": {"d": "（被动）自身没有[减益]且有3个及以上[增益]时，攻击提高15%，防御提高30%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "和平主义": {"d": "（反应）被攻击前，驱散对方2个[增益]，并使其造成的伤害降低20%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "睥睨": {"d": "（反应）受到伤害降低15%。被攻击时，额外获得1层[怒意]，每回合最多生效2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "飞影游戏": {"d": "（反应）被[背、侧方]敌人近战攻击前，呼唤[沙欣]先施加对方[致盲]，持续1回合，每回合最多发动1次。[闪避]后，进行[反击]，可造成70%物理伤害，并且自身后退2格。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "和鸣": {"d": "（被动）行动结束时，若曾[普攻]或使用技能，治疗自身范围2格内所有己方，治疗量为物攻值的20%，驱散1个[减益]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "光辉的指引": {"d": "（领袖光环）场上所有的己方，攻击提高10%，  "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "骑士同盟战旗": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "热身": {"d": "（被动）[待机]时，获得[▲移动1]、[攀爬]，持续1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "臂甲": {"d": "（被动）被[侧面]攻击时，防御提高30%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "掩体优势": {"d": "（反应）自身范围1格内存在[物品]时，受到伤害降低40%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "狩猎准备": {"d": "（被动）行动结束时，回复10%生命值。获得[狩猎准备]，效果：攻击前，获得[高地]优势；若击败目标，回复1点能量，效果持续到下次行动开始。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "冰碎": {"d": "（反应）[冰铠]被破坏后，自身范围2格内所有敌人，受到50%魔法伤害，对目标施加[▼移动3]，持续1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "侵蚀力场": {"d": "（反应）[斥力屏障]格挡近战攻击后，进行[反击]，造成70%魔法伤害，施加1层[感染]。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "狙击手的直觉": {"d": "（反应）受到[远程伤害]降低20%，行动开始时，若自身处于敌人[威胁范围]内，获得[▲移动2]，持续1回合，冷却3回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "使命感": {"d": "（被动）攻击拥有[倒吊人标记]的敌人时，攻击前，暴击率提高30%，暴击伤害提高30%。暴击时，额外回复1点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "重破甲矢": {"d": "（被动）[普攻]时，无视目标40%防御。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "山地民族": {"d": "（被动）自身处于[无伤]状态时，移动力增加1格。[高地]攻击或移动终点比起点高度超过2格时，伤害提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "狼之警觉": {"d": "（反应）行动结束时，若自身范围6格内存在敌人，自身获得[▲移动1]、[免伤3]，持续2回合，冷却4回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "紧急避险模组": {"d": "（反应）自身处于[濒死]状态时，[闪避]所有[单体攻击]，持续1回合。行动开始时，回复50%生命值，冷却7回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "锐疾如风": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%，暴击率提高15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "充能刺刀": {"d": "（被动）行动开始时，若自身处于敌人[威胁范围]外，获得[刺刀充能]。拥有[刺刀充能]时，单体攻击[倒吊人标记]的敌人，提高30%伤害，产生30%[生命汲取]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "倒吊人的清算": {"d": "（被动）攻击后，若目标处于[濒死]状态且有[倒吊人标记]时，额外对目标造成30%生命值的[穿透伤害]。造成伤害后，移除标记。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "街垒战": {"d": "（被动）若自身范围1圈内存在[物品]，攻击提高15%，且主动攻击后，可再移动2格。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "温热触感": {"d": "（被动）主动攻击时，额外造成目标[穿透伤害]，伤害为15%目标当前生命值，回复自身10%生命值，每回合最多生效1次。命中多个角色可同时触发。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "异能侵蚀": {"d": "（被动）伤害提高10%。造成伤害后，对目标施加1层[感染]，单体主动攻击时，则额外添加1层[感染]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "赏罚分明": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%；并且冷却回合大于等于4的技能，冷却减1回合；同时己方召唤物造成伤害额外提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "特殊条款": {"d": "（反应）被攻击时，范围3格内存在任意己方召唤物，使其为自身承受此次攻击，每回合最多2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "麻痹之触": {"d": "（被动）造成伤害后，对目标施加1层[感染]。主动使用[职业技能]攻击携带5层以上[感染]的目标，造成伤害后，施加[睡眠]，持续1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "女仆的本能": {"d": "（被动）生命值提高15%。行动开始时或执行[待机]后，清除自身2格内所有特殊地形效果。执行[待机]后，额外回复1点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "恨意": {"d": "（反应）处于[受伤]状态时，受到伤害降低35%；自身被攻击后，对攻击者施加[怨念之痕]。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "决死战": {"d": "（被动）[濒死]状态时，攻防属性提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "自然指引": {"d": "（被动）[芙拉维娅]存在时：[植物朋友]造成伤害提高15%；[植物朋友]对处于[花田]的目标造成伤害额外提高15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "大地的挚爱": {"d": "（光环）所有处于[花田]上的友军，攻防属性提高10%；所有处于[花田]上的敌军，攻防属性降低10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "繁茂生机": {"d": "（反应）自身范围3格任意友军受到单体攻击后，对其治疗，治疗量为[芙拉维娅]魔攻值的20%，并使其地形格变为[花田]，持续2回合，每回合最多触发2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "植物所爱之人": {"d": "（被动）[芙拉维娅]存在时：[植物朋友]攻防属性提高8%，受到伤害降低40%。行动结束时，使得自身范围2格所有地形格变为[花田]，持续2回合，并将[植物朋友]传送至身边。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "丰饶之息": {"d": "（被动）行动结束时，若处于[花田]地形格时，则回复自身及召唤角色[植物朋友]20%生命值、2点能量，获得随机2个[2级增益]，持续2回合。行动结束时，若未处于[花田]地形格时，则使自身和[植物朋友]所在处变为[花田]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "虔诚信仰": {"d": "（反应）拥有3点能量时，获得[不屈]。触发[不屈]时，消耗3点能量，回复至70%生命值，每场战斗最多发动2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "正义之誓约": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。主动攻击前，伤害提高12%，被反击时，伤害降低24%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "护身剃刀": {"d": "（反应）被[正、侧方]近战攻击前，优先[反击]  ""}, "以眼还眼": {"d": "（反应）被[正、侧方]非相邻的敌人攻击时，进行[反击]，造成对方100%伤害。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "警戒之心": {"d": "（被动）在自身的回合外，暴击率额外提高45%，暴击伤害提高30%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "暴击指挥": {"d": "（光环）使自身范围2格内其他友军，暴击率提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "死亡的味道": {"d": "（被动）场上有角色被击败时，获得[野兽狂热]，持续3回合。自身击败敌人后，回复2点能量。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "完美刺客": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%，暴击率提高15%，暴击伤害提高15%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "缠斗射手": {"d": "（被动）攻击时，允许攻击与自身相邻敌人。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "刺甲": {"d": "（被动）被物理攻击后，造成对方[穿透伤害]，威力为自身的物防值50%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "战场历练": {"d": "（反应）受到伤害降低8%，自身范围5格内，每有1名角色被击败时，魔攻提高6%，最多30%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "怒视": {"d": "（反应）被攻击时，受到伤害降低8%，被主动攻击后，施加对方[▼伤害2]，持续2回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "致命收割": {"d": "（反应）自身十字范围3格内所有敌人，被友军攻击后，若处于[濒死]，进行[援护攻击]。造成目标50%已损失血量的[穿透伤害]，每回合最多生效1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "隐秘的处决者": {"d": "（被动）攻击前，目标范围1圈内没友军时，对目标施加[孤立]、[×闪避]，持续2回合，每回合最多生效1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "必胜战吼": {"d": "（被动）自身范围2格内有敌人被击败时，对自身范围5格所有敌人，施加[▼攻击2]，使己方获得[▲伤害2]，持续2回合。使用[崩山击]前，立刻触发效果，每回合最多生效1次。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "渴血的巨斧": {"d": "（反应）被[正、侧方]敌人主动攻击时，用[普攻]进行[反击]，每回合生效1次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "铁与血的意志": {"d": "（领袖光环）场上所有阵营为的己方，攻击提高10%，防御提高20%，[健康]状态时，受到伤害降低10%，不受[受伤]状态影响。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "守护誓言": {"d": "（反应）替自身范围2格所有友军承受[近战伤害]，进行[先制]，造成70%伤害，冷却3回合。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "光辉卫士": {"d": "（被动）战斗开始时，生命值提高15%。不受[受伤]状态影响。攻击前，若自身最大生命值大于目标当前生命值，击退目标1格。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "列阵如林": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。冷却回合大于等于4的技能，冷却减1回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "格挡强化": {"d": "（被动）被[正、侧方]远程物理攻 , "cd": "", "r": "", "a": ""}, "同袍的鼓舞": {"d": "（被动）行动开始时，若自身范围2格内有2个及以上友军，获得[▲伤害2]，持续1回合。被主动攻击时，若自身范围2格内有2个及以上友军，受到伤害降低20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "神闪": {"d": "（被动）速度提高50点，攻击前，若移动距离大于等于3格，暴击概率提高50%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "再加把劲！": {"d": "（反应）被单体攻击后，治疗自身和范围2格内生命百分比最低的1名其他友军，治疗量为施法者生命值12%，每回合生效2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "兵来锅挡": {"d": "（被动）[格挡]时，受到伤害降低15%；非[濒死]状态时，对自身范围2格内所有友军进行[援护防御]。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "药完啦！": {"d": "（被动）行动开始时，治疗自身范围3格内随机1名[受伤]状态的友军，治疗量为魔攻值的30%，再驱散3个[减益]；若目标没有[苦药]，使其获得[苦药]。", "t": "职业技能", "c": "", "cd": "3", "r": "", "a": ""}, "气势凌人": {"d": "（被动）若主动单体攻击后未曾受到[先制]、[反击]，则进行追击，可造成50%物攻值的[穿透伤害]，每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "1", "r": "", "a": ""}, "解放•摧敌": {"d": "（被动）攻击提高10%，防御降低8%。释放技能后，若[暴击]或击败敌人，获得3层[解放]，每回合最多触发1次。", "t": "职业技能", "c": "", "cd": "1", "r": "", "a": ""}, "埃拉曼战旗": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "护颚": {"d": "（被动）被攻击时，防御提高10%。若自身处于[高地]，防御额外提高10%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "露西亚战旗": {"d": "（光环）场上所有阵营为的己方，攻击提高10%，防御提高20%。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "活性化•改": {"d": "（反应）最大生命值提升15%，受到治疗效果提高50%。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "困兽蓄势": {"d": "（被动）执行[待机]时，获得1层[蓄势]，持续1回合。", "t": "被动", "c": "", "cd": "", "r": "", "a": ""}, "追加投资": {"d": "（反应）对自身范围5格内所有敌人进行[援护攻击]，可造成35%魔法伤害，并施加随机1个[2级减益]，每回合最多发动2次。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "谢幕": {"d": "（被动）2回合后自动[消亡]，消亡时，对自身范围1圈内所以敌人，造成40%[物理范围伤害]，施加随机2个[2级属性减益]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "纤韧": {"d": "（反应）处于[芙拉维娅]范围2格时，受到伤害降低30%。拥有[不屈]，触发时回复1点生命。触发[不屈]时，对自身范围2格内所有敌人造成50%[范围伤害]，攻击后[消亡]。", "t": "反应", "c": "", "cd": "", "r": "", "a": ""}, "夏铃草的滋养": {"d": "（光环）自身范围3格内的友军行动结束时，回复60%生命值，再驱散3个[减益]，并使其地形格变为[花田]，持续2回合。", "t": "职业技能", "c": "", "cd": "", "r": "", "a": ""}, "晶棱折射": {"d": "（被动）被攻击时，对自身范围3格内随机1名敌人造
