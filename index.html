击转化]暴击率的20%附加在暴击伤害上，本效果最多提高15%暴击伤害。", "爆裂地刺": "[爆裂地刺]✦任意角色途经或停留时触发，触发后[芬恩]对[触发物]范围3格内敌人，造成70%物攻值的[穿透伤害]；对处于[指定地形]的目标，造成的[穿透伤害]提高20%，被攻击后受到[失温]（持续1回合）。", "▲协同伤害2": "[▲协同伤害2]触发[协同响应]时，造成伤害、穿透伤害提高20%。", "百分比免伤5": "[百分比免伤5]受到生命值[百分比伤害]降低50%。", "▲物防3": "[▲物防3]增益，物防提高60%。", "▼束缚视界2": "[▼束缚视界2]所属控制-干扰类，远程技能最大射程减2格，主动攻击后移除。", "▼束缚视界1": "[▼束缚视界1]所属控制-干扰类，远程技能最大射程减1格，主动攻击后移除。", "濒死": "[濒死]状态，生命值小于30%时的状态，伤害降低30%、受到伤害提高30%。", "不屈": "[不屈]增益，被击败时，可重新投入战斗，并回复一定生命值，可生效1次。", "冰原适应": "[冰原适应]不会受到[冰冻]地形的任何效果影响。", "冰封": "[冰封]减益，所属控制-定身类，无法做出任何行动，无法被穿过，同时免疫所有[物理伤害]。被火属性[范围伤害]攻击后，效果消失。", "冰铠": "[冰铠]增益，获得施法者魔攻值60%的[物理护盾]，免疫[冰冻]地形效果，被[近战攻击]后，施加对方[▼移动1]，持续2回合。", "冰面作战": "[冰面作战]增益，处于[冰冻]地形格时，受到伤害降低30%，移动力增加1格。", "捕兽夹": "[捕兽夹]陷阱，角色经过或停留时，造成10%最大生命值的[穿透伤害]，打断本次行动。", "冰冻": "[冰冻]地形格，光滑的冰面。被击退时，会一直退到冰面边缘，再被正常击退。行走其中时，每格额外消耗1移动力。", "便当": "[便当]增益，行动开始时，回复30%生命值，驱散2个减益。", "被讽": "[被讽]减益，所属控制-定身类，速度增加100点，目标无法控制且只能对施法者普攻。", "冰属性": "[冰属性]状态，使地形格变为[冰冻]。", "兵不厌诈": "[兵不厌诈]增益，获得1次[闪避]，触发[闪避]时，瞬移至对方身后，造成100%物理伤害，再次获得[闪避]，持续1回合。效果触发后移除。", "冰冻陷阱": "[冰冻陷阱]陷阱，角色经过或停留时，造成10%最大生命值的穿透伤害，打断本次行动并施加[冰封]，持续1回合。使其范围1格内地形[冰冻]，持续2回合。", "嘲讽": "[嘲讽]状态，敌人会优先攻击具有嘲讽状态的角色。", "布羽为谋": "[布羽为谋]技能，放置1个[血羽之刃]。", "冰铠·改": "[冰铠·改]增益，获得自身30%生命值的[物理护盾]，免疫[冰冻]地块效果，被[近战攻击]后，施加对方[▼移动1]，持续2回合。此状态视同于[冰铠]。", "超重装强袭1": "[超重装强袭1]伤害、穿透伤害提高4%，不可驱散，无法免疫。", "超重装强袭2": "[超重装强袭2]伤害、穿透伤害提高7%，不可驱散，无法免疫。", "苍翠旋律": "[苍翠旋律]（支援）[瞬发]，获得[苍翠旋律]，效果：[维持]时消耗1点能量，期间获得[悦耳]，且行动结束时，对自身范围3格所有己方治疗，治疗量为魔攻值的20%，并使其获得[▲暴击2]、[▲暴伤1]，持续1回合。", "悖律拒斥": "[悖律拒斥]（支援）选择受到[命运•注视]者的范围5格内目标，使该目标把受到[命运•注视]者向自身击退4格。\n}}", "不朽战骸": "[不朽战骸]（被动）被击败或消亡时，对自身范围2格内所有敌人造成60%物理范围伤害，攻击前施加[▼物防1]、2层[粉碎枷锁]，持续2回合；并对范围内友方召唤物造成生命值1%的[穿透伤害]，使其获得2层[战争杀器]，持续3回合。✦若范围内没有敌人，则使[基安希尔]获得4层[解放]。✦[基安希尔]被击败时，立即触发本技能并随后[消亡]。", "兵员紧缺": "[兵员紧缺]每层可使技能[征伐敕令]消耗能量增加1点，最多可叠4层。", "冰火律动": "[冰火律动]释放拥有[冰属性]技能，且目标处于[燃烧]地形格；或释放拥有[火属性]技能，且目标处于[冰冻]地形格时，可触发效果：✦对目标范围1圈内所有敌人，造成40%的对应属性的范围伤害，每名敌人最多受到2次伤害效果。", "冰火易伤": "[冰火易伤]下次被拥有[冰属性]或[火属性]技能主动攻击时，受到伤害提高20%。", "冰雹术": "[冰雹术]（魔法伤害）对目标范围2格内所有敌人造成120%[冰属性]范围伤害。", "冰柩": "[冰柩]✦所属控制-定身类，防御降低40%，无法做出任何行动，无法被穿过。", "巢虫": "[巢虫]✦会使用单体攻击，造成110%物理伤害。✦若是被[宿巢兽]召唤出来的，则行动结束后离场。✦被击杀时：若自身拥有[自然守护]，则所属[宿巢兽]受到21%生命值伤害，并使原地变为[冰冻]；反之，[宿巢兽]受到35%生命值伤害。", "巢心凝视": "[巢心凝视]被宿巢兽盯上了，所属其的巢虫会进行攻击。", "冰封类状态": "[冰封类状态]减益，包含以下减益：[冰封]、[冰柩]等。", "冰雪中的反抗": "[冰雪中的反抗]光环效果：场上所有己方，[警戒]、[反击]及[先制]次数增加1次。[警戒]、[反击]及[先制]时，依据最大可用次数提高攻击：每有1次提高4%攻击，至多20%；若最大次数高于4次则攻击额外提高20%。", "冰原野性": "[冰原野性]✦拥有[跳跃]、[攀爬]。受到击退距离减1。✦受到伤害降低15%，处于[冰冻]地形格时，受到伤害额外降低20%。✦无视[冰冻]地形格影响。途经[冰冻]地形格时不消耗移动力，每回合最多对3块地形格生效。", "冰牙陷阱": "[冰牙陷阱]【冰牙陷阱】对自身范围1格内所有敌人造成10%生命值的[穿透伤害], 打断行动, 并施加[▼移动1], 再使地形格变为[冰冻], 持续2回合。", "冰面滑行": "[冰面滑行]✦途经[冰冻]地形格时不消耗移动力，最多对2块地形格生效✦在[冰冻]地形格执行[待机]后，可选择方向滑行。", "超大份口粮1": "[超大份口粮1]\n✦受到治疗效果提高2%。\n✦每拥有100速度：攻击提高1%；以含有[无视守护]系列技能攻击时，攻击额外提高1%。\n以上效果各最多叠加3次。", "超大份口粮2": "[超大份口粮2]\n✦受到治疗效果提高4%。\n✦每拥有100速度：攻击提高2%；以含有[无视守护]系列技能攻击时，攻击额外提高1%。\n以上效果各最多叠加3次。", "超大份口粮3": "[超大份口粮3]\n✦受到治疗效果提高6%。\n✦每拥有100速度：攻击提高3%；以含有[无视守护]系列技能攻击时，攻击额外提高1%。\n以上效果各最多叠加3次。", "超大份口粮4": "[超大份口粮4]\n✦受到治疗效果提高8%。\n✦每拥有90速度：攻击提高3%；以含有[无视守护]系列技能攻击时，攻击额外提高2%。\n以上效果各最多叠加3次。", "超大份口粮5": "[超大份口粮5]\n✦受到治疗效果提高10%。\n✦每拥有80速度：攻击提高4%；以含有[无视守护]系列技能攻击时，攻击额外提高2%。\n以上效果各最多叠加3次。", "缠缚": "[缠缚]减益，所属控制-干扰类，携带者不可释放含有[传送]或[冲锋]效果的技能。", "冰墙": "[冰墙]坚固的冰墙，站上去或者推动都不会破碎，打碎比较困难，一定时间后会消失。", "冰原之心•神迹": "【冰原之心•神迹】光环，使得场上已方：免疫[永冻冰堑]地形格，跳跃力增加1格，往高地移动时，无视移动力衰减。\n✦若目标是阵营，额外获得：攻击提高10%，防御提高20%；生成任意[地形格]时，攻防属性提高15%，效果持续2回合。", "冰原之心•神裁": "【冰原之心•神裁】对自身范围3格内地形格进行[侵蚀]，触发时可无视闪避造成25%物攻值的远程伤害，并施加[×反应技]，持续1回合，每回合对每个敌人最多触发3次。\n✦当范围内敌人行动结束时，若该敌人未曾移动，则耗尽剩余可触发次数，每1次使技能倍率提高25%，并施加1层[霜烬]。", "冰原之心•神恩": "[冰原之心•神恩]光环，免疫[永冻冰堑]地形格，跳跃力增加1格，往高地移动时，无视移动力衰减。", "冰碴": "[冰碴][芬恩]的好伙伴，可灵活游走于战场之上。✦继承[芬恩]100%基础攻防属性和基础生命值，对范围内的[芬恩]进行[援护防御]；✦拥有放置、触发[冰寒地刺]或[爆裂地刺]，及与目标交换位置等多种技能。", "冰寒地刺": "[冰寒地刺]✦任意角色途经或停留时触发（若是敌人则被打断行动）。触发后[芬恩]对[触发物]范围1圈内敌人，造成40%物攻值的[穿透伤害]，并施加1层[极寒]、[▼攻击3]（持续1回合）。", "卜预": "[卜预]✦魔攻提高4%，治疗效果提高5%。✦行动结束时，若层数大于等于3层，则回复1点能量。", "庇护之力1": "[庇护之力1]✦受到治疗效果提高20%。✦受到伤害后，若自身处于[受伤]状态，则受到[卡丽丝•庇护之誓]的治疗（无视距离），回复其魔攻值50%的生命值，每回合最多触发2次。✦场上最多存在1个本效果，重复施加会移除最早施加的。✦星级达到3时，升级为[庇护之力2]。", "庇护之力2": "[庇护之力2]✦每回合首次释放有消耗的技能时，所消耗能量减1。✦受到治疗效果提高20%。✦受到伤害后，若自身处于[受伤]状态，则受到[卡丽丝•庇护之誓]的治疗（无视距离），回复其魔攻值50%的生命值，每回合最多触发2次。✦场上最多存在1个本效果，重复施加会移除最早施加的。", "庇护之力": "[庇护之力]包含[庇护之力1]和[庇护之力2]。✦受到治疗效果提高，受到伤害后若是[受伤]，则被施法者治疗。✦场上只有1个，重复施加会移除最早施加的。✦升级为[庇护之力2]时，每回合首次释放技能时所需能量减少。", "不屈之枪": "[不屈之枪]防御属性增益，每层使防御提高3%。每层持续时间独立。", "穿甲": "[穿甲]增益，攻击时，无视目标40%的防御。", "倒吊人刺客": "[倒吊人刺客]指通过召唤出来的特殊友军。", "倒吊人标记": "[倒吊人标记]状态，受到特定技能攻击时会遭到额外的伤害。", "穿透伤害": "[穿透伤害]指无视目标物理、魔法防御，直接造成的伤害。", "低地": "[低地]指自身位置高度，低于对手大于等于2格时的状态。", "斥力屏障": "[斥力屏障]增益，免疫击退，每层攻击提高2%。[格挡]物理攻击，并降低50%伤害，每次受到伤害后移除1层，不可驱散，无法免疫，最多叠加5层。", "斥力放出": "[斥力放出]技能，选择自身十字范围内1名敌人，造成横排3格内所有敌人90%[范围伤害]，击退2格，施加目标[▼移动2]，持续1回合。", "冲锋": "[冲锋]状态，指向目标角色或目标地点发起冲锋，产生位置变化的技能。", "刺刀充能": "[刺刀充能]攻击提高10%，对拥有[倒吊人标记]的目标效果翻倍。主动攻击后，移除所有层数。", "待机": "[待机]状态，指本次行动没有进行[攻击回合]，直接结束。使用[瞬发]技能，不属于进行[攻击回合]。", "迟钝": "[迟钝]减益，受到[×反应技]，且受到暴击后，受到[晕眩]。", "持续伤害": "[持续伤害]特定伤害类型，包括以下减益所造成的伤害：灼烧、感染、生命流失、圣痕、蚀炎等。", "穿透免伤3": "[穿透免伤3]增益，受到[穿透伤害]降低30%。", "穿透易伤2": "[穿透易伤2]减益，受到穿透伤害提高20%。", "刺丽瑰": "[刺丽瑰]召唤角色，拥有更强大的攻击技能。", "大地的祝福": "[大地的祝福]增益，移动时会使途经路径变为[花田]，持续2回合。", "淡月白": "[淡月白]召唤角色，可为友军进行[援护防御]。", "筹划中": "[筹划中]减益，使用技能[将杀]或[引入]后获得，拥有时不可使用上述技能，效果不可驱散，无法免疫。", "晨曦之力1": "[晨曦之力1]增益，1级效果，魔法范围伤害提高10%。", "晨曦之力2": "[晨曦之力2]增益，2级效果，魔法范围伤害提高15%。", "晨曦之力3": "[晨曦之力3]增益，3级效果，魔法范围伤害提高20%。", "祷求圣启": "[祷求圣启]行动开始时，获得[圣启]，持续1回合。\n本效果不可驱散，无法免疫。", "持续伤害效果": "[持续伤害效果]自身施加的[持续伤害]的效果提高一定百分比。", "次级冻伤": "[次级冻伤]减益，所属生命流失类；行动结束时，损失施法者物攻值与魔攻值之和的15%生命值。", "触发物": "[触发物]在战场上摆放的触发物，大多数情况下会在途径或停留时产生特别效果。", "超重装强袭3": "[超重装强袭3]伤害、穿透伤害提高10%，不可驱散，无法免疫。", "穿透伤害2": "[穿透伤害2]增益，造成穿透伤害提高20%。", "初级雇佣弓手": "[初级雇佣弓手]守望者，被召唤的召唤物角色，拥有技能[游击]、[狙足]等。", "胆寒": "[胆寒]被拥有[护盾]的敌人攻击时，受到伤害提高10%；若敌人属于或阵营，则受到伤害额外提高10%。", "帝国不朽军": "[帝国不朽军]召唤角色，不可操控。", "传送门•瞬发": "[传送门•瞬发]（支援）[魔法强化]、[瞬发]，选择目标，传送至目标范围6格内任意[空地]。✦对己方释放时，使其获得[▲伤害3]、[▲速度2]，持续2回合；对敌人释放时，造成100%伤害，施加[晕眩]，持续1回合✦传送后，对目标范围2格内所有敌人进行追击，造成魔攻值50%的范围伤害，并施加[易伤3]，持续2回合。", "锤铠鼬背甲": "[锤铠鼬背甲]触发物，使拾取角色[再行动]，获得[锤铠鼬背甲](持续2回合)，效果：受到伤害降低50%，被单体攻击时，会进行[反击]，造成攻击总值60%的魔法伤害，每回合最多触发1次。", "初召之器": "[初召之器]（魔法伤害）当拥有4层及以下的[烛光]时，才可释放，可对场上所有敌人造成85%伤害。", "充盈之器": "[充盈之器]（魔法伤害）当拥有4至8层[烛光]时，才可释放。对场上所有敌人造成120%伤害。", "呆呆雪人": "[呆呆雪人]自身受到碰撞伤害降低100%。被己方攻击时，受到伤害降低100%\n✦战斗回合结束时，在自身范围1圈内随机空地，生成[苔原蜜果]和[碎冰]各1个。\n✦被攻击并击退后，在范围内随机生成1个[苔原蜜果]或1个[碎冰]。", "打跑战术": "[打跑战术]攻击后可再移动3格。", "大号雪球": "[大号雪球]可被推动，自身受到碰撞伤害降低100%。滚动时对路径目标造成5000点，及推动者物攻值加魔攻值50%的[穿透伤害]，本次伤害拥有[无视守护]。", "刀刃伤口": "[刀刃伤口]✦受到物理伤害提高5%，受到治疗效果降低50%。✦最多可叠加2层，达到2层时，若目标拥有[自然守护]，则受到[守护失效]。", "筹谋": "[筹谋]触发[落子无声]的效果，最多叠加2层。", "伺机": "[伺机]获得本效果时，若拥有4层或以上，则消耗4层并获得1次[立刻行动]。", "伺机回能3": "[伺机回能3]✦战斗开始时，获得2点能量。✦触发[伺机]效果时，回复2点能量；每回合首次触发时，额外回复2点能量。", "伺机回能2": "[伺机回能2]✦战斗开始时，获得1点能量。✦触发[伺机]效果时，回复2点能量；每回合首次触发时，额外回复2点能量。", "伺机回能1": "[伺机回能1]✦战斗开始时，获得1点能量。✦触发[伺机]效果时，回复2点能量；每回合首次触发时，额外回复1点能量。", "穿透免伤2": "[穿透免伤2]增益，受到穿透伤害降低20%。", "穿透附加•暴击": "[穿透附加•暴击]暴击率、暴击伤害的20%附加在穿透伤害上，本效果最多提高20%穿透伤害。", "初月的庇护1": "[初月的庇护1]每层使伤害、穿透伤害提高0.5%，最多叠加8层，每层持续时间独立。", "初月的庇护2": "[初月的庇护2]每层使伤害、穿透伤害提高1%，最多叠加8层，每层持续时间独立。", "初月的庇护3": "[初月的庇护3]每层使伤害、穿透伤害提高1.5%，最多叠加8层，每层持续时间独立。", "地形格": "[地形格]状态，指角色或物品所能站立的地方。", "穿透易伤3": "[穿透易伤3]减益，受到穿透伤害提高30%。", "感染": "[感染]减益，每次行动结束时，损失一定的生命值，层数越高，伤害越高，可叠加，最高9层，生效后层数减半。✦ 按层数损失生命值为4%、8%、12%、18%、26%、36%、46%、58%、72%。", "风甲": "[风甲]增益，防御提高一定百分比。", "风怒": "[风怒]增益，攻击提高一定百分比。", "防御属性减益": "[防御属性减益]减益，包含以下减益：[▼物防]系列、[▼魔防]系列、[易伤]系列。", "厄运苏醒": "[厄运苏醒]增益，攻击提高20%，产生50%[生命汲取]。行动结束时，对自身范围3格进行[警戒]，可造成70%魔法伤害，每回合最多生效3次。", "高地": "[高地]指自身位置高度，高于对手大于等于2格时的状态。", "附魔": "[附魔]增益，每层攻防属性提高6%，不可驱散，无法免疫。", "干扰": "[干扰]减益，包含以下减益：▼移动系列、×主动技、×被动技、×反应技、×援护、×闪避、致盲、强制直行等。", "防御属性增益": "[防御属性增益]增益，包含以下增益：[▲物防]系列、[▲魔防]系列、[免伤]系列。", "定身": "[定身]减益，包含以下减益：[晕眩]、[睡眠]、[冰封]。", "刚烈之华": "[刚烈之华]被自身范围2格内敌人攻击后，对范围内所有敌人，造成90%[物理范围伤害]，产生45%[生命汲取]，但是每额外命中1个目标，造成伤害降低10%，最多30%。本效果不可驱散，无法免疫。", "反击烈斩": "[反击烈斩]增益，反击和触发个性时，伤害提高85%，可产生45%[生命汲取]，反击时最大射程增加8格，最小射程增加2格，反击次数每回合额外触发2次。", "定点爆破": "[定点爆破]对目标标记，目标被施法者以任意非[装备]技能攻击后；施法者下次行动开始时；目标被击败时，都会触发爆炸。爆炸可对该目标及其范围2格内所有敌人造成20%生命值的[穿透伤害]，再施加[易伤2]，持续2回合。", "反击": "状态，受到单体攻击且对方在攻击范围内时，用普攻或技能进行反击，造成一定的伤害。", "点燃": "[点燃]减益，所属生命流失类；行动结束时，损失施法者物攻值与魔攻值之和的25%生命值。", "冻伤": "[冻伤]减益，所属生命流失类；行动结束时，损失施法者物攻值与魔攻值之和的50%生命值。", "恶魔": "[恶魔]增益，攻防属性提高3%，最多30%，不可驱散，无法免疫。", "抵抗定身": "[抵抗定身]增益，行动结束时，若自身受到[定身]，则移除所有[定身]效果，并获得[免疫定身]，持续3回合。", "额外行动": "[额外行动]回合外的新行动机会，不会触发行动开始和行动结束效果。", "发威": "[发威]增益，被[正、侧方]敌人物理攻击时，100%概率触发格挡；[格挡]时，受到伤害额外降低20%。被自身范围2格内[正、侧方]敌人物理攻击时，进行[反击]，对目标范围1圈内所有敌人造成70%范围[物理伤害]，每回合最多触发2次。[发威期间]，被攻击后额外获得1层[炸毛]。本效果不可驱散，无法免疫。", "定身防护": "[定身防护]增益，免疫1次[定身]类减益或强制打断，效果触发后移除。", "附属被动": "[附属被动]✦属于主动技的附属被动效果，不属于真正的被动技；✦被[×主动技]时也会一同生效。", "高级雇佣弓手": "[高级雇佣弓手]守望者，被召唤的召唤物角色，拥有技能[游击]、[强力射击]、[破空穿云箭]等。", "帝王原初烙痕": "[帝王原初烙痕]领袖光环，场上所有阵营为的己方，攻击提高10%，防御提高20%。伤害、穿透伤害、持续伤害效果提高5%；拥有[解放]时，额外提高10%。", "帝血之力": "[帝血之力]最多叠加15层，可被消耗以释放[赦心]。", "风舞斩": "[风舞斩]强制选中自身范围3格内最近的2名敌人，造成60%物理范围伤害，并使得技能[镇恶]的冷却时间归0。", "焚罪业3": "[焚罪业3]物攻提高12%，使[净生灵]的暴击率提高效果翻倍。", "焚罪业2": "[焚罪业2]物攻提高9%，使[净生灵]的暴击率提高效果翻倍。", "焚罪业1": "[焚罪业1]物攻提高6%，使[净生灵]的暴击率提高效果翻倍。", "反击风暴": "[反击风暴]增益，反击伤害提高85%，反击射程增加2，反击次数加1。", "粉碎枷锁": "[粉碎枷锁]被[解放枷锁]技能攻击时，每层受到伤害、[穿透伤害]提高1%，最多叠加30层。", "抵抗初级": "[抵抗初级]受到生命值[百分比伤害]降低50%，免疫定身、[×主动技]、击退、打断。", "奋勇当先！": "[奋勇当先！]攻击力提高30%，防御力降低30%，以下技能会变更：✦[普攻]变更为[锐勇连击]；✦[立盾•固战御敌]变更为[立盾\n•全力推进；✦[骑士•奋勇当先!]变更为[立盾•转攻为守]。", "风息粉尘": "[风息粉尘]受到治疗效果提高20%，免疫[×受治疗]和[▼受治疗]；受到治疗后，驱散自身1个[减益]。", "法印技能": "[法印技能]主动使用任意[法印技能]后，使所有[法印技能]强制产生1回合冷却。", "厄运共鸣": "[厄运共鸣]光环，受到[持续伤害]提高35%", "多重爆裂": "[多重爆裂]可被特定技能所消耗，并产生额外效果。效果最多叠加10层。", "兜里的存货": "[兜里的存货]✦使用技能[冰棘漫野]后，可再移动2格；✦技能[当心脚下]每回合使用次数额外加1。✦释放对应技能后，本效果移除。", "锋芒": "[锋芒]积蓄后可用于释放技能[凛冬极星]系列，最多可叠加12层。\"收敛克制，直到极星破夜。\"", "洞破": "[洞破]对施法者造成伤害、穿透伤害降低50%，攻击后移除效果。", "抵抗控制": "[抵抗控制]行动结束时，若自身受到[控制]，则移除所有[控制]效果，并获得[免疫控制]，持续3回合。", "粉碎": "[粉碎]最多可叠加10层。下次受到[非持续伤害]时，最终受到伤害提高3%×[粉碎]层数，触发后移除本效果。", "恩眷暂隐": "[恩眷暂隐]无法释放[寒流奔涌]。", "附加蛊惑": "[附加蛊惑]✦触发[质疑之种]伤害时，会对其范围内拥有该效果的敌人再造成1次伤害，触发后移除1层。✦本效果持续到施加者下一次行动开始。", "防御加护": "[防御加护]✦每层使敌人攻击时，防御提高10%。每层持续时间独立。✦被敌人攻击受到伤害时，根据威力移除一定层[防御加护]。（至少移除1层，根据攻击者的优势攻击值×倍率/受击者最大生命值，每有10%则移除层数额外+1）", "额外效果": "[额外效果][真爱世人之光]额外效果，准备期间：✦拥有不屈，触发时可回复5%生命值，且立刻释放准备效果，[虔诚值]减少10点，受到[极度虚弱]，持续5回合（随星级成长而减少）。✦拥有光环，效果：范围内已方受到伤害降低20%，且[卡丽丝]分摊范围内其他友军50%所受伤害，若目标拥有[庇护之力]系列，则分摊其100%所受伤害。", "额外技能": "[额外技能]战斗中获得的技能，如个性赋予技能、场景交互物赋予技能、团队技能等。", "反击战意": "[反击战意]✦增加技能[犯者必诛]触发反击效果的额外次数，触发时消耗，最多叠加3层。✦行动结束时，消耗20整倍数的[杀气]，每消耗20层，获得1层[反击战意]（直至层数上限）。", "厄兆": "[厄兆]指[流血]、[次级冻伤]、[冻伤]、[点燃]、[能量反噬]、[灼烧]或[感染]。在技能[狂蛇之影]倍率计算中，具体数值为：✦ 流血、次级冻伤15%；冻伤50%；点燃25%；灼烧10%；能量反噬15%×（自身所缺能量+1）；✦ 感染以实际层数结算。", "厄兆疫变": "[厄兆疫变]指下列减益，受到指定伤害后，被[薇佩拉]施加对应减益。随后移除对应效果。✦ [厄兆疫变•流血]、[厄兆疫变•点燃]、[厄兆疫变•冻伤]。", "鼓舞之舞": "[鼓舞之舞]增益，使自身范围5格内所有己方，伤害提高20%，产生40%[生命汲取]。", "回击": "[回击]增益，被[正、侧方]敌人主动攻击时，若对方在攻击范围内，则用普攻进行[反击]，造成70%伤害，每回合生效1次。", "格挡": "[格挡]增益，被[正、侧方]物理攻击时，50%概率面向敌人，伤害降低20%。", "孤立": "[孤立]减益，使携带者无法受到来自友军的[光环]效果。", "攻击姿态": "[攻击姿态]增益，自身物防值的40%附加在物攻上，受到伤害提高8%。", "格挡强化": "[格挡强化]增益，受到[正、侧方]远程物理攻击时，100%概率触发格挡，[格挡]时，受到伤害额外降低10%。", "攻击属性减益": "[攻击属性减益]减益，包含以下减益：[▼攻击]系列、[▼伤害]系列、[▼暴击]系列、[▼暴伤]系列。", "环境伤害": "[环境伤害]指击退、滚石、炸药桶、地刺、落石等环境伤害。", "护盾": "[护盾]护盾，分为物理护盾、魔法护盾，可以分别额外抵挡物理伤害、魔法伤害。", "个性": "[个性]技能，每个角色的[个性]效果各不相同，具体可点击查看角色详情的[个性]栏。", "光谕": "[光谕]增益，使部分卡丽丝专属技能产生技能变更；非卡丽丝专属技能，则最大射程增加2格，所消耗能量减少1。若本次行动释放过技能，行动结束时移除。本效果不可驱散，无法免疫。", "光耀护盾": "[光耀护盾]护盾，一种特殊的魔法护盾。", "格挡强化2": "[格挡强化2]增益，受到[正、侧方]远程物理攻击时，100%概率触发格挡，[格挡]时，受到伤害额外降低25%。", "花田": "[花田]地形格，角色停留时，受到治疗效果提高15%。被[火属性]攻击时，地形格变为[燃烧]。", "后备隐藏脂肪": "[后备隐藏脂肪]每层拥有10%生命值的[物理护盾]和[魔法护盾]，本效果可叠加10层。任一类型护盾被击破时，移除所有层数。", "焕梦": "[焕梦]\n驱散场上所有友军2个[减益]，并使其获得[▲攻击2]，持续2回合。", "好梦无邪": "[好梦无邪]\n增益，被攻击后或行动开始时移除。被攻击后，回复施法者50%魔攻值的生命值，获得[▲物防2]、[▲魔防2]，持续2回合；行动开始时，治疗量提高至施法者魔攻100%魔攻值的生命值，额外获得[▲攻击2]，驱散并免疫[属性减益]，持续2回合。", "黑羽": "[黑羽]✦可被[妮蒂娅]或伊瑟琳德施加。✦在妮蒂娅当前行动内，被其[普攻]攻击时，触发[黑羽千片]，攻击后消耗[黑羽]", "黑羽千片": "[黑羽千片]效果，触发时，妮蒂娅[普攻]攻击目标时技能倍率降低至10%，然后触发[黑羽千片]伤害效果：对目标范围2格内所有敌人造成80%[范围伤害]。妮蒂娅1次攻击内，同一目标最多受到4次[黑羽千片]攻击，后3次技能倍率降低至15%。", "攻击指挥": "[攻击指挥]（光环）使自身范围2格内其他友军，攻击提高12%。", "光辉恩泽": "[光辉恩泽]增益，非[召唤物]时，攻击、伤害提高15%。", "光辉守望": "[光辉守望]重复获得时，持续时间叠加。自身范围5格内所有己方，获得光环效果：✦行动结束时驱散1个[减益]并获得[光辉照耀]，持续2回合。✦阵营为〈侵掠如火〉和〈法皇国〉的己方，释放[职业技能]攻击前，对敌人施加[审判烙印]，持续2回合。", "光辉照耀": "[光辉照耀]增益，受到伤害时回复生命值治疗量为施法者魔攻值的30%。本效果最多叠加2层，触发效果后移除1层。", "护盾值": "[护盾值]指具体的护盾数值。", "护盾再生3": "[护盾再生3]增益，自身行动结束时，获得生命值30%的[物理护盾]和[魔法护盾]。", "光棱晶石": "[光棱晶石]召唤角色，继承施法者一定基础属性。", "故事反转": "[故事反转]（支援）选择非受到[命运•注视]者，使其与受到[命运•注视]者交换位置。\n}}", "归燕": "[归燕]✦物理攻击后，对目标施加[▼速度2]，持续2回合。✦行动结束时，将自动传送回5格内最近的队友身边，回复30%生命值、1点能量。", "幻像": "[幻像]召唤角色，持续一定时间后离场。", "黑曜石吊坠1": "[黑曜石吊坠1]魔法伤害提高8%，治疗效果提高6%。", "黑曜石吊坠2": "[黑曜石吊坠2]魔法伤害提高12%，治疗效果提高9%。", "黑曜石吊坠3": "[黑曜石吊坠3]魔法伤害提高16%，治疗效果提高12%。", "黑曜石吊坠4": "[黑曜石吊坠4]魔法伤害提高16%，治疗效果提高12%。使用技能后，若目标是已方，则驱散1个[减益]；若目标是敌人，则驱散1个[增益]。", "黄褐色猫头鹰": "[黄褐色猫头鹰]✦行动结束时，回复1点能量。✦主动使用任意[法印技能]后，回复1点能量。", "高级无视守护": "[高级无视守护]✦攻击时，无视目标40%防御。✦可无视[自然守护]所产生的效果。", "虎牙": "[虎牙（多余）]触发物，使拾取角色[再行动]，下一次攻击造成伤害时，攻击增伤100%。", "嘿咻": "（支援）选择[物品]，击退2格。若目标是[呆呆雪人]，则获得[再攻击]，并继承剩余移动力。\n✦场上没有己方[呆呆雪人]时，技能变更为：[堆堆雪人]。", "寒路相伴": "[寒路相伴]自身范围3格内所有敌人受到[穿透易伤1]", "个性减伤•SP阿加塔": "[个性减伤]✦个性为1、2星时，受到伤害降低40%；✦个性为3、4星时，受到伤害降低50%；✦个性为5星时，受到伤害降低60%。", "共鸣•魔术师": "[共鸣•魔术师]✦装备塔罗之语[魔术师的梦想]时，可触发其装备技能的最大伤害提高效果，并把所有伤害加成视为等额穿透伤害加成；✦攻击[灵感星核]时，使其转移[灵感指数]时比例翻倍。", "归于虚空": "[归于虚空]不算入[虚空投影]场上最多存在的数量，在当前战斗回合结束时离开战场。", "公正审判": "[公正审判]同时对敌我双方发动的效果：✦对命中的敌人造成50%物理伤害；对己方造成30%物攻值的治疗。✦[克莱雅]每回合可发动本效果3次，发动后获得1层[明察]。", "光辉使者": "[光辉使者]光环，使场上所有阵营的己方，攻击提高10%，防御提高20%，并获得效果：✦行动开始时，[虔诚值]增加5点。✦被[巡光使]环绕时，获得[虔诚值]时额外增加5点。", "蛊惑": "[蛊惑]✦触发[质疑之种]伤害时，会对范围内拥有该效果的敌人（除触发者以外）再造成1次伤害。✦本效果持续到施加者行动开始。", "革命风暴": "[革命风暴]光环效果：所有处于[质疑之种]警戒范围内的敌人受到[穿透易伤2]、[▼伤害2]及[▼穿透伤害2]。", "辉光灌注": "[辉光灌注]下一次主动攻击时，伤害、穿透伤害提高30%，效果持续至技能结束后移除。", "光辉真义": "[光辉真义]下一次主动使用[治疗]或含[穿透伤害]技能时，攻击和穿透伤害提高60%，效果持续至技能结束后移除。", "光辉军魂1": "[光辉军魂1]领袖光环，1级效果，场上所有阵营为的己方，攻击提高10%，防御提高20%；防御总值的增长比例，每提高20%，使得伤害、穿透伤害提高5%，最多提高10%。✦防御总值的增长比例=（当前防御总值-基础防御总值）/基础防御总值。", "光辉军魂2": "[光辉军魂2]领袖光环，1级效果，场上所有阵营为的己方，攻击提高10%，防御提高20%；防御总值的增长比例，每提高20%，使得伤害、穿透伤害提高10%，最多提高20%。✦防御总值的增长比例=（当前防御总值-基础防御总值）/基础防御总值。", "诡计•暴露": "[诡计•暴露]无法释放技能[蛇影诡步]，但攻击后可再移动，距离为剩余移动力加1。", "剑技•疾风": "[剑技•疾风]技能，选择自身十字范围内1名敌人，造成120%物理伤害，攻击前，每移动1格，伤害提高10%，最多50%。", "剑技•圆月斩": "[剑技•圆月斩]技能，对自身范围2格内所有敌人，造成90%伤害，目标处于[受伤]状态时，造成伤害额外提高30%，技能使用后，自身获得[免伤2]，持续2回合。", "警戒": "[警戒]增益，对某区域进行警戒，当敌人进入该区域后，释放技能。", "健康": "[健康]状态，生命值大于等于70%时的状态，没任何负面影响。", "火属性": "[火属性]状态，使可被燃烧的地形格变为[燃烧]。", "禁锢": "[禁锢]减益，所属控制-干扰项，速度减少100点，无法移动。", "活力": "[活力]标记，每拥有1层，暴击率提高1%，不可驱散，无法免疫。并且：10层时，伤害提高10%；20层时，暴击伤害提高10%；30层时，伤害、暴击伤害再提高10%。", "机动队标记": "[机动队标记]状态，受到特定技能攻击时会遭到额外的影响。", "缴械": "[缴械]减益，所属控制-干扰类，携带者不可释放[普攻]和[主动技能]，只可以使用装备技能。", "减益": "[减益]指对当前角色造成不利状态的情况。", "机动姿态": "【机动姿态】（支援）移除自身[强击姿态]，获得[▲速度2]，持续1回合，可再移动。", "净生灵3": "[净生灵3]暴击率提高12%，使[焚罪业]的物攻提高效果翻倍。", "净生灵2": "[净生灵2]暴击率提高9%，使[焚罪业]的物攻提高效果翻倍。", "净生灵1": "[净生灵1]暴击率提高6%，使[焚罪业]的物攻提高效果翻倍。", "祭舞": "[祭舞]光环，拥有[祭舞·雨露]及[祭舞天赦]效果。\n[祭舞•雨露]自身范围5格内的己方被单体攻击或[露卡玛尔]下次行动开始时，受到[露卡玛尔]的治疗，治疗量为其物攻值的60%，驱散2个[减益]并获得随机2个[2级增益]，持续2回合，光环持续期间每个目标只生效1次。\n[祭舞•天赦]自身范围5格内的〈埃拉曼〉己方行动开始或行动结束时，获得5层[解放]，光环持续期间对每个目标只生效1次。", "祭舞•雨露": "[祭舞•雨露]自身范围5格内的己方被单体攻击或[露卡玛尔]下次行动开始时，受到[露卡玛尔]的治疗，治疗量为其物攻值的60%，驱散2个[减益]并获得随机2个[2级增益]，持续2回合，光环持续期间每个目标只生效1次。", "祭舞•天赦": "[祭舞•天赦]自身范围5格内的〈埃拉曼〉己方行动开始或行动结束时，获得5层[解放]，光环持续期间对每个目标只生效1次。", "解放": "[解放]✦每层可使释放[解放枷锁]时，暴击率提高2%，最多10%。✦拥有指定层数时激发[解放枷锁]的额外效果。✦最多叠加20层。", "解放枷锁": "[解放枷锁]技能标签，根据[解放]层数产生额外效果。", "角斗霸主": "[角斗霸主]✦被1格范围内的敌人主动攻击时，以[普攻]进行[反击]，每回合最多生效1次，反击时无视目标[阻挡]。✦自身[反击]范围内存在[挑战者]时，反击改为以最近的[挑战者]为目标。✦每层使反击伤害提高20%,反击射程增加1格，反击次数增加1，最多可叠加4层。满4层时，反击时物攻额外提高50%。", "晶棱折射": "[晶棱折射]（被动）被攻击时，对自身范围3格内随机1名敌人造成75%魔法伤害，每回合最多触发3/4次。", "镜反1": "[镜反1]每回合，[晶棱折射]触发次数临时加1，仅被敌人攻击时触发且优先消耗；触发临时次数时，攻击提高20%。", "镜反2": "[镜反2]每回合，[晶棱折射]触发次数临时加2，仅被敌人攻击时触发且优先消耗；触发临时次数时，攻击提高40%。", "晶能引力": "[晶能引力]受到碰撞伤害或被击败时，[沙娜姿]对持有者及场上所有受到[晶能引力]目标范围3格内的所有其他角色造成50%魔法伤害；释放后移除场上所有[晶能引力]。✦本效果拥有[解放枷锁]标签。✦本效果每回合最多触发1次，[沙娜姿]行动开始时重置限制次数。", "极暗波动": "[极暗波动]技能，对目标范围2格内所有敌人，造成70%[范围伤害]，施加[×被动技]、[×反应技]，持续2回合。", "机动队作战参谋": "[机动队作战参谋]光环，5级效果，攻击拥有[机动队标记]的目标时，攻击增加15%。进行[援护攻击]、[警戒]时，造成伤害、[穿透伤害]额外提高25%。", "火力连发": "[火力连发]拥有[个性]中[援护攻击]效果，能和[个性]同时触发。触发时消耗1层，最大可叠加4层。", "角质壁垒": "[角质壁垒]拥有角质壁垒时，额外拥有50%伤害减免。最多可叠加8层。", "金狮形态": "[金狮形态]✦伤害提高20%、暴击率提高30%。释放单体攻击，对主目标施加[易伤1]，持续2回合。✦拥有额外技能[露西亚之血永存！]。释放[裂空连打]或[贯日强击]后，若拥有4点[狮血]，则可[再攻击]，仅可使用[露西亚之血永存！]，本效果每回合最多触发1次。✦行动结束时，移除4点[狮血]。[狮血]为0时，变回[人形形态]。", "金狮之傲1": "[金狮之傲1]暴击伤害提高2%，最多可叠加12层，每层持续时间独立。", "金狮之傲2": "[金狮之傲2]暴击伤害提高3%，最多可叠加12层，每层持续时间独立。", "金狮之傲3": "[金狮之傲3]暴击伤害提高4%，最多可叠加12层，每层持续时间独立。", "击飞1": "[击飞1]受到击退距离增加1。", "金狮形态•弱": "[金狮形态•弱]✦攻防属性提高20%，[免疫干扰]，受到治疗量降低60%。✦所有职业技能拥有[无视守护]。✦拥有[▲移动1]、[跳跃]、[攀爬]及[翻越]。✦战斗回合结束时，若自身本回合没造成任何伤害，或处于[濒死]状态，则退出形态。", "回味甘甜": "[回味甘甜]受到伤害后，自身回复生命值，治疗量为施法者物攻值的30%，最多叠加3层，触发后移除1层本效果。", "极寒": "[极寒]✦每层暴击率降低10%。✦拥有3层时，消耗所有层数，并受到1回合[冰枢]，持续1回合。", "皆归寒原": "[皆归寒原]光环：✦无视[冰冻]、[永冻冰堑]地形格影响。免疫[▼移动]系列。✦处于[冰冻]、[永冻冰堑]地形格时，攻击后可再移动2格。✦行动结束时，若处于[冰冻]、[永冻冰堑]地形格，则受到[珀列维特]治疗，治疗量为其魔攻值的40%。", "静聆神谕": "[静聆神谕]✦技能标签，含有[罚斥]、[神泽]、[默祷]共3个技能。✦所有技能被使用后，重置[静聆神谕]技能，可再次被使用。", "寂影低语3": "[寂影低语3]攻击提高8%，暴击率、暴击伤害提高10%，最大叠加2层。每层持续时间独立。", "寂影低语2": "[寂影低语2]攻击提高6%，暴击率、暴击伤害提高8%，最大叠加2层。每层持续时间独立。", "寂影低语1": "[寂影低语1]攻击提高4%，暴击率、暴击伤害提高6%，最大叠加2层。每层持续时间独立。", "戒律": "[戒律]指【教廷的审判】或任意变化的戒律、戒律之座。", "剑痕": "[剑痕]由狄奥娜攻击时施加，以攻击方向决定剑痕的类型，分为[剑痕•升芒]（↗从左下至右上）、[剑痕•坠芒]（↘从左上至右下）。✦对已有[剑痕]的[大型角色]再次施加时，必定为另一种[剑痕]。", "剑痕•坠芒": "[剑痕•坠芒]由狄奥娜攻击时施加，以攻击方向决定剑痕的类型。此为(↘)从左上至右下的剑痕。", "剑痕•升芒": "[剑痕•升芒]由狄奥娜攻击时施加，以攻击方向决定剑痕的类型。此为(↗)从左下至右上的剑痕。", "极度虚弱": "[极度虚弱]拥有时，技能[真爱世人之光]准备期间不会获得额外效果。", "坚定信仰": "[坚定信仰]效果期间，若[虔诚值]小于0，则增加20点，触发后移除。", "缄默铁誓1": "[缄默铁誓1]穿透伤害提高3%，最多叠加6层；释放需能量消耗的技能后，移除全部层数。", "缄默铁誓2": "[缄默铁誓2]穿透伤害提高4%，最多叠加6层；释放需能量消耗的技能后，移除全部层数。", "缄默铁誓3": "[缄默铁誓3]穿透伤害提高5%，最多叠加6层；释放需能量消耗的技能后，移除全部层数。", "苦难": "[苦难]每层提高物防15%，最多60%.不可驱散。", "渴血战斧": "[渴血战斧]增益，伤害提升20%，产生20%[生命汲取]，最多可叠加3层。", "晶石屏障": "[晶石屏障]增益，受到物理伤害降低50%，每次被攻击后移除1层，不可驱散，无法免疫，最多叠加5层。", "晶石技能": "[晶石技能]指贝拉的[要爆炸啦！]、[高能火晶石]、[治愈光晶石]、[急冻冰晶石]等技能。", "狙击姿态": "[狙击姿态]增益，最大射程增加2格，攻击力、暴击率提高15%，无法移动，不可驱散，无法免疫。", "苦修": "[苦修]增益，受到伤害降低8%，不可驱散，最多叠加3层。", "裂伤": "[裂伤]减益，每次行动结束时，损失10%生命值，受到持续伤害提高20%，效果可叠加。", "烈酒": "[烈酒]地形格，散发着酒香。角色途经或停留时，被施加[烈酒]减益，持续2回合。该地形格被[火属性]攻击时，可被燃烧。行走其中时，每格额外消耗0.5移动力。[烈酒]减益的效果为：速度降低150点，移动力降低1格，魔防降低40%。", "狼血觉醒2": "[狼血觉醒2]增益，攻击提高15%，物防提高20%，移动力增加1格。攻击前目标每拥有1层[伤口]，对其造成物理伤害提高5%。本效果不可驱散，无法免疫。", "狼血觉醒3": "[狼血觉醒3]增益，攻击提高20%，物防提高20%，移动力增加2格，并获得[攀爬]、[跳跃]。单体攻击前若目标拥有[伤口]，则自身获得[穿甲]；攻击前目标每拥有1层[伤口]，对其造成物理伤害提高5%。本效果不可驱散，无法免疫。", "狼血觉醒1": "[狼血觉醒1]增益，攻击提高10%，物防提高20%。攻击前目标每拥有1层[伤口]，对其造成物理伤害提高5%。本效果不可驱散，无法免疫。", "苦药": "[苦药]增益，被攻击后若处于[濒死]状态，则回复40%生命值，效果触发后移除。", "窥破弱点": "[窥破弱点]减益，受到[被克制职能]的角色攻击时，对方攻击提高20%。", "眷念之注": "[眷念之注]增益，单体攻击后，回复自身和施法者20%生命值。", "柯瓦雷的收集品": "[柯瓦雷的收集品]技能组，下列技能释放后依次变更，所有技能每场战斗最多使用1次。[决胜之意]：瞬发，使目标获得[潜能激发]。[御风之火]：对范围内敌人，造成60%[火属性][范围伤害]，并施加2次[点燃]。[万能之财]：瞬发，使目标回复所有能量。[封海之寒]：对范围内敌人，造成100%[冰属性][范围伤害]，并施加[冻伤]。[千金之力]：瞬发，使目标回复所有生命。[雷霆之怒]：单攻，造成180%伤害，攻击前驱散目标所有[增益]，攻击后立刻触发目标拥有的[名单]和所有[持续伤害]类型效果。", "柯瓦雷的收藏品": "[柯瓦雷的收藏品]技能组，下列技能释放后依次变更，所有技能每场战斗最多使用1次。[决胜之意]：瞬发，使目标获得[潜能激发]。[御风之火]：对范围内敌人，造成60%[火属性][范围伤害]，并施加2次[点燃]。[万能之财]：瞬发，使目标回复所有能量。[封海之寒]：对范围内敌人，造成100%[冰属性][范围伤害]，并施加[冻伤]。[千金之力]：瞬发，使目标回复所有生命。[雷霆之怒]：单攻，造成180%伤害，攻击前驱散目标所有[增益]，攻击后立刻触发目标拥有的[名单]和所有[持续伤害]类型效果。", "料理": "[料理]物品，[料理]范围2格内的己方行动结束时，回复一定生命值，有概率同时获得[幸福感]和[饱腹感]，持续2回合，并减少[料理]一定生命值。", "立刻行动": "[立刻行动]自身速度大幅提高，若战斗回合内已行动过则获得[额外行动]反之获得[再行动]，个任意效果触发后速度恢复正常。", "烙痕•全力解放": "[烙痕•全力解放](支援)[瞬发]，没有[烙痕透支]时可用，将自身生命值改变至30%，并获得10层[解放]，及生命值30%(随星级变化)的[物理护盾]和[魔法护盾]，持续3回合；再受到[烙痕透支]，持续4回合(随星级变化)。", "烙痕透支": "[烙痕透支]生命值无法回复至30%以上。", "连招蓄势": "[连招蓄势]准备1回合，触发相同技能效果（无任何消耗）。", "聚焦": "[聚焦][光棱晶石]触发[晶棱折射]时,会被优先选取（本效果场上仅会存在1个）。", "枯藤哀歌": "[枯藤哀歌]（减益）[瞬发]，获得[枯藤哀歌]，效果：[维持]时消耗1点能量，期间获得[免伤2],且行动结束时，对自身范围4格内随机3名敌人，施加随机1个[2级减益]（持续2回合）、[受治疗逆转2]（持续1回合），之后目标如果拥有[受治疗逆转]类效果，则对其进行治疗，治疗量为魔攻值的40%，并施加1层[感染]。", "觉醒•原初之力": "[觉醒•原初之力]技能：（支援）[瞬发]，进入[原初之力]状态。✦再激活同名光环中自身攻防属性提高的效果。领袖光环：场上所有阵营为的已方，攻击提高10%，防御提高20%。✦攻击友军前，自身攻防属性提高10%，效果持续至战斗结束。✦若目标是阵营的己方召唤物，则目标也获得相同效果。", "军临城下": "[军临城下]（支援）将场上所有[帝国不朽军]召唤至目标周围；且[帝国不朽军]获得10层[战争杀器]，并对其进行攻击，使其触发[不朽战骸]并随后[消亡]。", "决死冲锋": "[决死冲锋]（穿透伤害）单体攻击，进行[冲锋]，对目标和自身造成生命值1%的[穿透伤害]，并对目标[碰撞]，施加8层[粉碎枷锁]，持续2回合，再触发[色不朽战骸]并随后[消亡]。", "敛翼调息": "[敛翼调息]使用技能[闪现]后获得，使之一段时间内不再可用。", "离巢的燕子": "[离巢的燕子]（支援）[瞬发]，移除自身[归燕]。", "昆恩法印•迅捷": "[昆恩法印•迅捷]（支援）[法印技能]，[瞬发]，获得1层[昆恩之盾]。", "昆恩法印•坚韧": "[昆恩法印•坚韧]（支援）[法印技能]，[瞬发]，获得4层[昆恩之盾]。", "猎魔人的魔药": "[猎魔人的魔药]（抉择）[法印技能]，选择使用[燕子]、[雷霆]、[黄褐色猫头鹰]或[马里波森林]。✦同时最多拥有2种[魔药]效果。", "雷霆": "[雷霆]物攻提高20%。", "昆恩之盾": "[昆恩之盾]✦获得15%生命值的[物理护盾]，可叠加4层。✦被击破时对范围3格内所有敌人，造成35%[魔法范围伤害]，并击退相邻目标1格。✦一次性被击破多层时，效果叠加。", "历战的猛将": "[历战的猛将]光环，减益，攻防属性降低8%/8%/12%/12%/15%（随马格努斯星级变化）", "可互动物品": "[可互动物品]指在战场上摆放的，可互动产生效果的物品，如炸药桶、火盆、酒桶等。", "聚焦警觉": "[聚焦警觉][安娜]通过技能[以弃亡者之名！]产生的[警戒]攻击本目标前，会消耗[安娜]所有能量和[多重爆裂]，根据消耗总数，追加每层40%物理伤害。", "裂伤(鹿首精)": "[裂伤]✦行动结束时若移动，则受到[鹿首精]物攻值的120%伤害。✦可叠加，每层[裂伤]造成伤害，提高60%。", "渴血": "[渴血]受到伤害后，获得[渴血战斧]，持续2回合。", "狂鬃形态": "[狂鬃形态]✦攻防属性提高20%，[免疫干扰]，受到治疗量降低60%。✦所有职业技能拥有[无视守护]。✦拥有[▲移动1]、[跳跃]、[攀爬]及[翻越]。✦战斗回合结束时，若自身本回合没造成任何伤害，或处于[濒死]状态，则退出形态。", "净罪": "[净罪]增益，5级效果，暴击率提高25%，暴击伤害提高30%。不可驱散，无法免疫。", "绝好眼力": "[绝好眼力]✦无视敌人[隐身]，攻击敌人时额外施加[现形]（使[隐身]效果无效），持续2回合。", "泪影马戏": "[泪影马戏]光环效果：自身范围3格内所有敌人受到[持续伤害]提高35%。", "敛锋": "[敛锋]触发[格挡]时，若攻击者位于自身范围4格内，则消耗1层并进行[反击]，可对攻击者横排3格内所有敌人造成60%伤害。最多可叠加4层。", "绝对意志": "[绝对意志]（支援）回复4点能量，获得[稳固]、[无视反应]，持续2回合。回能溢出值将被存为[能量回涌]。", "绝对防护": "[绝对防护]受到下一次[非持续伤害]时，受到伤害或穿透伤害降低100%，生效后移除。", "惊喜加码": "[惊喜加码]叠加至2层时移除，并使[施法者]立即对拥有者再次触发1次[幸运观众]（伤害倍率降低一半，且不再施加本效果）。", "卡丽丝的救赎": "[卡丽丝的救赎]技能[初月庇护]释放时，会根据本效果层数产生额外效果。", "精准冲锋": "[精准冲锋]冲锋时，只可选择不超过技能高低差的位置。", "剧毒": "[剧毒]所属生命流失类。行动开始时，损失施法者攻击总值5%的生命值。每拥有1种[厄兆]，计算攻击总值时额外提高1%。✦ 厄兆：[流血]、[次级冻伤]、[冻伤]、[点燃]、[能量反噬]、[灼烧]或[感染]。", "免伤4": "[免伤4]增益，受到伤害降低40%。", "免伤2": "[免伤2]增益，受到伤害降低20%。", "面纱": "[面纱]增益，受到[范围伤害]降低99%，被[范围攻击]后消失，不可驱散，无法免疫。", "免伤3": "[免伤3]增益，受到伤害降低30%。", "满血": "[满血]状态，生命值等于100%时的状态，没任何负面影响。", "免伤1": "[免伤1]增益，受到伤害降低10%。", "笼中说梦": "[笼中说梦]光环，自身范围3格内所有己方伤害、穿透伤害提高15%，且共同分摊所受伤害，免疫[属性减益]；行动结束时回复15%生命值，不可驱散，无法免疫。", "免疫定身": "[免疫定身]增益，免疫包含以下减益：[晕眩]、[睡眠]、[冰封]。", "流连忘形": "[流连忘形]减益，所属控制-干扰项，被动技失效，并且移动力减少1格。", "魅惑": "[魅惑]减益，不受控制，朝着施法者移动。", "猎物的味道": "[猎物的味道]增益，移动力增加2格，主动攻击时，额外回复1点能量。", "免伤": "[免伤]增益，受到伤害降低一定的效果。", "免伤9": "[免伤9]增益，受到伤害降低90%。", "梦魇": "[梦魇]减益，伤害降低5%，受到伤害、受到穿透伤害提高5%，无法免疫。", "迷梦回廊1": "[迷梦回廊1]\n标记，期间[睡眠]不可被打断。\n✦被再次施加或持续时间结束时，结算[迷梦回廊1]持续期间所受伤害总量20%，不超过施法者的400%魔攻值；\n✦被再次施加时，额外造成施法者魔攻值20%的[穿透伤害]，本次伤害可被视为[迷梦回廊1]持续期间所受伤害。本效果不可驱散，无法免疫。", "迷梦回廊2": "[迷梦回廊2]\n标记，期间[睡眠]不可被打断。\n✦被再次施加或持续时间结束时，结算[迷梦回廊2]持续期间所受伤害总量30%，不超过施法者的600%魔攻值；\n✦被再次施加时，额外造成施法者魔攻值30%的[穿透伤害]，本次伤害可被视为[迷梦回廊2]持续期间所受伤害。本效果不可驱散，无法免疫。", "迷梦回廊": "[迷梦回廊]\n指根据星级对应的[迷梦回廊1]、[迷梦回廊2]。", "铃兰战旗": "[铃兰战旗]物品，飘扬的军旗，鼓舞附近的友军，使场上所有或的己方：攻击提高10%，防御提高20%；场上每存在1名或的己方，造成伤害提高3%，受到伤害降低3%，最多15%。旗帜一定时间后会消失。", "梦兆·生1": "增益，治疗效果提高4%，最多叠加3层。", "梦兆·生2": "增益，治疗效果提高8%，最多叠加3层。", "梦兆·灭2": "增益，魔攻提高4%。主动使用[职业技能]后，若使用[穿透伤害]，每层额外施加1个随机[2级减益]，持续2回合。本效果最多\n叠加3层。", "梦兆·灭1": "增益，魔攻提高2%。主动使用[职业技能]后，若使用[穿透伤害]，每层额外施加1个随机[1级减益]，持续2回合。本效果最多\n叠加3层。", "铃兰之剑协同作战！2": "[铃兰之剑协同作战！2]领袖光环，2级效果，场上所有阵营为的己方，攻击提高10%，防御提高20%。造成伤害和[穿透伤害]提高10%。✦每回合首次触发[协同响应]时，回复1点能量。", "铃兰之剑协同作战！3": "[铃兰之剑协同作战！3]领袖光环，3级效果，场上所有阵营为的己方，攻击提高10%，防御提高20%。造成伤害和[穿透伤害]提高10%，若[协同响应]技能则额外提高10%。✦每回合首次触发[协同响应]时，回复1点能量。", "铃兰之剑协同作战！1": "[铃兰之剑协同作战！1]领袖光环，1级效果，场上所有阵营为的己方，攻击提高10%，防御提高20%。造成伤害和[穿透伤害]提高10%。", "秘仪防护": "[秘仪防护]增益，拥有任意类型[护盾]时受到该类单次伤害时只会击破护盾]，免受剩余的伤害。", "满满安全感护盾": "[满满安全感护盾]✦每层拥有[克拉拉]5%生命值的[物理护盾]和[魔法护盾]，最多可叠加20层。✦任一类型护盾被完全击破时，移除所有层数。", "乱心": "[乱心]属于治疗逆转类型，受到的所有治疗转化为100%对应治疗量的[穿透伤害]，并驱散1个[增益]。", "免疫冰火地形": "[免疫冰火地形]增益，免疫[冰冻]和[燃烧]地形效果。", "烈焰术": "[烈焰术]（魔法伤害）选择自身十字范围内1个地点，造成横排5格内所有敌人120%[火属性]范围伤害，并使地形格变为[燃烧]，持续2回合。", "魅影幻像•瞬发": "[魅影幻像•瞬发]（魔法伤害）[魔法强化]、[瞬发]，在目标地形格召唤[幻像]，持续2回合，并使[幻像]对范围2格内敌人施加[魅惑]，持续1回合；再对范围内所有敌人造成80%魔法伤害，施加[易伤3]，持续2回合。", "马里波森林": "[马里波森林]暴击率提高30%。", "铃兰旗帜": "[铃兰旗帜]光环效果，3级效果，攻防属性提高20%，行动开始时，回复1点能量，所有技能冷却减1回合。", "凌驾命运": "[凌驾命运]受到碰撞伤害降低75%。", "凌于命运": "[凌于命运]受到碰撞伤害降低75%。", "满溢之器": "[满溢之器]（穿透伤害）当拥有9层及以上的[烛光]时，才可释放。对场上所有敌人造成当前生命值99%伤害。", "蛮熊形态": "[蛮熊形态]✦拥有[职业技能]：[凛冬终袭]、[裂地震]。✦伤害提高20%，受到伤害降低20%，移动力增加1格，免疫击退。✦行动结束时，消耗1层[血脉沸腾]，不满足时退出[蛮熊形态]。", "猎物印记": "[猎物印记]拥有1层时：被[罗格妮达]攻击时，受到伤害提高10%；拥有2层时，受到伤害提高至25%。最多可叠加2层。", "蛮熊形态•弱": "[蛮熊形态•弱]✦攻防属性提高30%，受到治疗量降低60%。✦拥有[不屈]，触发时可回复5%生命值，可生效2次；及拥有[强韧]，[免疫干扰]。✦所有[职业技能]拥有[破盾4]、[无视守护]，攻击后击退目标1格，若造成碰撞，额外施加[晕眩]（持续1回合）。", "凛冬之拥3": "【凛冬之拥3】拥有以下效果：\n✦生成[冰冻]地形格时获得：\n凛冬之拥3·彻寒，可使得物攻提高16%。\n✦生成非[冰冻]地形格时获得：\n凛冬之拥3·威严，可使得伤害提高16%。", "凛冬之拥2": "【凛冬之拥2】拥有以下效果：\n✦生成[冰冻]地形格时获得：\n凛冬之拥2·彻寒，可使得物攻提高12%。\n✦生成非[冰冻]地形格时获得：\n凛冬之拥2·威严，可使得伤害提高12%。", "凛冬之拥1": "【凛冬之拥1】拥有以下效果：\n✦生成[冰冻]地形格时获得：\n凛冬之拥1·彻寒，可使得物攻提高8%。\n✦生成非[冰冻]地形格时获得：\n凛冬之拥1·威严，可使得伤害提高8%。", "落花之舞": "[落花之舞]（支援）瞬移至目标角色或物品周围，再以[普攻]对任一受到[锁链]敌人攻击，并产生100%[生命汲取]。", "流血": "[流血]所属生命流失类；行动开始时，损失施法者物攻值与魔攻值之和的15%的生命值。", "灵感星核": "[灵感星核]召唤角色，继承施法者一定基础属性。✦友军攻击时，自身被视为[敌人]，受到的伤害值一定比例转移为[灵感指数]。✦行动结束或被击败时，使[召唤者]自动释放[灵感伤害]。", "灵感指数": "[灵感指数][灵感星核]受到友军伤害时，会根据伤害值的一定比例转化为本值，上限为召唤者等级×2000点。", "灵感伤害": "[灵感伤害]✦消耗所有[灵感指数]，对技能范围内的敌人（不包含自己召唤角色）平均造成[消耗灵感指数]的伤害。✦属于穿透范围伤害，但不受[穿透伤害、最终伤害提高]类效果影响。", "领航信标": "[领航信标]（光环）场上所有拥有[时空漫游]的己方释放技能前，获得[协攻]、[协防]及[免疫属性减益]，持续2回合。", "凛耀•贯日长虹": "[凛耀•贯日长虹-变化]释放后，变更为[凛耀•虹落锋回]（可释放1次）。✦凛耀•虹落锋回：与[凛耀•贯日长虹]效果相同，释放后还原为[凛耀•贯日长虹]，且其冷却增加。", "凛耀•飞星护阵": "[凛耀•飞星护阵-变化]携带时，战斗开始时获得[群星护阵]和20层[防御加护]（分别持续至下2次行动的开始时、结束时）。", "攀爬": "[攀爬]增益，往高地移动时，无视移动力衰减。", "魔能转换": "[魔能转换]增益，自身魔防的80%附加在物攻上。", "逆向斥力": "[逆向斥力]技能，选择自身十字范围内1名敌人，造成横排3格内所有敌人70%[范围伤害]，拉拽2格，施加目标[▼移动2]，持续1回合。", "怒意": "[怒意]每层攻击提高3%，不可驱散，无法免疫，最多叠加5层。", "怒意爆发3": "[怒意爆发3]增益，将70%魔攻值附加在物攻上，获得[穿甲]。", "怒意爆发2": "[怒意爆发2]增益，将70%魔攻值附加在物攻上。", "怒意爆发1": "[怒意爆发1]增益，将40%魔攻值附加在物攻上。", "命运之轮": "[命运之轮]增益，随机获得一种增益，有可能会是：造成伤害提高、受到伤害降低、对范围内敌人造成[穿透伤害]、使范围内己方回复生命值、攻防属性提高、回复能量、什么事情都没发生。\n[命运之轮]增益，造成伤害提高10%。\n[命运之轮]增益，受到伤害降低10%。\n[命运之轮]增益，行动结束后，对自身范围3格内所有敌人，造成10%物攻值加魔攻值的[穿透伤害]。\n[命运之轮]增益，行动结束后，治疗自身范围3格内所有己方，治疗量为10%物攻值加魔攻值。\n[命运之轮]增益，攻防属性提高8%。\n[命运之轮]增益，行动结束时，回复1点能量。\n[命运之轮]没有任何效果，贝拉觉得应该是哪里搞错了。", "免疫干扰": "[免疫干扰]增益，免疫行为类，干扰系列减益，包括：▼移动系列、×主动技、×被动技、×反应技、×援护、×闪避、致盲、强制直行等。", "疲惫": "[疲惫]减益，无法再次触发[个性]的[再行动]，不可驱散，无法免疫。", "帕米娜的挑战": "[帕米娜的挑战]减益，被施法者攻击时，受到伤害额外提高30%。", "名单": "[名单]减益，行动开始时，对目标施加随机2个[2级减益]，持续2回合。[名单]结束时，或被攻击后并处于[濒死]状态时，立刻被[柯瓦雷]100%魔攻值的[穿透伤害]，后移除[名单]。本效果不可驱散，无法免疫。", "免疫属性减益": "[免疫属性减益]增益，免疫属性类减益，包括：▼攻击系列、▼物防系列、▼魔防系列、▼暴击系列、▼暴伤系列、▼伤害系列、易伤系列、▼速度系列、▼受治疗、×受治疗、×治疗、×属性增益等减益效果。", "免疫燃烧地块": "[免疫燃烧地块]增益，免疫[灼烧]及[燃烧]地形。", "冥想": "[冥想]增益，行动开始时，恢复1点能量。", "魔法护盾": "[魔法护盾]护盾，可以额外抵挡魔法伤害。", "免疫控制": "[免疫控制]增益，免疫控制类减益，包括定身类、干扰类减益，具体为：×主动技、×被动技、×反应技、×闪避、致盲、强制直行、晕眩、睡眠、冰封、▼移动、击退、打断。", "魔力充沛": "[魔力充沛]增益，伤害提高20%，技能最大射程增加1格。释放[职业技能]时，回复2点能量，消耗1层。本效果最多叠加2层，不可驱散，无法免疫。", "免疫禁疗": "[免疫禁疗]增益，免疫[×受治疗]。", "偏斜": "[偏斜]增益，受到下一次非持续伤害时，受到伤害或穿透伤害降低50%，生效后移除。", "蔑视": "[蔑视]增益，对拥有[威压]的目标伤害提高10%，若其拥有6层[威压]，伤害提高至30%；✦被拥有6层[威压]的敌人攻击后，若处于[受伤]状态，则回复35%生命值，每回合最多触发1次。✦本效果不可驱散，无法免疫。", "明誓同征": "[明誓同征]自身回复物攻值50%的生命值，驱散1个[减益]，并对自身范围3格内最近3名敌人，造成40%物理范围伤害。", "命运•注视": "[命运•注视]被[沙娜姿]标记。场上同时只会存在1此标记。✦若持有者免疫击退、传送则受到的[晶能引力]不会被移除，且行动结束时使[沙娜姿]触发[晶能引力]效果。\n}}", "命运•转动": "[命运•转动]（抉择）选择使用[宿命指定]、[因果牵引]、[悖律拒斥]或[故事反转]。✦抉择技能释放后，对拥有[命运•注视]的目标触发[晶能星爆]，造成一半伤害。✦处于[原初之力]期间，每回合首次释放抉择技能后获得[再攻击]，继承剩余移动力。✦每个抉择技能每回合最多释放1次。\n}}", "碰撞易伤1": "[碰撞易伤1]受到碰撞伤害提高10%。", "碰撞易伤2": "[碰撞易伤2]受到碰撞伤害提高20%。", "命运之扼1": "[命运之扼1]被效果施加者攻击时，受到伤害提高10%，受到暴击概率提高10%。", "命运之扼2": "[命运之扼2]被效果施加者攻击时，受到伤害提高15%，受到暴击概率提高15%。", "命运之扼3": "[命运之扼3]被效果施加者攻击时，受到伤害提高20%，受到暴击概率提高20%。", "抹煞": "[抹煞]触发时，受到[×不屈]并立即击败。", "魔法增幅": "[魔法增幅]部分技能更换为变成[魔法强化]效果，[魔法强化]技能无能量消耗无冷却，使用后全部技能变回原技能。", "魔力枯竭": "[魔力枯竭]无法使用技能[魔力充盈];释放非[瞬发]技能后或待机时，移除1层。", "魔力充盈": "[魔力充盈]（支援）[瞬发]，没有[魔力枯竭]时可释放，使用后获得[魔法增幅]，持续1回合。", "魔法强化": "[魔法强化]魔法强化类技能。", "破冰1": "[破冰1]每层物攻提高1.6%，可叠加10层。每层持续时间独立。", "免疫行为异常": "[免疫行为异常]增益，免疫控制类减益，包括定身类、干扰类减益，具体为：×主动技、×被动技、×反应技、×闪避、致盲、强制直行、晕眩、睡眠、冰封、▼移动、击退、打断。", "冥炎之径": "[冥炎之径]停留时，即刻被击败。无法覆盖和移除。", "能量倾泻": "[能量倾泻]当前有多少✦，此技能就需要消耗多少✦。", "能量回涌": "[能量回涌]✦主动使用技能后，将本状态层数转化为能量补充自身，直至补满所有能量。✦若行动结束时，自身能量已满（且没有[×回能]），则本状态自动增加1层。", "能耗调和2": "[能耗调和2]主动使用基础能量消耗大于等于4的技能时，所需消耗能量减少4。效果触发后移除。", "能耗调和1": "[能耗调和1]主动使用基础能量消耗大于等于4的技能时，所需消耗能量减少3。效果触发后移除。", "命运刻度": "[命运刻度]✦指向1~12中的具体刻度。✦每当推移过第12刻度，达到新的1圈时，技能[召唤·虚空投影]的可用次数加1。", "匿影独行": "[匿影独行]✦若处于[烟雾]地形格：行动结束时，回复自身物攻值40%的生命值。攻击时，伤害、穿透伤害提高15%。✦若攻击时，自身范围2格不存在友军，也同样获得处于[烟雾]地形格时的伤害加成。", "目眩": "[目眩]减益，所属控制-干扰类，范围伤害降低50%。", "明察": "[明察]每层使物攻提高1%，最多提高10%。", "逆神者": "[逆神者]✦[虔诚值]增减时，所增减的值转为同等层数的[无惧神明之心]；✦获得[无惧神明之心]时，使自身最终伤害提高25%，最终受到伤害降低25%，效果持续到下次行动开始。", "拟态": "[拟态]✦ 行动开始时，根据场上[虔诚值]绝对值最高的角色，将自身[虔诚值]变更为该绝对值的负数。✦ 反转[虔诚值]对自身产生的正负效果。", "能量反噬": "[能量反噬]所属生命流失类。释放技能后，损失施法者攻击总值15%×（自身所缺能量+1）的生命值，自身所缺能量最多计算为3。", "能量阻滞1": "[能量阻滞1]所属干扰类，所有主动释放的技能，能量消耗增加1点。", "能量流失1": "[能量流失1]行动开始时，损失1点能量。", "曲射": "[曲射]指轨迹为弯曲的射击，避开部分障碍影响。", "破盾1": "[破盾1]增益，无视目标格挡，攻击拥有[护盾]的敌人时，攻击力提高15%。", "破盾2": "[破盾2]增益，无视目标格挡，攻击拥有[护盾]的敌人时，攻击力提高30%。", "潜能激发": "[潜能激发]增益，攻击提高20%，防御提高40%，获得[×属性减益]。", "强韧": "[强韧]技能，不会受到[受伤]、[濒死]状态的效果影响。", "启示": "[启示]受到了启示，不可驱散，无法免疫，最多叠加15层。", "强力盾牌充能": "[强力盾牌充能]增益，[格挡]概率提高至100%，[格挡]时，受到伤害额外降低15%，移除1层，最多叠加2层。", "破盾3": "[破盾3]增益，无视目标格挡，攻击拥有[护盾]的敌人时，攻击力提高45%。", "破盾4": "[破盾4]增益，无视目标格挡，攻击拥有[护盾]的敌人时，攻击力提高60%。", "强袭指令": "[强袭指令]主动单体攻击时，自身以[普攻]再进行1次[援护攻击]，可造成100%伤害，每回合最多发动1次。", "强力不屈": "[强力不屈]增益，被击败时，可重新投入战斗，回复30%生命值，可生效1次，不可驱散。", "旗帜": "[旗帜]物品，场上所有己方，攻防属性提高15%，旗帜一定时间后会消失。", "燃烧": "[燃烧]地形格，燃烧的地面。角色经过或停留时，被施加[灼烧]，持续2回合。行走其中时，每格额外消耗0.5移动力。", "切磋环境": "[切磋环境]受到伤害降低30%，受到治疗效果降低20%，防御、生命值提高20%。", "强制警戒": "[强制警戒]状态，指敌方在警戒范围内释放技能时，会触发[警戒]。", "强力回击": "【强力回击】增益，被[正、侧方]敌人主动攻击时，若对方在攻击范围内，则用普攻进行[反击]，造成100%伤害，每回合生效1次。", "入梦": "[入梦]\n自身获得[冥想]，持续2回合。", "森西的满足": "增益，主动攻击敌人时，每层使伤害提高30%，可叠加6层，攻击后移除全部层数，不可驱散，无法免疫。", "潜能激发·咒": "[潜能激发·咒]增益，攻击提高20%，防御提高40%，受治效果提高30%，拥有本效果时免疫[潜能激发]。", "如影随形": "[如影随形]光环效果，拥有的[黑羽]效果不会被消耗。", "全局援护2": "[全局援护2]增益，替自身范围2格内所有友军承受所有单体伤害。", "强击姿态": "【强击姿态】免疫打断，无法移动；攻击、暴击率、暴击伤害提高15%", "枪影": "[枪影]互动物、己方停留时，可获得[▲暴击2]、[▲移动1]，持续2回合；✦敌方停留时，受到[魔防3]，持续2回合。✦任意角色停留时，[伦伽勒·传承之枪]立即触发1次[明誓同征]。", "沙尘": "[沙尘]减益，所属控制-干扰类，禁释放单体伤害技能，不可驱散。✦无法对可以免疫[致盲]的角色起效。", "骑士战旗": "[骑士战旗]5格内的己方，攻防属性提高10%，军旗一定时间后消失。✦被已方攻击时立刻消失，并将光环效果转移至攻击者身上，持续2回合。", "普通光环": "[普通光环]通常由被动/个性提供，是非领袖光环的光环；同时拥有多个光环时，单种属性的提升取最高值。", "杀机": "[杀机]标记，达到2层时，可使用[个性]技能，最多叠加2层。", "认真找找": "[认真找找]瞬发，按照顺序获得并触发下列[超级晶石技能]的效果：✦[高能火晶石]，强制选中自身范围3格内最近敌人，造成其及范围1格内所有敌人80%[火属性]魔法范围伤害，并击退2格。✦[急冻冰晶石]，强制选中自身范围3格内最近敌人，造成80%魔法伤害，施加[冰封]，持续1回合。✦[治愈光晶石]，治疗自身范围3格内所有己方，治疗量为魔攻值的70%。✦[要爆炸啦]，对自身范围3格内所有敌人，造成50%魔法范围伤害。", "人造原初烙痕": "[人造原初烙痕]计量槽，用于[原初之力]的消耗。✦战斗开始时，拥有10点，最多50点。✦行动开始时，会消耗自身所有能量和超过5层的[解放]层数，并转化为等量点数。", "千军围灭": "[千军围灭]（支援）将场上所有[帝国不朽军]获得10层[战争杀器]，并对其进行攻击，使其触发[不朽战骸]并随后[消亡]。", "虔诚祈祷": "[虔诚祈祷]光环，增益，使自身范围3格内所有友军，受到治疗效果提高30%", "染血的黄昏1": "[染血的黄昏1]造成伤害提高1%，至多叠加32层。", "染血的黄昏2": "[染血的黄昏2]造成伤害提高2%，至多叠加22层。", "破冰3": "[破冰3]每层物攻提高3.2%，可叠加10层。每层持续时间独立。", "破冰2": "[破冰2]每层物攻提高2.4%，可叠加10层。每层持续时间独立。", "破晓之势": "[破晓之势]每层使攻击提高2%，造成伤害提高1%，受到伤害降低1%，最大叠加25层。", "破晓孤王": "[破晓孤王]攻击提高80%，造成伤害提高40%，受到伤害降低60%。", "群狮之猎": "[群狮之猎]被攻击后，施加者会以[普攻]进行[援护攻击]，最大距离为2格，每回合最多触发2次。", "侵蚀": "【侵蚀】对某区域内地形格进行[侵蚀]，使得敌人在该区域每途经该1格、或停留时，释放相应技能。", "潜袭形态": "[潜袭形态]✦[专属技能]造成的伤害变为穿透伤害，对应伤害倍率降低至原技能的50%。✦暴击率、暴击伤害的30%附加在穿透伤害上，本效果最多提高80%穿透伤害。✦单体攻击前，对目标额外施加[穿透易伤3]，持续2回合。", "虔诚值": "[虔诚值]✦法皇国以[虔诚值]支配民心。✦通常情况下，[虔诚值]为正时，得到教廷的[虔诚祝福]（小幅提高最终伤害、免伤）；✦而[虔诚值]为负时，受到教廷的[虔诚惩罚]（小幅降低最终伤害、免伤）。", "虔诚惩罚": "[虔诚惩罚]✦每点虔诚值：最终伤害降低0.1%，最终受到伤害提高0.1%，效果最多5%。✦[虔诚值]≤-50点时：最终伤害额外降低5%，最终受到伤害额外提高5%。", "虔诚祝福": "[虔诚祝福]✦每点虔诚值：最终伤害提高0.1%，最终受到伤害降低0.1%，效果最多5%。✦[虔诚值]≥50点时：最终伤害额外提高5%，最终受到伤害额外降低5%。", "虔诚值加成•狄奥娜": "[虔诚值加成]源自内心的力量，拥有者将根据虔诚值获得不同效果：✦[虔诚值]>0时，受到伤害降低30%。✦每点[虔诚值]额外效果：最终伤害提高1%，最多提高15%；最终受到伤害降低1%，最多降低15%。", "群星护阵": "[群星护阵]触发[先制]时，进行2次攻击，且受到伤害降低50%。", "全局援护3": "[全局援护3]增益，替自身范围3格内所有友军承受所有单体伤害。", "虔诚值加成•sp卡丽丝": "[虔诚值加成]源自内心的力量，拥有者将根据虔诚值获得不同效果。✦每点[虔诚值]额外效果：最终伤害提高1%，最多提高15%；最终受到伤害降低1%，最多降低15%。", "强化审判": "[强化审判]同属为塔罗之语[审判者的救赎]减益，受到伤害提高20%，不可免疫。", "杀气": "[杀气]可提高部分技能的效果。“以血凝枪，誓诛罪孽！”", "全域闪避": "[全域闪避]增益/行为，闪避敌人一次任意攻击。", "闪避": "[闪避]增益，闪避敌人一次直接单体攻击。", "圣枪技•扬旗": "[圣枪技•扬旗]技能，[瞬发]，使自身范围3格内所有友军，获得[▲移动1]，持续2回合，自身获得[扬旗]光环。", "生命汲取": "[生命汲取]增益，指把本次对敌人造成伤害的一定百分比，化为自己生命值的补充。", "生命流失": "[生命流失]减益，每次行动结束时，损失一定的生命值。", "伤害反射2": "[伤害反射2]增益，将受到的30%伤害，反弹给攻击者。", "伤害反弹2": "[伤害反弹2]增益，将受到的30%伤害，反弹给攻击者。", "伤口": "[伤口]减益，受到非百分比[穿透伤害]额外提高12%，受到治疗降低30%，最多叠加4层，不可驱散。", "审判": "[审判]所属塔罗之语[审判者的救赎]：减益，受到伤害提高10%，不可免疫。", "生命流失2": "[生命流失2]减益，行动结束时，损失10%生命值。", "圣枪技•突": "[圣枪技•突]技能，选择自身十字范围内1名敌人，冲锋到其身边并造成120%物理伤害，击退2格。", "圣枪•朗基努斯": "[圣枪•朗基努斯]技能，对目标[空地]范围2格内所有敌人，造成80%物理范围伤害，召唤[旗帜]，但自身失去[扬旗]光环。", "盛绽": "[盛绽]技能，对目标范围3格内所有敌人造成120%伤害，若敌人处于[花田]，则额外对其造成伤害提高20%。", "生机眷恋1": "【生机眷恋1】增益，1级效果，攻击提高20%。", "生机眷恋2": "【生机眷恋2】增益，2级效果，攻击提高30%。", "誓约": "【誓约】基础效果，伤害提高10%、受到伤害降低10%（基础效果，突破至3星时变为进阶效果）。[爱莎]在场时，自身收到致命伤害时触发[不屈]，可回复5%生命值，随后[爱莎]与自身交换位置，双方回复50%，每场战斗最多1次。本效果不可驱散。", "伤害锁定": "[伤害锁定]增益，受到单次攻击造成的伤害不超过自身一定最大生命值，效果触发后移除1层。", "圣启": "[圣启]部分技能可产生额外效果，且在产生额外效果时附加30%魔攻值的治疗。", "神罚": "[神罚]对自身范围5格内的所有敌人造成70%魔法[范围伤害]，并施加[致盲]，持续1回合。", "圣迹": "[圣迹]技能，每场战斗最多使用1次。基础效果:准备1回合，使自身范围5格内所有己方，驱散所有[减益]，再回复100%生命值，并获得所有[2级增益]，持续2回合。准备时立刻释放1次本技能效果，但治疗量与[增益]持续时间减少一半;并获得[祷求圣启]，效果持续至下次行动开始。", "审判烙印": "[审判烙印]减益，受到伤害提高10%，受到[范围伤害]额外提高5%，不可驱散，无法免疫。", "视同于血羽之刃触发": "[视同于血羽之刃触发]✦可触发[血羽之刃]正常触发时所有非伤害效果。✦如施加[黑羽]、[冻伤]，自身获得[偏斜]等。", "视同于血羽之刃": "[视同于血羽之刃触发]检测指定范围内是否存在[血羽之刃]时，若存在拥有[偏斜]的己方，则满足条件。", "伤害缓冲模块": "[伤害缓冲模块]计量槽，最大缓冲值等同于最大生命值。✦自身受到所有致使生命减少效果中的一定百分比(即缓冲比例，基础为40%)，转移为缓冲值；✦缓冲值达到最大缓冲值时，超出部分伤害仍将全额生效。", "噬体谐振": "[噬体谐振]下一次触发警戒攻击时，不消耗警戒次数，不可叠加。", "赦心": "[赦心][瞬发]，消耗10层[帝血之力]，使场上所有〈埃拉曼〉已方获得10层[解放]。", "沙属性": "[沙属性]会使得[土地]、[沙地]、[荒地]、[流沙]地块产生[沙尘]效果。", "失焦": "[失焦]敌人会优先攻击其技能范围内的其他目标，而非拥有者。", "伤痕撕裂": "[伤痕撕裂]减益，行动开始时，损失施法者一定百分比物攻值的生命值。", "舍身守护": "[舍身守护]✦替自身范围3格内所有友军承受所有单体伤害。✦使用[立盾·固战御敌]时，自身额外获得3层[满满安全感护盾]。", "圣剑术": "[圣剑术]使用本技能后，触发[连招蓄势]，效果：准备1回合，触发相同技能效果（无任何消耗）", "圣剑共鸣": "[圣剑共鸣]✦最多可叠加8层。✦达到5层时，跳过[连招蓄势]的准备阶段，生效后移除5层。", "闪现": "[闪现]（支援）自身传送至3格内任意地形格，可[再攻击]并以剩余移动力再移动。使用技能后，受到[敛翼调息]，持续4回合。", "失衡": "[失衡]减益，所属控制-定身类，行动开始时陷入1回合【晕眩】。", "闪电球": "[闪电球]（魔法伤害）单体攻击，造成170%魔法伤害。", "生命阈值": "[生命阈值]受到任意伤害都无法使生命值低于阈值，除非效果失效。", "狮血": "[狮血]计量槽，用于某些技能及维持[金狮形态]的消耗。✦最多叠加20点。", "失温": "[失温]造成伤害降低15%；若目标处于[冰冻]地形格时，攻击前，造成伤害额外降低10%。", "湿冷": "[湿冷]攻击前，若目标免疫[冰柩]，则技能倍率提高40%。", "施法锚点": "[施法锚点]以指定目标而非自身作为起点，检索射程内合适对象作为目标。", "时空漫游": "[时空漫游]可在符合条件及存在合适的[虚空造物]时释放以下技能：✦[虚空穿梭]：未使用主动技能并执行[待机]，且不处于[锁定]状态；✦[时间回溯]：以非[待机]的方式结束行动，且不处于[锁定]状态。✦上述技能可用时，视为特殊[再行动]。", "时间回溯": "[时间回溯]（支援）需选择没有[归于虚空]的[虚空投影]释放，并使其受到[归于虚空]。随后使自身位置、生命值、能量值及技能冷却时间复原至行动开始时。✦释放技能后，受到[时间回溯·锁定]，及获得[潜能激发]和1层最大生命值50%的[伤害锁定]，所有效果持续2回合。✦[菲娜塔]自身释放时，额外获得[再行动]，并回复1点能量。", "时空置换": "[时空置换]（支援）[瞬发]，选择任一[虚空投影]范围4格内的非[虚空投影]的角色（敌我均可），使其与其最近的[虚空投影]交换位置。", "时空跳跃": "[时空跳跃]（支援）[瞬发]，选择一个[虚空投影]，传送至其范围4格内任意[空地]；且会携带其范围1格内所有敌人一同传送。", "时间回溯•锁定": "[时间回溯•锁定]期间不可触发[时间回溯]。", "圣光普照": "[圣光普照]光环，使场上所有阵营的己方：✦对其他目标释放单体[支援]、[减益]或[治疗]技能后，施法者自身获得[圣光之力]，效果：攻击提高10%，持续3回合。✦[克莱雅]自身只需触发该类技能即可获得[圣光之力]。", "圣光普照2": "[圣光普照2]光环，使场上所有阵营的己方：✦对其他目标释放单体[支援]、[减益]或[治疗]技能后，施法者自身获得[圣光之力2]，效果：攻击提高20%，持续3回合。✦[克莱雅]自身只需触发该类技能即可获得[圣光之力2]。", "圣光之力2": "[圣光之力2]2级效果，攻击提高20%。", "圣光之力": "[圣光之力]1级效果，攻击提高10%。", "十字锋芒": "[十字锋芒]同时拥有[剑痕•升芒]和[剑痕•坠芒]。", "蛇影迷踪": "[蛇影迷踪]所属隐身类。✦ 无法被敌人技能选中，但可被[范围伤害]、[环境伤害]波及，可被[强制选中]。主动攻击后移除。✦ 本效果重复获得时，改为持续回合叠加。", "瞬发": "[瞬发]指使用本技能后，角色还可以继续行动，继承剩余移动力。", "跳跃": "[跳跃]增益，跳跃力提高3倍，可以跳跃沟壑。", "睡眠": "[睡眠]减益，属于定身类，无法做出任何行动，受到任何攻击伤害解除。", "属性增益": "[属性增益]增益，属性增益，包括：[▲攻击]系列、[▲伤害]系列、[▲暴击]系列、[▲暴伤]系列、[▲物防]系列、[▲魔防]系列、[免伤]系列等属性增益。", "兽化": "[兽化]状态，攻击、物防提高20%，魔防降低50%，不可驱散，无法免疫。", "守护": "[守护]替自身范围2格内所有友军承受[物理攻击]。发动时，防御提高20%。", "书卷": "[书卷]互动物，塔埃尔停留时，获得1层[知识]。其他角色停留时，会让书卷损坏。", "同舟": "[同舟]增益，进行[反击]、[警戒]或[先制]后，对目标施加[×被动技]和[▼攻击2],持续1回合。", "受治疗逆转": "[受治疗逆转]减益，使携带者被治疗时，治疗效果转变为一定量的伤害。", "属性减益": "[属性减益]属性类减益，包括：▼攻击系列、▼物防系列、▼魔防系列、▼暴击系列、▼暴伤系列、▼伤害系列、易伤系列、▼速度系列、▼受治疗、×受治疗、×治疗、×属性增益等减益效果。", "跳过回合": "[跳过回合]减益，属于定身类，在本战斗回合中无法做出任何行动。", "死亡宣告": "[死亡宣告]拥有时，[个性]中可施加[黑羽]的敌人数量翻倍。主动[普攻]后，额外对[普攻]射程内最远的2个拥有[黑羽]的目标进行[普攻]，其技能倍率降低至10%。", "曙月银辉1": "防御提高15%，不可驱散，无法免疫。", "曙月银辉2": "防御提高25%，不可驱散，无法免疫。", "守护之力": "[守护之力]包含：[守护之力·基础]、[守护之力·强化]、[守护之力·基础2]、[守护之力·强化2]。", "守护之力·基础": "[守护之力·基础]护盾，获得施法者魔攻值25%的[物理护盾]，不可驱散。", "守护之力·强化": "[守护之力·强化]护盾，获得施法者魔攻值35%的[物理护盾]，不可驱散。", "守护之力·强化2": "[守护之力·强化2]护盾，获得施法者魔攻值60%的[物理护盾]。且拥有任意[守护之力]时，受到伤害降低15%，不可叠加。本护盾不可驱散。", "守护之力·基础2": "[守护之力·基础2]护盾，获得施法者魔攻值40%的[物理护盾]。且拥有任意[守护之力]时，受到伤害降低15%，不可叠加。本护盾不可驱散。", "戍卫箭幕": "【戍卫箭幕】✦[法卡尔·卫国之箭]将对[戍卫箭幕]效果拥有者范围4格，进行[警戒]，可造成70%物理伤害，每回合可发动3次。✦[法卡尔·卫国之箭]的[协同响应]，将以[戍卫箭幕]效果拥有者为中心被触发。", "挑战者": "[挑战者]这个角色已经被[沙姆斯]盯上了!", "完美工艺1": "[完美工艺1]攻击提高8%，受到伤害降低6%。", "完美工艺2": "[完美工艺2]攻击提高12%，受到伤害降低9%。", "完美工艺3": "[完美工艺3]攻击提高16%，受到伤害降低12%。", "受治疗逆转2": "[受治疗逆转2]受到的所有治疗转化为100%对应治疗量的[穿透伤害]。", "随便找找": "[随便找找]（支援）[瞬发]，随机获得1个[晶石技能]，技能保留2回合。", "宿命指定": "[宿命指定]（支援）选择目标，使[命运•注视]状态转移至该目标。\n}}", "瞬光斩黯黮": "[瞬光斩黯黮]（物理伤害）对自身范围4格内最近的3个敌人造成[范围伤害]，命中1名敌人倍率为120%，每额外命中1名时技能倍率降低20%，最低40%。✦攻击受到[定身]目标时，攻击提高80%。", "天籁之音": "[天籁之音]使范围5格内所有己方，获得[再生2]、[免疫属性减益]，对范围3格内所有敌人，施加[×主动技]。持续2回合，不可驱散，无法免疫。", "守护失效": "[守护失效][自然守护]效果失效，且受到含有[无视守护]的技能攻击时，最终受到伤害提高30%。", "碎冰": "[碎冰]触发物，停留时，可获得额外技能[碎冰飞刃]，可使用1次。使用次数可叠加。", "撕裂": "[撕裂]减益，受到物防降低20%，施加5%[生命流失]。", "衰弱": "[衰弱]所属控制-干扰类。✦伤害降低10%。✦拥有10层并行动结束时，自身失去1000%生命值。", "霜冻": "[霜冻]✦防御降低10%。✦拥有3层时，消耗所有层数，并受到1回合[冰柩]，持续1回合。", "狩猎对象": "[狩猎对象]会成为金狮部落重点攻击目标", "霜之铠": "[霜之铠]✦拥有施法者魔攻值40%的[物理护盾], 免疫[冰冻]地形格效果。✦被[近战]攻击后, 施加对方[▼移动1], 持续2回合。", "体力不支": "[体力不支]无法唤醒血脉。", "苔原蜜果": "[苔原蜜果]触发物，己方停留时，[乌莉娅]对其进行治疗，治疗量为物攻值的60%，并使其获得随机1个[2级增益]、1层[回味甘甜]，持续2回合。", "糖分超标": "[糖分超标]暴击率提高10%，最多叠加3层。", "碎冰飞刃装填": "[碎冰飞刃装填]释放[碎冰飞刃]时，造成穿透伤害提高10%，并消耗所有剩余使用次数，提高对应次数的伤害倍率。", "霜烬": "[霜烬]每层效果：受到伤害后，若生命值低于5%，则触发[抹煞]。被击败时，原地生成[冰墙]。✦可叠加10层，叠加时使触发[抹煞]的生命值百分比增加；✦会被目标的[百分比免伤]减免。", "霜骸": "【霜骸】✦途经地形格变为[冰冻]，持续2回合。\n✦效果结束或期间被击败时，[伊凡]对本目标自身范围3格内最近的3个名敌人触发1次[冰原之心•神裁]。", "守誓不屈": "[守誓不屈]被击败时，可重新投入战斗，触发后回复100%生命值，并对自身范围3格内所有敌人造成50%物攻值的[穿透伤害]，施加[▼攻击3]，持续1回合。效果每场战斗最多触发1次。", "锁链": "[锁链]✦分摊塞娜50%所承受伤害（每次分摊量不超过[塞娜]70%最大生命值）。✦同一方只存在1个拥有者（新施加的拥有者会取代旧拥有者）；拥有者被击败时，[锁链]转移至自身范围4格内最近友军。", "霜佑之印": "[霜佑之印]✦受到[伤害]、[穿透伤害]降低40%，触发后移除本效果。✦移除本效果时，受到[珀列维特]治疗，治疗量为其魔攻值的40%。✦同时拥有[▼速度4]减益效果。", "万灵契约3": "[万灵契约3]自身范围3格内存在3名及以上友军时：伤害、穿透伤害提高12%；受到伤害、受到穿透伤害降低12%。", "万灵契约2": "[万灵契约2]自身范围3格内存在3名及以上友军时：伤害、穿透伤害提高8%；受到伤害、受到穿透伤害降低8%。", "万灵契约1": "[万灵契约1]自身范围3格内存在3名及以上友军时：伤害、穿透伤害提高4%；受到伤害、受到穿透伤害降低4%。", "特定防御类增益": "[特定防御类增益]包括各级防御增益，如[▲物防]系列、[▲魔防]系列、[免伤]系列；另外包括[防御加护]、[不屈之枪]。", "物理伤害": "[物理伤害]指使用物理攻击造成的伤害。", "心眼": "[心眼]增益，被[背击]时，立刻转向[格挡]。", "先制": "[先制]被敌人主动攻击前，先触发某些效果或攻击。", "微醺": "[微醺]增益，暴击率提高30%，受到伤害降低10%，可叠加。", "协攻": "[协攻]增益，自身范围2格每存在1个友军，攻击提高5%，最多15%。", "协防": "[协防]增益，自身范围2格每存在1个友军，防御提高10%，最多40%。", "形骸": "[形骸]被击败后形成的特殊状态，若一定时间内没被再次击败，则角色可以重新投入战斗。", "物理护盾": "[物理护盾]护盾，可以额外抵挡物理伤害。", "无视闪避": "[无视闪避]增益，无视目标的[闪避]状态。", "无视援护": "[无视援护]增益，攻击时，无视敌人[援护]类型技能。", "无伤": "[无伤]状态，生命值等于100%时的状态。", "幸福感": "[幸福感]增益，所有技能：消耗能量减少1点，使用后可产生冷却减1回合，执行任何行动后移除。", "消亡": "[消亡]行为，指被击败，会触发被击败时的各种效果。", "陷阵": "[陷阵]增益，受到伤害、穿透伤害降低30%；拥有[不屈]，可抵消一次[致命伤害]。本效果不可驱散。", "无限不屈": "[无限不屈]增益，被击败时，重新加入战斗，回复一定生命值，无限生效。", "夏铃草": "[夏铃草]召唤角色，拥有[治疗之光]，且可使自身范围3格内的友军行动结束时，回复60%生命值，再驱散3个[减益]，并使其地形格变为[花田]，持续2回合。", "无影之刃": "[无影之刃]增益，闪避敌人单体攻击，并进行[反击]，对范围内敌人造成85%[物理范围伤害]。施加[易伤2]，持续2回合，自身回复2点能量。", "小鹿": "[小鹿]\n✦个性额外增加：不可移动，受到伤害降低30%，下2次行动开始时变回[阿芙拉]状态。行动结束时，治疗自身范围3格内所有友军，治疗量为魔攻值的60%。\n✦[阿芙拉]状态的技能失效，拥有[鹿鸣]、[鹿灵之光]、[梦语苏生·鹿眠]、[踏雪·鹿影]及[小鹿醒醒]等技能。", "维持": "[维持]维持类技能✦开启后，行动开始时，扣除其维持所需的消耗，不满足时强制取消维持。✦技能释放后，变更为[取消（对应技能）]。", "小心点哦": "[小心点哦]包含：增益，受到伤害后，自身回复生命值，治疗量为施法者魔攻值的30%，触发后移除本效果。", "王女亲卫": "[王女亲卫]防御者，被召唤的召唤角色，拥有可援护防御的技能。", "消停": "[消停]期间无法获得[炸毛]，不可驱散，无法免疫。效果持续2回合，若在[额外行动]期间获得本效果，则持续时间减少1回合。", "鲜血咒铠": "[鲜血咒铠]减益，所属控制-干扰类，每层攻防属性降低一定百分比，最多3层。", "无尽罗网": "[无尽罗网]光环，使场上所有己方攻击前,若拥有[偏斜]或目标拥有[黑羽]，则伤害、穿透伤害、持续伤害效果提高15%，并可产生30%[生命汲取]，以上效果持续至下次行动开始前。✦额外使所有已方获得[无尽罗网·寒霜]，效果:攻击后，若拥有30%及以上生命值的[物理护盾]，则施加1个[次级冻伤]，持续1回合，对每个敌人每回合限1次。", "物品": "[物品]指在战场上摆放的物品，可能只是装饰，或者有特别效果。", "协同响应": "[协同响应]当其他友军主动释放拥有[协同号令]标签的技能时，触发自身技能的[协同响应]效果。", "协战蓄力中": "[协战蓄力中]每层使自身最大生命值的0.2%(随星级变化)附加在物攻上，至多叠加100层。", "协同号令": "[协同号令]主动释放拥有[协同号令]标签的技能时，触发场上所有友军的[协同响应]效果。", "威压": "[威压]减益，攻击[卡姆洛特]时自身攻击降低，被[卡姆洛特]攻击时自身防御降低，降低值为[卡姆洛特]最大生命值的1%，最多叠加6层。✦攻击〈骑士同盟〉角色和被其攻击时，降低属性值为[卡姆洛特]最大生命值的0.5%。✦本效果不可驱散，无法免疫。", "心魇缠绕": "[心魇缠绕]增益，伤害提高20%；受到伤害后，若处于[受伤]状态，则回复自身物攻值加魔攻值60%的生命值，每回合最多触发1次。不可驱散，无法免疫。", "完美工艺4": "[完美工艺4]攻击提高20%，受到伤害降低15%。", "无法治疗": "[无法治疗]指受治疗逆转系列、[×受治疗]、[▼受治疗]系列等。", "稳固": "[稳固]免疫来自敌方的击退。", "新星": "[新星]（物理伤害）对自身范围3格内所有敌人造成70%[范围伤害]，并对相邻目标击退2格。✦攻击受到[定身]目标时，本技能造成2倍伤害和击退效果。✦若行动开始时处于[敛翼调息]，则本回合内本技能攻击时，视为目标受到[定身]。", "无视守护": "[无视守护]可无视[自然守护]所产生的效果。", "夏铃草的滋养": "[夏铃草的滋养]（光环）自身范围3格内的友军行动结束时，回复60%生命值，再驱散3个[减益]，并使其地形格变为[花田]，持续2回合。", "武技": "[武技]✦技能标签，会受到某些效果影响。✦释放任意可变更状态的[武技]技能后，所有[武技]技能都会同时变更状态。", "无视守护•寒境": "【无视守护•寒境】✦可无视[自然守护]所产生的效果。✦造成最终伤害提高10%。", "万丈寒渊": "[万丈寒渊][冰原之心•神裁]触发时，伤害翻倍。", "香料": "[香料]弥漫在空气中。角色停留时，必定能[闪避]远程单体攻击。香料受到[范围伤害]时，被破坏并造成60%生命值的伤害。", "威慑": "[威慑]每层使造成穿透伤害提高10%，最终受到伤害降低10%，最多可叠加3层。", "小力": "[小力]拥有[失焦]，可翻越敌人、友军、中立角色、物品。受到伤害降低50%。拥有击退能力和瞬移能力。", "小咻来助力！5": "[小咻来助力！5]范围攻击时，魔攻提高12%。", "小咻来助力！4": "[小咻来助力！4]范围攻击时，魔攻提高10%。", "小咻来助力！3": "[小咻来助力！3]范围攻击时，魔攻提高8%。", "小咻来助力！2": "[小咻来助力！2]范围攻击时，魔攻提高6%。", "小咻来助力！1": "[小咻来助力！1]范围攻击时，魔攻提高4%。", "无视反应": "[无视反应]攻击时，无视目标的[反应技]。", "无惧神明之心": "[无惧神明之心]行动结束时消耗10的倍数层数，每消耗10层使[质疑之种]的警戒次数额外加1（持续1回合），本效果最多可叠加40层。", "万千祈愿之光": "[万千祈愿之光]计量槽，即[万千祈愿之光]点数，上限为100点。✦行动开始时，根据所有己方拥有[虔诚祝福]总数的25%，获得对应点数，至少获得25点。", "易容": "[易容]增益，受到伤害降低30%，移动力增加2。", "扬旗光环": "[扬旗光环]光环，使一定范围的其他友军，攻防属性提高12%，不可驱散，无法免疫。", "易伤2": "[易伤2]减益，受到伤害提高20%。", "移形换影": "[移形换影]增益，[背击]时，必定暴击。", "易伤3": "[易伤3]减益，受到伤害提高30%。", "野兽狂热": "[野兽狂热]增益，暴击率、生命汲取提升15%，可叠加5次。", "易伤1": "[易伤1]减益，受到伤害提高10%。", "蓄能": "[蓄能]增益，攻击距离增加1格，攻击前，获得[穿透]。", "扬旗": "[扬旗]光环，自身范围3格内所有友军，攻防属性提高12%，不可驱散，无法免疫。", "旋转加速": "[旋转加速]增益，每层攻防属性提高4%。", "移动姿态": "[移动姿态]技能，移除自身[狙击姿态]，获得[▲速度2]，可再移动。", "旋转重剑": "[旋转重剑]技能，对目标方向3×2区域内所有敌人，造成85%伤害，施加[▼物防2]，持续2回合。技能变更为[重剑斩杀]，技能保留2回合。", "喧闹": "[喧闹]增益，闪避首次单体攻击，每回合最多生效1次。", "血夜之约": "[血夜之约]减益，速度降低150点，造成伤害降低20%。行动结束或被击败时，奇亚重新回到场上。本效果不可驱散，无法免疫。", "严肃点！": "[严肃点！]增益，下次攻击暴击率提高100%，暴击伤害提高30%，触发后移除，不可驱散，无法免疫。", "以血浇灌": "以血浇灌技能，[瞬发]，拥有2层及以上[咒痕]时可使用。释放时获得与自身[减益]相同数量的[2级增益]，最多5个，再驱散所有[减益];若没有[减益]，则获得[▲伤害2]，持续3回合。再获得[咒铠·裁罚]，持续3回合，最后回复自身所有生命值。", "以血浇灌·终焉": "[以血浇灌·终焉]增益，获得本效果时，立刻触发技能[以血浇灌]，获得[咒痕]至最多层数。✦没有[咒痕]或本效果持续时间结束后离场。✦免疫[干扰]、[定身]。✦本效果不可驱散，无法免疫。", "血羽之刃": "[血羽之刃]互动物。任意角色停留时，[伊瑟琳德]对本范围内2格所有敌人施加2回合[黑羽]、1回合[冻伤]，并造成物攻值50%的[穿透伤害]，随后[伊瑟琳德]获得[偏斜]。", "旋风斩": "[旋风斩]技能，对自身范围2格内所有非[物品]敌人，造成70%伤害。✦拥有[协同响应]，效果：触发本技能。", "蓄势待发": "[蓄势待发]下一个需[准备]技能使用时，可跳过准备阶段。", "修复如初1": "[修复如初1]✦每层受到伤害降低5%，防御提高一定值（为[叶迦内]5%的防御值），可叠加；✦受到攻击后若处于[受伤]状态，则回复施法者魔攻值30%的生命值，每回合最多触发1次；✦战斗回合开始时移除1层。", "修复如初2": "[修复如初2]✦每层受到伤害降低8%，防御提高一定值（为[叶迦内]8%的防御值），可叠加；✦受到攻击后若处于[受伤]状态，则回复施法者魔攻值30%的生命值，每回合最多触发1次；✦战斗回合开始时移除1层。", "异位重构": "[异位重构]（支援）[瞬发]，选择[空地]并标记，技能释放后[光棱晶石]传送至该地形格。✦若还剩召唤机会，[光棱晶石]被击败时，技能变更为[召唤光棱晶石]。", "遗忘症": "[遗忘症]✦变为无属性职能，受到[×主动技]，且非主动触发的效果失效。✦敌人会优先攻击其技能范围内的其他目标。\n}}", "伊格尼法印•火舞": "[伊格尼法印•火舞]（魔法伤害）[法印技能]，[瞬发]，对自身范围3格内所有敌人，造成20%[火属性]范围伤害；再使自身物理攻击时，附加20%魔法伤害，持续至行动结束。", "伊格尼法印•火流": "[伊格尼法印•火流]（魔法伤害）[法印技能]，对前方3*3范围内所有敌人，造成4次40%[火属性]范围伤害。攻击前，攻击提高40%。", "燕子": "[燕子]行动结束时，回复35%生命值。", "血脉沸腾": "[血脉沸腾]用于被[蛮熊形态]时消耗。", "溢出伤害值": "[溢出伤害值]造成伤害值大于目标当前生命值的超额部分。", "雪鹿形态": "[雪鹿形态]✦攻防属性提高10%，所有技能最大射程增加1格。✦行动结束时，若处于[冰冻]地形格，则回复1点能量。✦获得额外技能[急冻术]、[冰河世纪]。", "行走": "【行走】传送类效果，以移动的方式前往指定地点。", "野狐形态": "[野狐形态]✦进入本形态时，可[立刻行动]。✦攻防属性提高10%，最大射程增加1格。✦行动结束时，若处于[冰冻]地形格，则回复1点能量。✦造成伤害后，若目标受到6层及以上[感染]时，立刻触发[感染]伤害。✦所有[职业技能]拥有[无视守护]。", "血牙形态": "[血牙形态]✦进入本形态时，获得20%生命值的[物理护盾]和[魔法护盾]，并[立刻行动]。✦攻防属性提高25%；击退距离增加1格，造成碰撞时伤害提高20%。✦拥有[免疫干扰]、[强韧]；✦所有[职业技能]拥有[无视守护]。", "蓄势": "[蓄势]冲锋距离增加1格，击退距离增加1格，伤害提高15%，最多可以叠加2层。", "血棘之种": "[血棘之种]可叠加5层。被驱散或移除时，施法者对拥有者米字型4格内所有敌人攻击，造成每移除1层40%[穿透伤害]。触发方式：✦被施法者的其他友军主动攻击后，移除1层。✦被击败时，移除全部。", "猩红锁链": "[猩红锁链]（减益）[瞬发]，对敌人施加1层[血棘之种]、1层[流血]（持续2回合）及[锁链]。", "血之欢愉": "[血之欢愉]光环：场上所有受到[流血]或[血棘之种]的敌人，最终伤害降低10%，最终受到伤害提高10%。", "咻咻飞行": "[咻咻飞行]拥有[攀爬]、[跳跃]。无视[冰冻]地形格、[燃烧]地形格及其效果。", "幸运观众": "[幸运观众]✦行动结束时，施法者对持有者及其十字范围8格内所有敌人，造成40%魔法范围伤害；拥有[幸运观众]的目标额外获得1层[惊喜加码]（持续到下次行动开始）。✦持有者被击败时，若本回合未曾触发本效果，则立即触发。", "压迫感": "[压迫感]使目标受到伤害提高1%×[压迫感]层数，受到[非百分比]穿透伤害提高5%×[压迫感]层数，最多叠加16层。（每个角色[受到穿透伤害提高]和[受到非百分比穿透伤害提高]的总增幅值最高乘以230%）", "虚空投影": "[虚空投影]✦防御者，为被召唤角色。✦在特定情况下会受到[归于虚空]，场上最多存在3个（已受到[归于虚空]的不算在内）。", "虚空穿梭": "[虚空穿梭]（支援）[瞬发]，传送至任一[虚空投影]范围2格内的任意地形格，并可[再行动]。✦释放技能后，受到[虚空穿梭·锁定]（持续5回合）；及获得[潜能激发]和[时空漫游]，持续2回合。✦[菲娜塔]释放技能[召唤·虚空投影]后执行[待机]，可释放本技能，且受到[时间回溯·锁定]时，持续回合数改为1。", "虚空穿梭•锁定": "[虚空穿梭•锁定]期间不可触发[虚空穿梭]。", "烟雾": "[烟雾]地形效果，待在里面获得[隐身]。", "星海的涟漪": "[星海的涟漪]光环效果：场上所有拥有[时空漫游]的己方，最终受到伤害降低15%。", "巡光使": "[巡光使]✦[巡光使]正环绕在身上。✦发生交战后，[克莱雅]对攻击者、被攻击者（若有多个目标，则是生命比例最低的），各触发1次[公正审判]对应效果（根据敌我阵营）。✦此效果不会被同类效果循环触发。", "血色光辉": "[血色光辉][虔诚值]增加时，会转变为减少对应的[虔诚值]。不会受到[虔诚值]为负的效果，改为获得[虔诚值]为正的效果。", "血誓•讨敌": "[血誓•讨敌]所属干扰类，离开施加者范围2格时，每格额外消耗1点移动力。[列奥尼德•寒锋血誓]冲锋时，若处于生效位置，会随之传送至其周围。触发后移除本效果。", "血誓•守护": "[血誓•守护]标记，[列奥尼德•寒锋血誓]冲锋时，若处于生效位置，则随之传送至其周围。触发后移除本效果。", "一骑荡千军•势竭": "[一骑荡千军•势竭]期间无法自动触发[枪魂•一骑荡千军]。", "晕眩": "[晕眩]减益，属于定身类型，无法做出任何行动。", "再生": "[再生]增益，在自身行动结束时，回复一定的生命值。", "再生2": "[再生2]增益，自身行动结束时，回复20%的生命值。", "再生3": "[再生3]增益，自身行动结束时，回复30%的生命值。", "援护防御": "[援护防御]增益，守护自己行动范围内的友军，当其被单体攻击时，会与他们交换位置并承受伤害。", "意志": "[意志]增益，[受伤]状态时，受到魔法伤害降低30%。", "援护攻击": "[援护攻击]增益，准备攻击一定范围内的敌人，当其受到友军主动单体攻击时，也同时发起攻击。", "英勇": "[英勇]增益，每层物攻提高7%，最多叠加3层。若拥有3层[英勇]，攻击后，产生20%[生命汲取]。", "隐身": "[隐身]增益，无法被敌方技能选中。", "愈合•改": "[愈合•改]技能，行动结束时，治疗自身范围3格内生命值百分比最低的己方，治疗量为魔攻值的50%。", "再生1": "[再生1]增益，在自身行动结束时，回复10%的生命值。", "早餐": "[早餐]增益，行动开始时，回复15%生命值，驱散1个减益。", "斩尽": "[斩尽][个性]中攻击方式更改为[强制警戒]触发，警戒范围增加1格，警戒触发次数额外加1，且无法被打断。若触发次数消耗完，则更改为原[个性]攻击方式继续触发，不可驱散，无法免疫。", "鸢尾之姿": "[鸢尾之姿]增益，造成伤害提高40%，攻击时，无视目标20%防御。", "再行动": "[再行动]指可以再次移动及再次攻击。", "怨念之痕": "[怨念之痕]标记，奇亚主动攻击此目标后，最多额外触发奇亚1次[个性]的牺牲、伤害效果。奇亚攻击时把自身已损失生命值的10%附加在攻击上，最多附加30%。本效果不可驱散，无法免疫。", "长夜流光1": "[长夜流光1]增益，1级效果，伤害提高10%。", "长夜流光2": "[长夜流光2]增益，2级效果，伤害提高15%。", "御魔": "[御魔]护盾，防御提高30%，获得150%物攻值的[魔法护盾]；被魔法攻击前，获得[免疫控制]。本护盾不可驱散。", "再攻击": "[再攻击]状态，可再次进入攻击回合。", "绽放": "[绽放]技能，单体攻击，对目标造成110%伤害，若目标处于[花田]，则额外附加20%伤害。", "引入": "[引入]增益，无法被敌人选中，但可被[范围伤害]、[环境伤害]波及，可被[强制选中]。攻击提高30%。主动攻击后移除。", "运筹帷幄": "[运筹帷幄]增益，自身回合外，攻击提高18%。", "月廓成影": "【月廓成影】[健康]时，替[誓约]目标分摊70%所受伤害；[受伤]时，使自身和[誓约]目标受到伤害减少30%。行动结束时，瞬移至[誓约]目标身边。本效果不可驱散，无法免疫。", "佑梦": "[佑梦]\n场上所有友军获得[▲物防2]、[▲魔防2]，持续2回合。", "战场历练": "[战场历练]\n增益，攻击提高2%，受到伤害降低2%，最多叠加15层，不可驱散，无法免疫。", "炸毛": "[炸毛]增益，暴击率提高3%，暴击伤害提高3%，最多叠加8层，不可驱散。", "英灵长弓": "[英灵长弓]减益，来自装备效果，受到伤害提高10%。", "游击": "选择自身范围7格内任一[枪影]进行传送。", "隐忍": "[隐忍]受到伤害降低1%，最多可叠加20层。", "余音不绝2": "[余音不绝2]✦行动结束时，回复1点能量；若能量小于1点，则额外回复1点。✦战斗中，首次获得本效果时立即回复1点能量，获得2个随机[2级增益]。", "余音不绝1": "[余音不绝1]✦行动结束时，回复1点能量；若能量小于1点，则额外回复1点。", "悦耳": "[悦耳]光环，自身范围3格内所有己方获得[▲攻击2]。", "原初之力": "[原初之力]✦攻击力提高20%。部分专属技能处于[原初之力]期间，获得额外效果。✦行动结束时，消耗10点[人造原初烙痕]点数，若点数不足，则退出[原初之力]并受到[遗忘症]，持续1回合。", "因果牵引": "[因果牵引]（支援）选择受到[命运•注视]者的范围5格内目标，使该目标把受到[命运•注视]者向自身反向击退4格。\n}}", "战争杀器": "[战争杀器]✦每层使攻击提高，数值为[基安希尔]攻击值的1%；✦拥有10层时：攻击时，目标每受到2层[粉碎枷锁]，则自身攻击额外提高，数值为[基安希尔]攻击值的1%。✦本效果最多可叠加25层。", "元素风暴": "[元素风暴]（魔法伤害）[魔法强化]，对目标范围3格内所有敌人造成180%伤害，每额外命中1名目标，伤害倍率降低15%，最低45%。✦攻击前，攻击提高15%，暴击率提高50%，对中心范围2格目标额外施加[易伤3]，持续2回合；✦攻击后，对技能范围内目标施加1次[点燃]，并使地形变为[冰冻]，持续2回合。", "战斗狂热": "[战斗狂热]增益，攻防属性提高1%，最多叠加10层。", "远程易伤2": "[远程易伤2]受到[远程]伤害提高20%。", "战意牛角": "[战意牛角]触发物，使拾取角色[再行动]，获得额外技能[牦牛号角]。✦一旦拾取，会使自身范围2格内蛮角牦牛发怒，对其范围2格内敌人进行攻击。", "余震": "[余震]✦向受击[物品]范围3格内的其他[物品]，传导技能[裂地震]的效果。✦单次攻击内，每件[物品]只能被传导1次，每名敌人只能受到1次[裂地震]的效果。", "永冻冰堑": "【永冻冰堑】地形格，无法被[冰冻]、[燃烧]效果覆盖。\n✦若处于该地形格，主动离开时，需额外消耗1点移动力。\n✦角色途经或停留时，被施加1层[霜烬]。", "银狼形态": "[银狼形态]✦进入本形态时，可[立刻行动]。✦攻防属性提高10%，所有技能最大射程增加1格。✦攻击受到[伤口]的目标时，伤害提高20%；造成伤害后再施加[易伤2]，持续2回合。✦所有[职业技能]拥有[无视守护]。", "诱敌": "[诱敌]优先受到攻击，最多可叠加2层，被主动攻击后移除1层。", "有效移动": "[有效移动]行动内累计移动、冲锋、传送距离之和。", "咱来帮大家！1": "[咱来帮大家！]领袖光环，1级效果，场上所有阵营为的己方攻击提高10%，防御提高20%，伤害、穿透伤害提高10%。", "咱来帮大家！2": "[咱来帮大家！]领袖光环，2级效果，场上所有阵营为的己方攻击提高10%，防御提高20%，伤害、穿透伤害提高10%，对受到[压迫感]的目标、己方召唤角色额外提高8%。", "咱来帮大家！3": "[咱来帮大家！]领袖光环，3级效果，场上所有阵营为〈铃兰之剑〉的己方攻击提高10%，防御提高20%，伤害、穿透伤害提高10%，对受到[压迫感]的目标、己方召唤角色额外提高16%。", "有罪必罚": "[有罪必罚][克莱雅]每回合可发动[公正审判]效果的次数耗尽后，可消耗本效果继续触发。", "引爆时机": "[引爆时机]下一次触发[个性]的警戒攻击时：✦攻击免疫击退或传送的敌人时，攻击提高30%。✦若触发目标[附加蛊惑]，则消耗其所有[附加蛊惑]层数，一次性造成伤害倍率×消耗层数的伤害；当仅触发1名目标时，则伤害倍率额外提高40%。", "灼烧": "[灼烧]减益，每次行动结束时，损失10%生命值。不可叠加，重复添加时立刻受到1次伤害。", "致盲": "[致盲]减益，所属控制-干扰类，单体攻击有80%概率会被目标闪避。", "招架": "[招架]状态，被近战物理攻击前，转向目标，自身物攻的20%附加在物防上。", "阻挡": "[阻挡]状态，指攻击目标敌人，却被目标前的另一个敌人承受了攻击。", "重剑斩杀": "[重剑斩杀]技能，单体攻击，造成160%伤害，对目标范围1格内其他敌人，造成80%伤害。技能变更为[重剑斩]。", "重剑斩": "[重剑斩]技能，[瞬发]，选择自身十字范围内1名敌人，冲锋到其身边并造成40%伤害，击退1格。技能变更为[旋转重剑]，技能保留2回合。", "追猎": "[追猎]增益，移动力增加2格，攻击[受伤]状态的敌人时，额外回复1点能量，每回合最多触发1次。", "知识": "[知识]标记，拥有时可使用[史学技能]。", "诅咒青蛙": "[诅咒青蛙]不可对免疫[定身]角色使用。诅咒青蛙个性为：移动固定为1格。免疫[增益]、[减益]、击退、传送，且不会受到任何伤害。", "植物朋友": "[植物朋友]召唤角色，一共有倾向攻击的[刺丽瑰]、倾向治疗的[夏铃草]及倾向援防的[淡月白]三种。", "值守": "【值守】基础效果，伤害提高10%、受到伤害降低10%（基础效果，突破至4星时变为进阶效果）。不可驱散，无法免疫。", "自由意志": "[自由意志]\n增益，拥有8层时，可使用技能[自由的召唤]，最多可叠加12层。", "自由之姿1": "[自由之姿1]\n增益，释放非[瞬发]技能后，可再行动。", "自由之姿2": "[自由之姿2]增益，释放非[瞬发]技能后，可再行动，回复2点能量。", "咒铠·缚罪": "[咒铠·缚罪]增益，受到伤害降低30%。✦每拥有1个[减益]防御提高5%，最多50%；✦行动开始时，将自身范围4格内所有友军随机2个[属性减益]转移至自身；行动结束时，获得1层[咒痕]。✦本效果不可驱散，无法免疫。", "咒痕": "[咒痕]标记，在拥有[咒铠·裁罚]时有额外效果，不可驱散，无法免疫。", "咒铠·裁罚": "[咒铠·裁罚]增益，受到伤害降低15%。可产生40%[生命汲取]，移动力增加1格;伤害、暴击率提高20%，并获得[强韧]。✦行动开始时，驱散5个[减益]，并获得30%生命值的[物理护盾]。✦每次主动攻击、反击时消耗1层[咒痕]；没有[咒痕]时转为[咒铠·缚罪]。✦本效果不可驱散，无法免疫。", "征服宣言": "[征服宣言]（物理伤害）[瞬发]，攻击指定目标，造成30%范围伤害。攻击后，对目标施加6层[威压]，持续2回合；自身获得[蔑视]，持续4回合，及获得30%生命值的[物理护盾]", "整军": "[整军]标记，无法获得[个性]中[再行动]效果，不可驱散，无法免疫。若在[额外行动]期间获得本效果，则持续时间减少1回合。", "中级雇佣弓手": "[中级雇佣弓手]守望者，被召唤的召唤物角色，拥有技能[游击]、[强力射击]等。", "专注舞台": "[专注舞台]消耗10%当前生命值进行[闪避]，最多触发4次，不可驱散，无法免疫。", "准备": "[准备]等待到下个自身行动开始时，释放技能。", "召唤光棱晶石": "[召唤光棱晶石]（支援）[瞬发]，选择[空地]，召唤一个[光棱晶石]，继承自身100%基础攻防属性、120%基础生命值，最多同时存在1个；释放后，技能变更为[异位重构]，还剩余1次召唤机会。", "终曲•寒芒出鞘": "[终曲•寒芒出鞘]（治疗）[解放枷锁]、[瞬发]，消耗2层[杀机]，对目标地点范围3格内所有敌人施加[乱心](持续1回合)、5层[粉碎枷锁]；自身获得[▲治疗2]、[▲暴击2]（持续2回合）。并对范围内拥有[受治疗逆转]类效果的敌人治疗，治疗量为魔攻值的40%；再对范围内友军治疗，治疗量为魔攻值的30%。✦拥有5层以上[解放]时，消耗所有层数每消耗5层，技能中的[▲治疗2]提升1级,最多2级。", "征伐敕令": "[征伐敕令]（支援）[瞬发]，在目标空地召唤1名[帝国不朽军]，继承自身100%基础攻击值，5%基础防御值、基础生命值，每回合至多使用2次。✦[附属被动]，效果：使用本技能时，自身受到1层[兵员紧缺]，持续1回合。✦[帝 <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ROLES = DATA.roles, SKILLS = DATA.skills, PERSONAS = DATA.personas, EQUIPS = DATA.equips;
const $ = id => document.getElementById(id);
let filter = 'all', keyword = '', view = 'list';
let fS = {w:'', camps:[], ht:''};   // 武器(角色+装备)/阵营(多选)/命中类型
let lastRoles = [], lastEquips = [], browseMode = false;

function setF(k, v){
  if(k === 'camps'){
    const i = fS.camps.indexOf(v);
    if(v === ''){ fS.camps = []; }
    else if(i >= 0){ fS.camps.splice(i,1); }
    else { fS.camps.push(v); }
  } else {
    fS[k] = (fS[k] === v) ? '' : v;
  }
  if(keyword) renderResults(); else renderHome();
}
function fchip(label, k, v, extra){
  const on = (k === 'camps' ? fS.camps.includes(v) : fS[k] === v) ? ' on' : '';
  return `<button class="fchip${on}" onclick="setF('${k}','${v}')">${extra||''}${esc(label)}</button>`;
}
function filterBarHtml(){
  if(!lastRoles.length && !lastEquips.length) return '';
  const weapons = ['单手剑','长柄武器','重型武器','魔法武器','弓弩','防具'];
  const camps = Object.keys(DATA.campIcons||{});
  let h = '<div class="fbar">';
  h += `<div class="frow"><span class="flabel">武器/装备</span>${fchip('全部','w','')}${weapons.map(w=>fchip(w,'w',w)).join('')}<span class="fnote" style="flex:none;margin-left:4px">同时筛选角色武器与装备类型</span></div>`;
  h += `<div class="frow wrap"><span class="flabel">阵营${fS.camps.length>1?'（同时满足）':''}</span>${fchip('全部','camps','')}${camps.map(c=>fchip(c,'camps',c,`<img src="${DATA.campIcons[c]}" class="fcico">`)).join('')}</div>`;
  if(keyword) h += `<div class="frow"><span class="flabel">命中</span>${fchip('全部','ht','')}${['技能','个性','抉择分支'].map(t=>fchip(t,'ht',t)).join('')}</div>`;
  h += '</div>';
  return h;
}
function applyRoleFilters(){
  let out = lastRoles;
  if(fS.w) out = out.filter(x=>x.r.w===fS.w);
  if(fS.camps.length) out = out.filter(x=>fS.camps.every(c=>(x.r.c||[]).includes(c)));
  if(fS.ht){
    out = out.map(x=>({r:x.r, nameHit:false, score:x.score, hits:x.hits.filter(h=>
      fS.ht==='技能' ? h.type==='技能' :
      fS.ht==='个性' ? h.type.startsWith('个性') : h.type==='抉择分支')}))
      .filter(x=>x.hits.length);
  }
  return out;
}
function applyEquipFilters(){
  let out = lastEquips;
  if(fS.w) out = out.filter(x=>x.e.type===fS.w);
  return out;
}

document.getElementById('stats').textContent =
  `共 ${ROLES.length} 名角色 · ${Object.keys(SKILLS).length} 个技能 · ${Object.keys(PERSONAS).length} 个个性 · ${EQUIPS.length} 件装备`;

/* ---------- 工具 ---------- */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/* 广义术语映射（来自 BWIKI 中括号介绍官方定义 + 状态归属标注） */
const GROUP_MAP = {
  '定身': ['晕眩','睡眠','冰封','冰柩','失衡','被讽','跳过回合','嘲讽','魅惑'],
  '干扰': ['致盲','目眩','沙尘','缠缚','缴械','衰弱','强制直行','▼移动','×主动技','×被动技','×反应技','×援护','▼束缚视界','能量阻滞'],
  '控制': ['晕眩','睡眠','冰封','冰柩','失衡','被讽','跳过回合','嘲讽','魅惑','致盲','目眩','沙尘','缠缚','缴械','衰弱','强制直行','▼移动','×主动技','×被动技','×反应技','×闪避','击退','打断'],
  '行为减益': ['×主动技','×被动技','×反应技','×装备技','×符文技','×闪避','致盲','强制直行','晕眩','睡眠','冰封','嘲讽','▼移动'],
  '持续伤害': ['灼烧','感染','生命流失','圣痕','蚀炎','冻伤','次级冻伤','剧毒','流血','点燃','能量反噬'],
  '生命流失': ['冻伤','次级冻伤','剧毒','流血','点燃','能量反噬'],
  '属性减益': ['▼攻击','▼物防','▼魔防','▼暴击','▼暴伤','▼伤害','易伤','▼速度','▼受治疗'],
  '属性增益': ['▲攻击','▲伤害','▲暴击','▲暴伤','▲物防','▲魔防','免伤'],
  '攻击属性减益': ['▼攻击','▼伤害','▼暴击','▼暴伤'],
  '防御属性减益': ['▼物防','▼魔防','易伤'],
  '防御属性增益': ['▲物防','▲魔防','免伤'],
  '冰封类': ['冰封','冰柩']
};
/* 语义同义词表：关键词片段 -> 原文写法的正则（可扩展） */
const SEM_MAP = {
  '百分比': '\\d{1,3}%',
  '我方': '(?:己方|我方|友军|友方)',
  '己方': '(?:己方|我方|友军|友方)',
  '友方': '(?:己方|我方|友军|友方)',
  '友军': '(?:己方|我方|友军|友方)',
  '敌方': '(?:敌方|敌人|敌军)',
  '敌人': '(?:敌方|敌人|敌军)',
  '敌军': '(?:敌方|敌人|敌军)',
  '增益': '(?:▲|增益)',
  '减益': '(?:▼|减益)',
  '吸血': '(?:吸血|生命汲取)',
  '生命汲取': '(?:生命汲取|吸血)'
};
/* 广义词展开为「自身|成员」正则，长键优先 */
for(const g of Object.keys(GROUP_MAP).sort((a,b)=>b.length-a.length)){
  SEM_MAP[g] = '(?:' + [g, ...GROUP_MAP[g]].map(escRe).join('|') + ')';
}
/* 命中广义词时显示「XX类」标签 */
function groupHitTag(frag, kw){
  if(!frag || !kw) return '';
  const {rest} = parseCamp(kw);
  const k = rest || kw;
  for(const g of Object.keys(GROUP_MAP).sort((a,b)=>b.length-a.length)){
    if(k.includes(g)){
      const hit = GROUP_MAP[g].filter(m=>frag.includes(m));
      if(hit.length) return `<span class="gtg" title="${esc(g)}类：${esc(hit.slice(0,3).join('、'))}">⟡${esc(g)}类</span>`;
    }
  }
  return '';
}
/* 中括号链接：[XXX] 可点击搜索该术语（在 hl 高亮之后调用） */
function bracketLink(html){
  return html.replace(/\[([^\[\]<"']{1,20})\]/g, (m, inner)=>{
    const q = inner.replace(/<[^>]+>/g,'').trim();
    if(!q) return m;
    return `<a class="bk" onclick="event.stopPropagation();bkSearch('${q.replace(/'/g,"\\'")}')">${m}</a>`;
  });
}
function bkSearch(q){ $('q').value = q; doSearch(); }

const ALLY_RE = /我方|己方|友方|友军/;
const ENEMY_RE = /敌方|敌人|敌军/;
function campRe(camp){ return camp === 'ally' ? ALLY_RE : ENEMY_RE; }
/* 从关键词中提取阵营约束：返回 {camp:'ally'|'enemy'|null, rest:剩余关键词} */
function parseCamp(kw){
  let camp = null, rest = kw;
  if(ALLY_RE.test(kw)){ camp = 'ally'; rest = kw.replace(ALLY_RE, ''); }
  else if(ENEMY_RE.test(kw)){ camp = 'enemy'; rest = kw.replace(ENEMY_RE, ''); }
  rest = rest.replace(/^[的之与和或]+|[的之与和或]+$/g, '').trim();
  return {camp, rest};
}
/* 阵营约束匹配：rest 命中且（若有阵营约束）文本含对应阵营词；无命中返回 null */
function matchWithCamp(text, kw, camp){
  if(!text) return null;
  if(camp && !campRe(camp).test(text)) return null;
  if(!kw){
    if(!camp) return null;
    const cr = execAll(new RegExp(campRe(camp).source, 'gi'), text, 20);
    return cr.length ? cr : null;
  }
  const rs = findMatches(text, kw);
  return rs.length ? rs : null;
}
/* 检测文本中的阵营标签 */
function campTags(text){
  const tags = [];
  if(!text) return tags;
  if(ALLY_RE.test(text)) tags.push('己方');
  if(ENEMY_RE.test(text)) tags.push('敌方');
  if(/自身/.test(text)) tags.push('自身');
  return tags;
}
function campTagHtml(text){
  return campTags(text).map(t=>`<span class="ctag ${t==='己方'?'ally':t==='敌方'?'enemy':'self'}">${t}</span>`).join('');
}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function hasSem(kw){return Object.keys(SEM_MAP).some(w=>kw.includes(w))}
/* 将关键词切分为正则单元：语义词→(?:正则|原词)，普通字符→转义字符 */
function buildUnits(kw){
  const units = [];
  let i = 0;
  while(i < kw.length){
    let matched = false;
    for(const w of Object.keys(SEM_MAP)){
      if(kw.startsWith(w, i)){
        units.push('(?:' + SEM_MAP[w] + '|' + escRe(w) + ')');
        i += w.length; matched = true; break;
      }
    }
    if(!matched){ units.push(escRe(kw[i])); i++; }
  }
  return units;
}
function execAll(re, t, limit){
  const ranges = [];
  let m, guard = 0;
  re.lastIndex = 0;
  while((m = re.exec(t)) && guard++ < limit){
    if(m[0].length === 0){ re.lastIndex++; continue; }
    ranges.push({idx:m.index, len:m[0].length});
    re.lastIndex = m.index + m[0].length;
  }
  return ranges;
}
/* 模糊匹配：①精确子串 ①b语义无间隔 ②字符间允许0-3个任意字符 ③分词AND */
/* 原子术语表：并列类别词，不参与分词拆分（搜「穿透伤害」不命中「物理伤害」） */
const ATOM_WORDS = ['物理范围伤害','物理伤害','魔法伤害','穿透伤害','范围伤害','远程伤害','持续伤害','灵感伤害','百分比伤害','真实伤害','固定伤害','协同伤害','反弹伤害','穿透易伤','冰火易伤','火属性','冰属性','雷属性','沙属性','暗属性','光属性','物理护盾','魔法护盾','属性减益','属性增益','生命流失','能量反噬'];
function isAtom(kw){ return ATOM_WORDS.some(a=>kw.includes(a)); }

function findMatches(text, kw){
  if(!kw || !text) return [];
  const t = String(text), tl = t.toLowerCase(), k = kw.toLowerCase();
  // ① 精确
  let ranges = [];
  let i = tl.indexOf(k);
  while(i >= 0){ ranges.push({idx:i, len:kw.length}); i = tl.indexOf(k, i+kw.length); }
  if(ranges.length) return ranges;
  const sem = hasSem(kw);
  // ①b 语义无间隔（如「百分比」命中「10%」）
  if(sem){
    ranges = execAll(new RegExp(buildUnits(kw).join(''), 'gi'), t, 20);
    if(ranges.length) return ranges;
  }
  // ② 近距离模糊（关键词≥3字）
  if(kw.length >= 3){
    ranges = execAll(new RegExp(buildUnits(kw).join('[\\s\\S]{0,3}?'), 'gi'), t, 20);
    if(ranges.length) return ranges;
  }
  // ③ 分词 AND：原子术语不拆分（避免「穿透伤害」拆成「穿透」+「伤害」误命中「物理伤害」）
  if(isAtom(kw)) return [];
  let segsList = [];
  const segs = kw.split(/[的之与和或]/).filter(p=>p.length>=2);
  if(segs.length >= 2){
    segsList = [segs];
  } else if(kw.length >= 4){
    for(let i=2;i<=kw.length-2;i++) segsList.push([kw.slice(0,i), kw.slice(i)]);
  }
  for(const ss of segsList){
    let all = [], ok = true;
    for(const seg of ss){
      const rs = findMatches(t, seg);
      if(!rs.length){ ok = false; break; }
      all = all.concat(rs);
    }
    if(ok){ all.sort((a,b)=>a.idx-b.idx); return all; }
  }
  return [];
}
function findMatch(text, kw){
  const r = findMatches(text, kw);
  return r.length ? r[0] : null;
}
/* 匹配级别：3=精确子串 2=语义 1=近距离模糊 0.5=分词AND 0=无 */
function matchLevel(text, kw){
  if(!kw || !text) return 0;
  const t = String(text), tl = t.toLowerCase(), k = kw.toLowerCase();
  if(tl.includes(k)) return 3;
  try{
    if(hasSem(kw) && new RegExp(buildUnits(kw).join(''), 'i').test(t)) return 2;
    if(kw.length >= 3 && new RegExp(buildUnits(kw).join('[\\s\\S]{0,3}?'), 'i').test(t)) return 1;
  }catch(e){}
  return 0.5;
}
function hl(text, kw){
  if(!kw) return esc(text);
  const {camp, rest} = parseCamp(kw);
  let parts = [];
  if(rest) parts = parts.concat(findMatches(text, rest));
  if(camp) parts = parts.concat(execAll(new RegExp(campRe(camp).source, 'gi'), text, 30));
  if(!rest && !camp) parts = findMatches(text, kw);
  if(!parts.length) return esc(text);
  parts.sort((a,b)=>a.idx-b.idx);
  let result = '', pos = 0;
  for(const r of parts){
    if(r.idx < pos) continue;
    result += esc(text.slice(pos, r.idx)) + '<mark>' + esc(text.substr(r.idx, r.len)) + '</mark>';
    pos = r.idx + r.len;
  }
  return result + esc(text.slice(pos));
}
function snippet(text, kw, len=46){
  if(!text) return '';
  const {rest} = parseCamp(kw);
  const m = findMatch(text, rest || kw);
  if(!m) return String(text).slice(0, len) + (text.length>len?'…':'');
  const start = Math.max(0, m.idx-14);
  const end = Math.min(text.length, m.idx + m.len + len - 20);
  return (start>0?'…':'') + text.slice(start, end) + (end<text.length?'…':'');
}

/* ---------- 搜索 ---------- */
/* 阵营图标标签 */
function campIconHtml(camps){
  return (camps||[]).map(cn=>`<span class="fac"><img src="${DATA.campIcons[cn]||''}" alt="${esc(cn)}" loading="lazy" onerror="this.style.display='none'">${esc(cn)}</span>`).join('');
}
function searchRoles(kw){
  const {camp, rest} = parseCamp(kw);
  const nameKw = rest || kw;
  const out = [];
  for(const r of ROLES){
    const campHit = (r.c||[]).some(cn=>findMatch(cn, nameKw));
    if(!camp && (findMatch(r.n, kw) || campHit)){ out.push({r, hits:[], nameHit:true, score:4}); continue; }
    if(camp && campHit && !rest){ out.push({r, hits:[], nameHit:true, score:4}); continue; }
    const hits = [];
    // 个性（含1-5星各档，含阵营约束）
    if(r.p){
      const p = PERSONAS[r.p];
      if(findMatch(r.p, nameKw) && (!camp || campRe(camp).test((p&&p.d)||'')))
        hits.push({type:'个性', name:r.p, frag:(p&&p.d)||''});
      else if(p){
        const ds = p.ds || {};
        for(let star=1; star<=5; star++){
          const d = ds[String(star)];
          if(d && matchWithCamp(d, rest, camp)){
            hits.push({type:`个性·${star}星`, name:r.p, frag:d});
            break;
          }
        }
      }
      // 个性赋予的技能（如潜袭）
      if(p && p.sk){
        for(const sn of p.sk){
          const s2 = SKILLS[sn];
          if(!s2) continue;
          if(findMatch(sn, nameKw) && (!camp || campRe(camp).test(s2.d||'')))
            hits.push({type:'个性技能', name:sn, frag:s2.d, via:r.p});
          else if(matchWithCamp(s2.d, rest, camp))
            hits.push({type:'个性技能', name:sn, frag:s2.d, via:r.p});
        }
      }
    }
    // 技能（含阵营约束）+ 抉择分支
    for(const sn of r.s){
      const s = SKILLS[sn];
      if(findMatch(sn, nameKw) && (!camp || campRe(camp).test((s&&s.d)||'')))
        hits.push({type:'技能', name:sn, frag:s?s.d:''});
      else if(s && matchWithCamp(s.d, rest, camp))
        hits.push({type:'技能', name:sn, frag:s.d});
      // 抉择分支技能也可被搜到
      if(s && s.ch){
        for(const bn of s.ch){
          const b = SKILLS[bn];
          if(!b) continue;
          if(findMatch(bn, nameKw) && (!camp || campRe(camp).test(b.d||'')))
            hits.push({type:'抉择分支', name:bn, frag:b.d, via:sn});
          else if(matchWithCamp(b.d, rest, camp))
            hits.push({type:'抉择分支', name:bn, frag:b.d, via:sn});
        }
      }
    }
    if(hits.length){
      // 按匹配度排序：精确>语义>模糊>分词
      for(const h of hits) h.score = matchLevel(h.frag, nameKw) || matchLevel(h.name, nameKw);
      hits.sort((a,b)=>(b.score||0)-(a.score||0));
      out.push({r, hits, nameHit:false, score: Math.max(...hits.map(h=>h.score||0))});
    }
  }
  return out;
}
function searchEquips(kw){
  const {camp, rest} = parseCamp(kw);
  const nameKw = rest || kw;
  const out = [];
  for(const e of EQUIPS){
    let hit = null;
    if(findMatch(e.name, nameKw) || findMatch(e.type, nameKw) || findMatch(e.source, nameKw))
      hit = {frag: e.desc || ''};
    if(!hit && matchWithCamp(e.desc, rest, camp)) hit = {frag: e.desc};
    if(!hit){
      const stars = e.stars || {};
      for(let star=1; star<=5; star++){
        const d = stars[String(star)];
        if(d && matchWithCamp(d, rest, camp)){ hit = {frag: d, star}; break; }
      }
    }
    if(hit && camp){
      const allText = [e.desc, ...Object.values(e.stars||{})].join('');
      if(!campRe(camp).test(allText)) hit = null;
    }
    if(hit){
      const lv = matchLevel(hit.frag, nameKw) || matchLevel(e.name, nameKw) || matchLevel(e.type, nameKw);
      out.push({e, hit, score: findMatch(e.name, nameKw) ? 3.5 : lv});
    }
  }
  out.sort((a,b)=>(b.score||0)-(a.score||0));
  return out;
}

function doSearch(){
  const kw = $('q').value.trim();
  keyword = kw;
  view = 'list';
  if(!kw){ renderHome(); return; }
  lastRoles = searchRoles(kw);
  lastEquips = searchEquips(kw);
  renderResults();
}

function renderResults(){
  const kw = keyword;
  const roles = applyRoleFilters().sort((a,b)=>(b.score||0)-(a.score||0));
  let html = filterBarHtml();
  // 中括号状态介绍
  const bkTxt = kw && DATA.bracketInfo && DATA.bracketInfo[kw];
  const bkSug = kw && !bkTxt && DATA.bracketInfo ? Object.keys(DATA.bracketInfo).find(k=>DATA.bracketInfo[k].includes(kw)) : '';
  if(bkTxt) html += `<div class="bkinfo">${bracketLink(hl(bkTxt,kw))}</div>`;
  else if(bkSug) html += `<div class="bkinfo">${bracketLink(hl(DATA.bracketInfo[bkSug],bkSug))} <span class="fnote">← 中括号状态「${esc(bkSug)}」</span></div>`;
  if(filter==='all' || filter==='role'){
    html += `<div class="sect-title">角色 <span class="badge">${roles.length}</span>${(fS.w||fS.camps.length||fS.ht)?`<span class="fnote">（已筛选，原 ${lastRoles.length}）</span>`:''}</div>`;
    if(!roles.length) html += `<div class="empty">${kw?`没有角色命中「${esc(kw)}」`:'没有角色'}${(fS.w||fS.camps.length||fS.ht)?'（当前筛选条件下）':''}</div>`;
    for(const {r, hits, nameHit} of roles){
      let hitHtml = '';
      if(nameHit){
        hitHtml = `<div class="hit"><b>角色名称命中</b></div>`;
      } else {
        const show = hits.slice(0,3).map(h =>
          `<div class="hit">${campTagHtml(h.frag)}${groupHitTag(h.frag,kw)}<b>[${h.type}] ${hl(h.name,kw)}</b>${h.via?`<span class="via">← ${esc(h.via)}</span>`:''}：${bracketLink(hl(snippet(h.frag,kw),kw))}</div>`).join('');
        const more = hits.length>3 ? `<div class="hit"><span class="more">…还有 ${hits.length-3} 处命中，点击查看全部</span></div>` : '';
        hitHtml = show + more;
      }
      html += `<div class="card" onclick="showRole(${ROLES.indexOf(r)})">
        <div class="row1">${r.ic?`<img class="ravatar" src="${r.ic}" loading="lazy" onerror="this.style.display='none'">`:''}<span class="name">${hl(r.n,kw)}</span>
        ${r.ra?`<span class="tag gold">${esc(r.ra)}</span>`:''}
        ${r.w?`<span class="tag gray">${esc(r.w)}</span>`:''}
        </div>
        <div class="facs">${campIconHtml(r.c)}${r.p?`<span class="tag">个性：${esc(r.p)}</span>`:''}</div>
        <div class="hits">${hitHtml}</div></div>`;
    }
  }
  if(filter==='all' || filter==='equip'){
    const equips = applyEquipFilters();
    html += `<div class="sect-title">装备 <span class="badge">${equips.length}</span>${fS.w?`<span class="fnote">（已筛选，原 ${lastEquips.length}）</span>`:''}</div>`;
    if(!equips.length) html += `<div class="empty">${kw?`没有装备命中「${esc(kw)}」`:'没有装备'}${fS.w?'（当前筛选条件下）':''}</div>`;
    for(const {e, hit} of equips){
      const starTag = hit.star ? `<span class="tag gold">${hit.star}星命中</span>` : '';
      html += `<div class="card" onclick="showEquip(${EQUIPS.indexOf(e)})">
        <div class="row1"><span class="name">${hl(e.name,kw)}</span>
        <span class="tag gray">${esc(e.type)}</span>${starTag}</div>
        <div class="hits"><div class="hit">${hl(snippet(hit.frag,kw,60),kw)}</div></div></div>`;
    }
  }
  $('main').innerHTML = html;
  window.scrollTo({top:0});
}

function renderHome(){
  const hot = ['冰冻','治疗','反击','召唤','护盾','暴击','燃烧','传送','生命汲取','先制'];
  // 浏览模式：全量数据 + filter
  lastRoles = ROLES.map(r=>({r, hits:[], nameHit:true, score:0}));
  lastEquips = EQUIPS.map(e=>({e, hit:{frag:e.desc||''}, score:0}));
  const hasF = fS.w || fS.camps.length;
  if(!hasF){
    $('main').innerHTML = `<div class="empty">输入关键词开始搜索，或用下方筛选浏览全部图鉴<br>支持搜索角色的<b>技能描述</b>、<b>个性描述</b>与<b>装备效果</b>
      <div class="hot">${hot.map(h=>`<button onclick="quick('${h}')">${h}</button>`).join('')}</div></div>`
      + filterBarHtml();
    return;
  }
  renderResults();
}
function quick(k){ $('q').value = k; doSearch(); }

/* ---------- 详情 ---------- */
function wikiUrl(kind, name){
  return 'https://wiki.biligame.com/llzj/' + encodeURIComponent(kind + '/' + name);
}
function showRole(idx){
  const r = ROLES[idx]; view = 'detail';
  let html = `<div class="detail">
    <button class="back" onclick="back()">← 返回结果</button>
    <h2>${r.ic?`<img class="ravatar-lg" src="${r.ic}" loading="lazy" onerror="this.style.display='none'">`:''}${esc(r.n)} ${r.ra?`<span class="tag gold">${esc(r.ra)}</span>`:''} ${r.w?`<span class="tag gray">${esc(r.w)}</span>`:''}</h2>
    <div class="facs" style="margin:6px 0 2px">${campIconHtml(r.c)}</div>
    <a class="wiki-link" href="${r.url}" target="_blank">查看 BWIKI 页面 ↗</a>`;
  if(r.p){
    const p = PERSONAS[r.p];
    const ds = (p && p.ds) || {};
    const pTags = campTagHtml(Object.values(ds).join('') || (p&&p.d) || '');
    html += `<div class="block"><h3>个性 · <a class="plink" onclick="bkSearch('${esc(r.p).replace(/'/g,"\\'")}')">${esc(r.p)}</a> <span class="fnote">（点击查看拥有此个性的角色）</span> ${pTags}</h3>`;
    if(p && p.sk && p.sk.length){
      html += `<div class="fnote grant-title">🎯 个性赋予技能</div>`;
      for(const sn of p.sk){
        const s2 = SKILLS[sn];
        if(!s2) continue;
        const desc = bracketLink(s2.d || '');
        html += `<div class="skill-item ps-item"><div class="skill-head" onclick="this.parentNode.classList.toggle('open')">`
          + `${DATA.skillIcons && DATA.skillIcons[sn] ? `<img class="sicon" src="${DATA.skillIcons[sn]}" loading="lazy" onerror="this.style.display='none'">` : ``}`
          + `<span class="sname">${hl(sn,keyword)}</span>${s2.t ? `<span class="tag">${esc(s2.t)}</span>` : ``}`
          + `<span class="chev">▸</span></div>`
          + `<div class="skill-body"><div class="desc">${desc}</div></div></div>`;
      }
    }
    const starNames = ['','一星','二星','三星','四星','五星'];
    for(let star=5; star>=1; star--){
      const d = ds[String(star)];
      if(!d) continue;
      html += `<div class="star-row"><span class="star-label${star===5?' max':''}">${starNames[star]}</span>
        <div class="desc">${bracketLink(hl(d,keyword))}</div></div>`;
    }
    html += `<a class="wiki-link" href="${wikiUrl('个性',r.p)}" target="_blank">个性 BWIKI ↗</a></div>`;
  }
  html += `<div class="block"><h3>技能（${r.s.length}）</h3>`;
  for(const sn of r.s){
    const s = SKILLS[sn] || {};
    const tags = [
      s.t?`<span class="tag">${esc(s.t)}</span>`:'',
      s.c?`<span class="tag gray">消耗 ${esc(s.c)}</span>`:'',
      s.cd?`<span class="tag gray">冷却 ${esc(s.cd)}</span>`:'',
      s.r?`<span class="tag gray">射程 ${esc(s.r)}</span>`:'',
      s.a?`<span class="tag gray">范围 ${esc(s.a)}</span>`:'',
    ].join('');
    html += `<div class="skill-item" id="sk-${idx}-${r.s.indexOf(sn)}">
      <div class="skill-head" onclick="this.parentNode.classList.toggle('open')">
        ${DATA.skillIcons&&DATA.skillIcons[sn]?`<img class="sicon" src="${DATA.skillIcons[sn]}" loading="lazy" onerror="this.style.display='none'">`:''}<span class="sname">${hl(sn,keyword)}</span>${campTagHtml(s.d||'')}${tags}${s.ch?'<span class="tag choice">抉择</span>':''}<span class="arrow">▶</span></div>
      <div class="skill-body"><div class="skill-tags">${(s.rs&&s.rs.length)?`<div class="relrow"><span class="flabel">关联技能</span>${s.rs.map(x=>`<a class="bk" onclick="event.stopPropagation();bkSearch('${x.replace(/'/g,"\\'")}')">${esc(x)}</a>`).join('')}</div>`:''}${(s.rr&&s.rr.length)?`<div class="relrow"><span class="flabel">关联角色</span>${s.rr.map(x=>{const ri=ROLES.findIndex(rr=>rr.n===x);return `<a class="bk" onclick="event.stopPropagation();${ri>=0?`showRole(${ri})`:`bkSearch('${x.replace(/'/g,"\\'")}')`}">${esc(x)}</a>`;}).join('')}</div>`:''}</div>
        <div class="desc">${bracketLink(hl(s.d||'（暂无描述）',keyword))}</div>
        ${s.ch?`<div class="branches"><div class="br-title">▸ 抉择分支（${s.ch.length}）</div>${s.ch.map(bn=>{
          const b = SKILLS[bn]||{};
          return `<div class="br-item">${DATA.skillIcons&&DATA.skillIcons[bn]?`<img class="sicon" src="${DATA.skillIcons[bn]}" loading="lazy" onerror="this.style.display='none'">`:''}<b>${hl(bn,keyword)}</b><span class="tag gray">${esc(b.t||'')}</span><div class="desc">${bracketLink(hl(b.d||'',keyword))}</div></div>`;
        }).join('')}</div>`:''}
        <a class="wiki-link" href="${wikiUrl('技能图鉴库',sn)}" target="_blank">技能 BWIKI ↗</a>
      </div></div>`;
  }
  html += `</div></div>`;
  $('main').innerHTML = html;
  window.scrollTo({top:0});
  // 自动展开命中的技能（含模糊匹配）
  if(keyword){
    document.querySelectorAll('.skill-item').forEach(el=>{
      if(findMatch(el.textContent, keyword)) el.classList.add('open');
    });
  }
}
function showEquip(idx){
  const e = EQUIPS[idx]; view = 'detail';
  const stars = e.stars || {};
  const starNames = ['','一星','二星','三星','四星','五星'];
  let starHtml = '';
  for(let star=5; star>=1; star--){
    const d = stars[String(star)];
    if(!d) continue;
    starHtml += `<div class="star-row"><span class="star-label${star===5?' max':''}">${starNames[star]}</span>
      <div class="desc">${bracketLink(hl(d,keyword))}</div></div>`;
  }
  if(!starHtml && e.desc) starHtml = `<div class="desc">${bracketLink(hl(e.desc,keyword))}</div>`;
  const allEqText = [e.desc, ...Object.values(stars)].join('');
  $('main').innerHTML = `<div class="detail">
    <button class="back" onclick="back()">← 返回结果</button>
    <h2>${esc(e.name)} <span class="tag gray">${esc(e.type)}</span>${campTagHtml(allEqText)}</h2>
    <div class="meta">来源：${esc(e.source||'—')}${e.fit?` · 适合：${esc(e.fit)}`:''}</div>
    ${e.flavor?`<div class="block"><h3>装备描述</h3><div class="desc flavor">${esc(e.flavor)}</div></div>`:''}
    <div class="block"><h3>各星级效果</h3>${starHtml}</div>
    <a class="wiki-link" href="${e.url}" target="_blank">查看 BWIKI 页面 ↗</a>
  </div>`;
  window.scrollTo({top:0});
}
function back(){
  view = 'list';
  if(keyword) doSearch(); else renderHome();
}

/* ---------- 事件 ---------- */
$('q').addEventListener('input', ()=>{ if(!$('q').value.trim()) renderHome(); });
$('q').addEventListener('keydown', e=>{ if(e.key==='Enter') doSearch(); });
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); filter = c.dataset.f;
  if(keyword) doSearch();
}));
window.addEventListener('scroll',()=>{
  $('backTop').style.display = window.scrollY>300 ? 'block':'none';
});
renderHome();
</script>
</body>
</html>
